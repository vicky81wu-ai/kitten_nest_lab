<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kitten Nest Local Image Reset</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:#160d13;color:#ffeef2}
  main{max-width:720px;margin:0 auto;padding:26px 18px 44px}
  h1{margin:0 0 8px;font-size:27px;line-height:1.15}
  p{color:rgba(255,238,242,.74);line-height:1.55;margin:8px 0 18px}
  .card{border-radius:24px;background:rgba(255,244,247,.92);color:#69394a;box-shadow:0 18px 46px rgba(0,0,0,.28);padding:16px;margin:14px 0;border:1px solid rgba(255,255,255,.48)}
  .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(105,57,74,.12)}
  .row:last-child{border-bottom:0}
  .name{font-weight:800}.state{display:block;margin-top:4px;font-size:12px;opacity:.72;word-break:break-all}
  button,a.btn{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14),0 6px 16px rgba(0,0,0,.08);font-weight:700;font-size:14px}
  .danger{background:#ffe5eb;color:#92223b}.primary{background:#eafff1;color:#215c37}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .log{margin-top:14px;padding:12px;border-radius:16px;background:rgba(255,244,247,.1);color:rgba(255,238,242,.76);font-size:13px;line-height:1.5;white-space:pre-wrap}
</style>
</head>
<body>
<main>
  <h1>Kitten Nest 本地图清理</h1>
  <p>这个页面只清除当前设备浏览器里的本地图 override。不会删除 Supabase 云端图片，也不会删除 GitHub fallback。</p>
  <section class="card" id="card"></section>
  <div class="bar">
    <button class="danger" id="clearAll">清除三张主图本地 override</button>
    <a class="btn primary" href="/cloud?v=after-local-reset-1">回到 /cloud</a>
  </div>
  <div class="log" id="log">ready.</div>
</main>
<script>
const DB = 'kittenNestLabDB';
const STORE = 'images';
const ITEMS = [
  ['homeOn', '主页亮图'],
  ['homeOff', '主页暗图'],
  ['gameRoom', '第二房间 / 咖啡角']
];

function log(text){ document.getElementById('log').textContent += '\n' + text; }

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getItem(key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const q = tx.objectStore(STORE).get(key);
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
}

async function deleteItem(key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function render(){
  const card = document.getElementById('card');
  card.innerHTML = '';
  for(const [key, label] of ITEMS){
    const value = await getItem(key).catch(() => null);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div><span class="name">${label}</span><span class="state">${value ? '当前来源：本地图 local override' : '当前来源：云端默认 / fallback'}</span></div><button data-key="${key}">清除</button>`;
    card.appendChild(row);
  }
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-key]');
  if(!btn) return;
  const key = btn.dataset.key;
  btn.disabled = true;
  await deleteItem(key);
  log('deleted local override: ' + key);
  await render();
  btn.disabled = false;
});

document.getElementById('clearAll').onclick = async () => {
  for(const [key] of ITEMS){
    await deleteItem(key);
    log('deleted local override: ' + key);
  }
  await render();
};

render().catch(err => log('ERROR: ' + err.message));
</script>
</body>
</html>
