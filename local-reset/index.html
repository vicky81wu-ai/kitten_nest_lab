<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kitten Nest 撤下本地图</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5 0%,#ffeef4 48%,#f7edf7 100%);color:#684054}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 8%,rgba(255,212,225,.72),transparent 28%),radial-gradient(circle at 86% 16%,rgba(255,238,198,.68),transparent 24%);z-index:-1}
  main{max-width:760px;margin:0 auto;padding:26px 18px 44px}
  .hero{border-radius:30px;padding:18px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 48px rgba(121,68,88,.14),inset 0 0 0 1px rgba(255,225,235,.55);backdrop-filter:blur(16px)}
  h1{margin:0 0 8px;font-size:28px;line-height:1.15;color:#63364a}
  p{color:#8b6474;line-height:1.55;margin:8px 0 14px}.note{border-radius:18px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.78);padding:12px 13px;margin:14px 0;color:#7b5260;font-size:13px;line-height:1.55}
  .card{border-radius:24px;background:rgba(255,255,255,.78);color:#69394a;box-shadow:0 16px 38px rgba(121,68,88,.14);padding:16px;margin:14px 0;border:1px solid rgba(255,255,255,.9)}
  .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(105,57,74,.12)}.row:last-child{border-bottom:0}
  .name{font-weight:800}.state{display:block;margin-top:4px;font-size:12px;opacity:.72;word-break:break-all}
  button,a.btn{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14),0 6px 16px rgba(121,68,88,.1);font-weight:800;font-size:14px}button:disabled{opacity:.58}.danger{background:#ffe5eb;color:#92223b}.primary{background:#eafff1;color:#215c37}.soft{background:#fff8df;color:#6d4a10}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .log{margin-top:14px;padding:12px;border-radius:16px;background:rgba(255,255,255,.54);color:#8b6474;font-size:13px;line-height:1.5;white-space:pre-wrap;border:1px solid rgba(255,255,255,.72)}
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>撤下本地图</h1>
    <p>清除当前浏览器/当前容器里的本地图 override，恢复云端默认图。不会删除 Supabase 云端图片，也不会删除 GitHub fallback。</p>
    <div class="note">测本地图请用普通 Safari 或屏幕窝/PWA，不要用无痕浏览。无痕适合测云端默认图，不适合判断本地图上传/清除。</div>
  </section>
  <section class="card" id="card"></section>
  <div class="bar">
    <button class="soft" id="clearCoffeeGo">撤下咖啡角本地图并回 /cloud</button>
    <button class="danger" id="clearAll">撤下三张主图本地图</button>
    <a class="btn primary" href="/cloud?v=after-remove-local-image">只回到 /cloud</a>
  </div>
  <div class="log" id="log">ready.</div>
</main>
<script>
const DB = 'kittenNestLabDB';
const STORE = 'images';
const ITEMS = [
  ['homeOn', '主页亮图'],
  ['homeOff', '主页暗图'],
  ['gameRoom', '第二房间 / 咖啡角']
];
function log(text){ document.getElementById('log').textContent += '\n' + text; }
function goCloud(){ location.href = '/cloud?v=after-remove-local-image-' + Date.now(); }
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => { const db = req.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function getItem(key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const q = tx.objectStore(STORE).get(key);
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
}
async function deleteItem(key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function render(){
  const card = document.getElementById('card');
  card.innerHTML = '';
  for(const [key, label] of ITEMS){
    const value = await getItem(key).catch(() => null);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div><span class="name">${label}</span><span class="state">${value ? '当前来源：本地图 local override' : '当前来源：云端默认 / fallback'}</span></div><button data-key="${key}">撤下</button>`;
    card.appendChild(row);
  }
}
document.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-key]');
  if(!btn) return;
  const key = btn.dataset.key;
  btn.disabled = true;
  await deleteItem(key);
  log('removed local override: ' + key);
  await render();
  btn.disabled = false;
});
document.getElementById('clearCoffeeGo').onclick = async e => {
  e.currentTarget.disabled = true;
  await deleteItem('gameRoom');
  log('removed local override: gameRoom');
  await render();
  goCloud();
};
document.getElementById('clearAll').onclick = async e => {
  e.currentTarget.disabled = true;
  for(const [key] of ITEMS){ await deleteItem(key); log('removed local override: ' + key); }
  await render();
  e.currentTarget.disabled = false;
};
render().catch(err => log('ERROR: ' + err.message));
</script>
</body>
</html>
