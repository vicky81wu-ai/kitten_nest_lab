<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Lap Close Envelope Safety</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{margin:0;min-height:100dvh;padding:18px;background:linear-gradient(180deg,#fff4f7,#ecd4dc);color:#673748}.wrap{width:min(94vw,720px);margin:0 auto}.card{border-radius:24px;background:rgba(255,255,255,.76);padding:16px;margin:13px 0;box-shadow:0 16px 44px rgba(86,37,55,.15)}h1{text-align:center;font-size:23px;margin:10px 0}.hint,.small{font-size:13px;line-height:1.55;opacity:.74}label{display:block;font-size:13px;margin:12px 0 6px}input,textarea{width:100%;border:0;border-radius:16px;padding:13px;background:rgba(255,255,255,.88);box-shadow:inset 0 0 0 1px rgba(116,52,73,.13);font-size:15px;color:#673748;outline:none}textarea{min-height:145px;resize:vertical}button{width:100%;border:0;border-radius:18px;margin-top:10px;padding:13px;background:#774052;color:white;font-weight:800;font-size:15px}button.secondary{background:rgba(255,255,255,.78);color:#774052;box-shadow:inset 0 0 0 1px rgba(119,64,82,.14)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;border-radius:18px;padding:13px;background:rgba(255,255,255,.78);overflow:auto}.links{display:flex;gap:10px}.links a{flex:1;text-align:center;text-decoration:none;color:#774052;background:rgba(255,255,255,.62);border-radius:14px;padding:10px;font-size:13px}
</style>
</head>
<body>
<main class="wrap">
<h1>Lap Close Envelope Safety</h1>
<section class="card"><p class="hint">只测试 coffeeCornerLapCloseBubble 的 envelope dry-run / 写入，不碰粉本本、天气、普通咖啡角。</p><div class="links"><a href="/text-target-envelope-dry-run.html">Envelope tester</a><a href="/cloud?v=lapEnvelopeSmoke">/cloud</a></div></section>
<section class="card"><label for="token">Nest token</label><input id="token" autocomplete="off" placeholder="paste token here"><label for="text">Text</label><textarea id="text">坐稳，小猫。
Envelope lap smoke test.</textarea><div class="row"><button id="dry" class="secondary">Dry run</button><button id="write">Write lap bubble</button></div></section>
<section class="card"><div id="result" class="out">尚未发送。</div></section>
</main>
<script>
(function(){
const tokenBox=document.getElementById('token'), textBox=document.getElementById('text'), resultBox=document.getElementById('result');const saved=localStorage.getItem('kittenNestToken');if(saved)tokenBox.value=saved;function pretty(o){return JSON.stringify(o,null,2)}function token(){const t=tokenBox.value.trim();if(t)localStorage.setItem('kittenNestToken',t);return t}async function send(dryRun){try{const t=token();if(!t)throw new Error('Need token.');resultBox.textContent=dryRun?'Sending dry run...':'Writing lap bubble...';const body={textTarget:{targetId:'coffeeCornerLapCloseBubble',mode:'publish',text:textBox.value,dryRun:dryRun}};const res=await fetch('/api/set-state',{method:'POST',headers:{'Content-Type':'application/json','X-Nest-Token':t},body:JSON.stringify(body),cache:'no-store'});const data=await res.json();resultBox.textContent=pretty({httpStatus:res.status,request:body,response:data})}catch(e){resultBox.textContent=pretty({ok:false,error:e.message})}}document.getElementById('dry').onclick=function(){send(true)};document.getElementById('write').onclick=function(){send(false)};
})();
</script>
</body>
</html>
