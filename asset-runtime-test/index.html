<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asset Runtime Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5,#ffeef4,#f7edf7);color:#684054}main{max-width:820px;margin:0 auto;padding:24px 16px}.card{border-radius:28px;background:rgba(255,255,255,.78);padding:18px;margin:14px 0;box-shadow:0 18px 48px rgba(121,68,88,.14)}h1,h2{margin:0 0 8px;color:#63364a}p{color:#8b6474;line-height:1.55}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}a,button{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;font-weight:800;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14)}.primary{background:#eafff1;color:#215c37}img{width:100%;border-radius:22px;background:#fff0f4;display:block}.log{white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.6);border-radius:16px;padding:12px;margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#fff2f7;font-size:11px;margin:2px 4px 2px 0}</style></head><body><main><section class="card"><h1>运行时绑定读取测试</h1><p>模拟未来 /cloud：从 room_asset_slots 找当前 asset，再从 nest_assets 拿 public_url 显示图片。</p><div class="bar"><a href="/assets-bind-latest-test/">绑定测试</a><a href="/assets-admin/">素材库后台</a><a class="primary" href="/cloud">回 /cloud</a></div></section><section class="card"><h2>coffeeCorner / background.main 当前图</h2><div id="tags"></div><img id="img" alt="runtime asset" style="display:none"><div id="log" class="log">loading...</div></section></main><script>const SUPA='https://pmkxzmogolxllijzqnfr.supabase.co';const KEY='sb_publishable_a_E9X0r3m6i641s0KluUrg_squa6uc_';const log=document.getElementById('log');function out(x){log.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function get(path){const r=await fetch(`${SUPA}/rest/v1/${path}`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,Accept:'application/json'}});const d=await r.json().catch(()=>[]);if(!r.ok)throw new Error(r.status+' '+JSON.stringify(d));return d}async function run(){out('reading room_asset_slots...');const slots=await get('room_asset_slots?select=room_id,slot,asset_id,status&room_id=eq.coffeeCorner&slot=eq.background.main&limit=1');if(!slots.length)throw new Error('slot not found');const slot=slots[0];out({step:'slot',slot});const assets=await get('nest_assets?select=asset_id,room_id,status,storage_path,public_url&asset_id=eq.'+encodeURIComponent(slot.asset_id)+'&status=eq.published&limit=1');if(!assets.length)throw new Error('published asset not found for '+slot.asset_id);const asset=assets[0];document.getElementById('tags').innerHTML=`<span class="tag">${asset.status}</span><span class="tag">${asset.room_id}</span><span class="tag">${slot.slot}</span>`;const img=document.getElementById('img');img.src=asset.public_url+'?v='+Date.now();img.style.display='block';img.onload=()=>out({ok:true,message:'runtime binding read succeeded',slot,asset,image:{naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}});img.onerror=()=>out({ok:false,message:'image failed to load',slot,asset});}run().catch(e=>out('ERROR: '+e.message));</script></body></html>
