<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kitten Nest Lap Clean V3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120b12;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#fff}
body{position:fixed;inset:0}
iframe{position:fixed;inset:0;width:100vw;height:100lvh;border:0;background:#120b12}
.badge{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 8px);z-index:10;max-width:calc(100vw - 20px);padding:6px 9px;border-radius:999px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11px;line-height:1.2;color:rgba(255,255,255,.82);pointer-events:none;opacity:.72}
</style>
</head>
<body>
<iframe id="cloudFrame" src="/cloud?lapCleanHarness=1&v=20260614-lap-clean-v3" title="Kitten Nest Cloud Lap Clean V3"></iframe>
<div class="badge">Clean V3：真实 /cloud + v3 controller；主窝坐腿入口仍暂停</div>
<script>
(function(){
  var frame = document.getElementById('cloudFrame');
  var controllerSrc = '/assets/coffee-corner-lap-clean-controller.js?v=20260614-clean-3';
  function doc(){ try { return frame.contentWindow && frame.contentWindow.document; } catch(e){ return null; } }
  function win(){ try { return frame.contentWindow; } catch(e){ return null; } }
  function inject(){
    var d = doc();
    if(!d || !d.body) return false;
    var w = win();
    if(!w) return false;
    if(w.KittenNestLapClean && w.KittenNestLapClean.start){ w.KittenNestLapClean.start({ debug:false }); return true; }
    if(d.getElementById('lapCleanControllerScript')) return false;
    var s = d.createElement('script');
    s.id = 'lapCleanControllerScript';
    s.src = controllerSrc;
    s.onload = function(){ if(w.KittenNestLapClean && w.KittenNestLapClean.start){ w.KittenNestLapClean.start({ debug:false }); } };
    d.body.appendChild(s);
    return true;
  }
  frame.addEventListener('load', function(){
    var timer = setInterval(inject, 220);
    setTimeout(function(){ clearInterval(timer); }, 7000);
  });
})();
</script>
</body>
</html>
