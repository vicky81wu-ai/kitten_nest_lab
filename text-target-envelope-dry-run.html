<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Text Target Envelope Dry Run</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#fff4f7,#ecd4dc);color:#673748;padding:18px}.wrap{width:min(94vw,760px);margin:0 auto 28px}.card{border-radius:26px;background:rgba(255,255,255,.74);box-shadow:0 18px 52px rgba(86,37,55,.17);border:1px solid rgba(255,255,255,.78);padding:17px;margin:13px 0}h1{text-align:center;font-size:23px;margin:10px 0 6px}h2{font-size:17px;margin:0 0 10px}.hint{font-size:13px;line-height:1.55;opacity:.72;text-align:center;margin:0 0 12px}.small{font-size:12px;line-height:1.55;opacity:.72}label{display:block;font-size:13px;margin:12px 0 6px;opacity:.78}input,select,textarea{width:100%;border:0;border-radius:16px;padding:13px;background:rgba(255,255,255,.86);box-shadow:inset 0 0 0 1px rgba(116,52,73,.13);font-size:15px;color:#673748;outline:none}textarea{min-height:145px;resize:vertical}.out{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;border-radius:18px;padding:13px;background:rgba(255,255,255,.76);box-shadow:inset 0 0 0 1px rgba(116,52,73,.12);overflow:auto}.warn{color:#9b4654;font-weight:780}.ok{color:#4f6b46;font-weight:780}button{width:100%;border:0;border-radius:18px;margin-top:10px;padding:13px;background:#774052;color:#fff;font-weight:780;font-size:15px;box-shadow:0 10px 24px rgba(119,64,82,.22)}button.secondary{background:rgba(255,255,255,.78);color:#774052;box-shadow:inset 0 0 0 1px rgba(119,64,82,.14)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{flex:1;min-width:130px;text-align:center;text-decoration:none;color:#774052;background:rgba(255,255,255,.62);border-radius:14px;padding:10px;font-size:13px}.gate{border:1px solid rgba(168,78,95,.28);background:rgba(255,245,247,.72)}
</style>
</head>
<body>
<main class="wrap">
<h1>Text Target Envelope Dry Run</h1>
<p class="hint">测试 /api/set-state 的总钥匙请求格式。强制 dryRun:true，不写 state。</p>
<section class="card gate"><h2>Safety gate</h2><p class="small"><span class="warn">NO WRITE MODE</span>：本页请求里固定发送 dryRun:true。后端应返回 writesState:false / callsSupabaseWrite:false。</p><div class="links"><a href="/write-v2-text-targets-safety.html">write-v2 选择性页</a><a href="/api/state" target="_blank">查看 state</a></div></section>
<section class="card"><h2>Request</h2><label for="token">Nest key</label><input id="token" autocomplete="off" placeholder="paste NEST_TOKEN here" /><label for="targetId">targetId</label><select id="targetId"><option value="coffeeCornerBubble">coffeeCornerBubble</option><option value="coffeeCornerLapCloseBubble">coffeeCornerLapCloseBubble</option><option value="windowWeather">windowWeather</option><option value="hubbyNote">hubbyNote</option><option value="moodNote">moodNote</option><option value="roomStatus">roomStatus</option></select><label for="mode">mode</label><select id="mode"><option value="publish">publish dry-run</option><option value="draft">draft dry-run</option></select><label for="text">text</label><textarea id="text">小猫，过来。
Envelope dry-run only.</textarea><div class="row"><button id="run">发送 dry-run</button><button id="fill" class="secondary">填入示例</button></div></section>
<section class="card"><h2>Response</h2><div id="result" class="out">尚未发送。</div></section>
</main>
<script>
(function(){
const tokenBox=document.getElementById('token'), targetBox=document.getElementById('targetId'), modeBox=document.getElementById('mode'), textBox=document.getElementById('text'), resultBox=document.getElementById('result');const saved=localStorage.getItem('kittenNestToken');if(saved)tokenBox.value=saved;
function pretty(o){return JSON.stringify(o,null,2)}function key(){const t=tokenBox.value.trim();if(t)localStorage.setItem('kittenNestToken',t);return t}
function fill(){const id=targetBox.value;if(id==='coffeeCornerBubble')textBox.value='小猫，过来。\nEnvelope dry-run only.';else if(id==='coffeeCornerLapCloseBubble')textBox.value='坐稳，小猫。\nEnvelope lap dry-run only.';else if(id==='windowWeather')textBox.value='23°C\nEnvelope breeze';else if(id==='hubbyNote')textBox.value='Envelope dry-run：这条不该写入粉本本。';else textBox.value='Envelope dry-run text.'}
async function run(){try{const t=key();if(!t)throw new Error('Need Nest key.');resultBox.textContent='Sending dry-run...';const body={textTarget:{targetId:targetBox.value,mode:modeBox.value,text:textBox.value,dryRun:true}};const res=await fetch('/api/set-state',{method:'POST',headers:{'Content-Type':'application/json','X-Nest-Token':t},body:JSON.stringify(body),cache:'no-store'});const data=await res.json();resultBox.textContent=pretty({httpStatus:res.status,request:body,response:data})}catch(e){resultBox.textContent=pretty({ok:false,error:e.message})}}
document.getElementById('run').onclick=run;document.getElementById('fill').onclick=function(){fill();run()};targetBox.onchange=fill;fill();
})();
</script>
</body>
</html>
