<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>cloud clean textPort promotion test</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body{margin:0;min-height:100vh;background:#120b12;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#fff}.wrap{width:min(430px,100vw);margin:0 auto;padding:12px 10px 28px}.note,.debug{padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:12px;line-height:1.45;color:rgba(255,255,255,.78)}.note{margin-bottom:10px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.ok{color:#b8ffd8}.bad{color:#ffb8c0}#gameRoom{position:relative;width:100%;aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:#1b0f16;box-shadow:0 18px 55px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.12)}#gameBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.bubble{position:absolute;z-index:22;max-width:45%;width:max-content;min-width:120px;padding:12px 14px;border-radius:20px;background:rgba(255,248,245,.86);border:1.4px solid rgba(255,255,255,.92);box-shadow:0 10px 28px rgba(83,38,51,.18);font-size:clamp(14px,3.5vw,20px);line-height:1.28;color:#733447;transition:opacity .18s ease,transform .18s ease;pointer-events:auto;touch-action:manipulation;white-space:pre-line}.bubble.hidden{opacity:0;transform:scale(.96);pointer-events:none}.bubble:after{content:"";position:absolute;right:22px;bottom:-9px;border-width:10px 7px 0 7px;border-style:solid;border-color:rgba(255,248,245,.86) transparent transparent transparent}.hot{position:absolute;border:0;background:transparent;z-index:30;touch-action:manipulation;color:transparent;font-size:0;padding:0}.tattooHot{border-radius:999px;background:rgba(255,80,130,.035);outline:1.5px solid rgba(255,80,130,.22)}.dummy{position:absolute;z-index:21;border:0;border-radius:18px;background:rgba(120,180,255,.10);outline:1.4px solid rgba(120,180,255,.35);color:rgba(255,255,255,.75);font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:flex-start;padding:10px;text-align:left}.consoleHot{left:0;bottom:11%;width:43%;height:22%}.photoHot{left:0;top:13%;width:56%;height:34%}.debug{margin-top:10px}.buttons{display:flex;gap:8px;margin-top:10px}.buttons button{flex:1;border:0;border-radius:14px;padding:10px 8px;background:rgba(255,255,255,.88);color:#733447;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
 <div class="note"><b>cloud clean textPort promotion test</b><br>独立 promotion test route。模拟 /cloud coffeeCorner 的关键 DOM，但不加载 /cloud wrapper、不加载 app-q bridge、不加载 cloudTextPatch、不写 state。</div>
 <div id="gameRoom" data-scene="coffeeCorner">
  <img id="gameBg" alt="coffee corner" src="https://pmkxzmogolxllijzqnfr.supabase.co/storage/v1/object/public/nest-public-assets/assets/rooms/coffee-corner/morning-evening.jpg?v=promotion-test-20260617" onerror="this.onerror=null;this.src='/api/room-asset?room=coffeeCorner&slot=background.main&t=promotion-test-20260617'">
  <div id="bubble" class="bubble hidden"></div>
  <button class="hot tattooHot" type="button" aria-label="19.8 trigger"></button>
  <button class="dummy consoleHot" type="button" aria-label="console dummy">console dummy</button>
  <button class="dummy photoHot" type="button" aria-label="photo dummy">photo dummy</button>
 </div>
 <div id="debug" class="debug"></div>
 <div class="buttons"><button id="resetBtn" type="button">Reset</button><button id="longBtn" type="button">Long</button><button id="hideBtn" type="button">Hide</button></div>
</div>
<script src="/assets/scene-text-port-clean-controller.js?v=20260617-test-2"></script>
<script>
(function(){
 var api=null, dummy=[];
 function absent(){return typeof window.__kittenNestBridge==='undefined'&&typeof window.__kittenNestTextPatch==='undefined'&&typeof window.KittenNestBubble==='undefined'}
 function log(x){dummy.unshift(new Date().toLocaleTimeString()+' '+x);dummy=dummy.slice(0,6);draw()}
 function draw(){var b=document.getElementById('bubble');document.getElementById('debug').innerHTML=[
 '<b>status</b>: <span class="ok">independent promotion test</span>',
 '<b>module</b>: <span class="mono">'+(window.KittenNestSceneTextPortClean&&window.KittenNestSceneTextPortClean.version||'missing')+'</span>',
 '<b>old owners absent</b>: '+(absent()?'<span class="ok">yes</span>':'<span class="bad">no</span>'),
 '<b>#bubble owner</b>: <span class="mono">'+(b&&b.getAttribute('data-owner')||'')+'</span>',
 '<b>#bubble tag</b>: <span class="mono">'+(b&&b.getAttribute('data-canonical-tag')||'')+'</span>',
 '<b>visible/index</b>: '+(api?api.visible+' / '+api.index:'loading'),
 '<b>bubble events</b>: <span class="mono">'+(api?api.events.join(' | '):'loading')+'</span>',
 '<b>dummy events</b>: <span class="mono">'+(dummy.join(' | ')||'none')+'</span>'
 ].join('<br>')}
 function boot(){
  if(!window.KittenNestSceneTextPortClean){draw();return}
  api=window.KittenNestSceneTextPortClean.create({id:'coffeeCorner.bubble.promotionTest',owner:'sceneTextPortCleanController',canonicalTag:'[coffeeCornerBubble]',rootSelector:'#gameRoom',containerSelector:'#gameRoom',imageSelector:'#gameBg',textPort:{selector:'#bubble',coordinate:{x:0.905,y:0.23,width:0.48,anchor:'bottomRight',heightMode:'auto',growthDirection:'upward'}},trigger:{selector:'.tattooHot',coordinate:{x:0.73,y:0.345,width:0.15,height:0.08}},stateFields:{single:'coffeeCornerBubble',queue:'coffeeCornerBubbles',index:'coffeeCornerBubbleIndex'},fallbackStateFields:{single:'alexBubble',queue:'alexBubbles',index:'bubbleIndex'},deferInitialRenderUntilState:true,initialQueue:[],onRender:draw});
  document.querySelector('.consoleHot').addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();log('console.ok')},true);
  document.querySelector('.photoHot').addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();log('photo.ok')},true);
  document.getElementById('resetBtn').addEventListener('click',function(){api.loadState();draw()});
  document.getElementById('longBtn').addEventListener('click',function(){api.setQueue(['Long coffeeCornerBubble promotion-test line.\nOnly sceneTextPortCleanController should own this surface.'],0).show();draw()});
  document.getElementById('hideBtn').addEventListener('click',function(){api.hide();draw()});
  draw();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body>
</html>
