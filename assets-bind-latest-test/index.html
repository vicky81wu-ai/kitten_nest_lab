<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bind Latest Coffee Asset</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5,#ffeef4,#f7edf7);color:#684054}main{max-width:760px;margin:0 auto;padding:24px 16px}.card{border-radius:28px;background:rgba(255,255,255,.78);padding:18px;margin:14px 0;box-shadow:0 18px 48px rgba(121,68,88,.14)}h1{margin:0 0 8px;color:#63364a}p{color:#8b6474;line-height:1.55}.meta{font-size:12px;line-height:1.45;word-break:break-all;color:#7b5260;margin:5px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;font-weight:800;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14)}.primary{background:#eafff1;color:#215c37}img{width:100%;border-radius:20px;background:#fff0f4;display:block}.log{white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.6);border-radius:16px;padding:12px;margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}</style></head><body><main><section class="card"><h1>绑定最近上传测试图</h1><p>这个入口专门测试刚上传的 draft 图绑定，不用从公开列表里找。</p><div class="bar"><a href="/assets-auth-test/">管理员登录</a><a href="/assets-bind-test/">普通绑定页</a><a class="primary" href="/cloud">回 /cloud</a></div></section><section class="card"><img src="https://pmkxzmogolxllijzqnfr.supabase.co/storage/v1/object/public/nest-public-assets/assets/rooms/coffeeCorner/uploads/background-main-20260612T090613Z.png" alt="latest upload"><div class="meta"><b>asset_id</b><br>room.coffeeCorner.background-main.20260612T090613Z</div><div class="meta"><b>slot</b><br>coffeeCorner / background.main</div><button class="primary" id="bind">设为 coffeeCorner 当前图</button><div class="log" id="log">ready.</div></section></main><script>const TOKEN_KEY='kittenNestSupabaseSession';const BIND='https://pmkxzmogolxllijzqnfr.supabase.co/functions/v1/nest-asset-bind-form';const log=document.getElementById('log');function out(x){log.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function session(){try{return JSON.parse(localStorage.getItem(TOKEN_KEY)||'null')}catch(e){return null}}function token(){const s=session();return s&&s.access_token}document.getElementById('bind').onclick=async e=>{e.currentTarget.disabled=true;try{const t=token();if(!t)throw new Error('未登录或 token 已过期：先点管理员登录，重新登录。');const fd=new FormData();fd.append('access_token',t);fd.append('asset_id','room.coffeeCorner.background-main.20260612T090613Z');fd.append('room_id','coffeeCorner');fd.append('slot','background.main');out('binding latest uploaded asset...');const r=await fetch(BIND,{method:'POST',body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+' '+JSON.stringify(d));out({ok:true,data:d,next:'绑定已完成。'});}catch(err){out('ERROR: '+err.message)}finally{e.currentTarget.disabled=false}};</script></body></html>
