<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Text Target Write Safety</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#fff5f8,#ecd4dc);color:#653746;padding:18px}.wrap{width:min(94vw,760px);margin:0 auto 28px}.card{border-radius:26px;background:rgba(255,255,255,.74);box-shadow:0 18px 52px rgba(86,37,55,.17);border:1px solid rgba(255,255,255,.78);padding:17px;margin:13px 0}h1{text-align:center;font-size:24px;margin:10px 0 6px}h2{font-size:17px;margin:0 0 10px}.hint{font-size:13px;line-height:1.55;opacity:.72;text-align:center;margin:0 0 12px}.small{font-size:12px;line-height:1.55;opacity:.72}label{display:block;font-size:13px;margin:12px 0 6px;opacity:.78}select,textarea,input{width:100%;border:0;border-radius:16px;padding:13px;background:rgba(255,255,255,.86);box-shadow:inset 0 0 0 1px rgba(116,52,73,.13);font-size:15px;color:#653746;outline:none}textarea{min-height:145px;resize:vertical}button{width:100%;border:0;border-radius:18px;margin-top:10px;padding:13px;background:#774052;color:#fff;font-weight:780;font-size:15px;box-shadow:0 10px 24px rgba(119,64,82,.22)}button.secondary{background:rgba(255,255,255,.78);color:#774052;box-shadow:inset 0 0 0 1px rgba(119,64,82,.14)}button.danger{background:#a84e5f}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;border-radius:18px;padding:13px;background:rgba(255,255,255,.76);box-shadow:inset 0 0 0 1px rgba(116,52,73,.12);overflow:auto}.pill{display:inline-block;border-radius:999px;padding:4px 8px;margin:2px;background:rgba(119,64,82,.1);font-size:11px}.warn{color:#9b4654;font-weight:780}.ok{color:#4f6b46;font-weight:780}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{flex:1;min-width:130px;text-align:center;text-decoration:none;color:#774052;background:rgba(255,255,255,.62);border-radius:14px;padding:10px;font-size:13px}.gate{border:1px solid rgba(168,78,95,.28);background:rgba(255,245,247,.72)}
</style>
</head>
<body>
<main class="wrap">
  <h1>Text Target Write Safety</h1>
  <p class="hint">安全写入测试页：不新增 API，不改 /api/set-state，只在小猫手动填 key 并点击时，用现有 set-state 写入。</p>

  <section class="card gate">
    <h2>Safety gate</h2>
    <p class="small"><span class="warn">MANUAL WRITE ONLY</span>：本页默认只预览。只有填 Nest key，并点击“执行安全写入”才会调用 /api/set-state。它仍然不是 MCP 总钥匙。</p>
    <div class="links"><a href="/text-target-dry-run.html">dry-run 页</a><a href="/write">正式 /write</a><a href="/cloud?v=textTargetSafety">打开 /cloud</a></div>
  </section>

  <section class="card">
    <h2>Input</h2>
    <label for="token">Nest key</label>
    <input id="token" autocomplete="off" placeholder="paste NEST_TOKEN here" />
    <label for="targetId">targetId</label>
    <select id="targetId"></select>
    <label for="mode">mode</label>
    <select id="mode"><option value="draft">draft: 只写入 pendingDrafts</option><option value="publish">publish: 直接发布到目标字段</option></select>
    <label for="text">text</label>
    <textarea id="text">坐过来，小猫。
这是安全写入测试。</textarea>
    <div class="row"><button id="preview" class="secondary">预览 patch</button><button id="fill" class="secondary">填入示例</button></div>
    <button id="write" class="danger">执行安全写入</button>
  </section>

  <section class="card">
    <h2>Patch preview</h2>
    <div id="previewBox" class="out">Loading...</div>
  </section>

  <section class="card">
    <h2>Write result</h2>
    <div id="result" class="out">尚未写入。</div>
  </section>
</main>
<script>
(function(){
  const tokenBox=document.getElementById('token'), targetSelect=document.getElementById('targetId'), modeSelect=document.getElementById('mode'), textBox=document.getElementById('text'), previewBox=document.getElementById('previewBox'), resultBox=document.getElementById('result');
  let registry=null; const saved=localStorage.getItem('kittenNestToken'); if(saved) tokenBox.value=saved;
  function now(){return new Date().toISOString()} function cleanLines(v,max){return String(v||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,max||30)} function clamp(v,max){return String(v||'').trim().slice(0,max||5000)} function pretty(o){return JSON.stringify(o,null,2)} function targets(){return registry&&registry.targets?registry.targets:{}} function getTarget(id){return targets()[id]||null} function key(){const t=tokenBox.value.trim(); if(t)localStorage.setItem('kittenNestToken',t); return t}
  function draftPreview(target,text){const body=clamp(text,target.maxChars||5000); if(!body)throw new Error('Text is empty.'); return {id:'draft_'+Date.now()+'_safety',source:'textTargetWriteSafety',targetId:target.targetId,targetRoom:target.targetRoom||target.targetId,type:target.draftType||'textTargetDraft',field:target.currentField||target.field||null,text:body,status:'pending',createdAt:now()}}
  function publishPatchPreview(target,text,state){const type=target.type;if(type==='bubbleQueue'){const list=cleanLines(text,target.maxLines||30);if(!list.length)throw new Error('Text is empty.');const patch={};if(target.previousField){patch[target.previousField]={alexBubble:state.alexBubble||'',alexBubbles:state.alexBubbles||(state.alexBubble?[state.alexBubble]:[]),bubbleIndex:state.bubbleIndex||0,savedAt:now()}}patch[target.currentField]=list[0]||'';patch[target.field]=list;if(target.indexField)patch[target.indexField]=0;if(target.updatedAtField)patch[target.updatedAtField]=now();return patch}if(type==='weatherText'){const list=cleanLines(text,target.maxLines||2),patch={};(target.fields||[]).forEach((f,i)=>patch[f]=list[i]||'');return patch}if(type==='note'){const note=clamp(text,target.maxChars||5000);if(!note)throw new Error('Text is empty.');const old=String(state[target.field]||'').trim();const archive=Array.isArray(state[target.archiveField])?state[target.archiveField]:(Array.isArray(state[target.historyField])?state[target.historyField]:[]);const next=old?[{text:old,savedAt:state[target.updatedAtField]||state.updatedAt||now()},...archive]:archive;const patch={[target.field]:note};if(target.updatedAtField)patch[target.updatedAtField]=now();if(target.archiveField)patch[target.archiveField]=next;if(target.historyField)patch[target.historyField]=next.slice(0,target.maxArchiveItems||20);return patch}if(type==='single'){const value=clamp(text,target.maxChars||2000);if(!value)throw new Error('Text is empty.');const patch={[target.field]:value};if(target.updatedAtField)patch[target.updatedAtField]=now();return patch}throw new Error('Unsupported target type: '+type)}
  async function readState(){const res=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('state read failed '+res.status);return await res.json()}
  async function buildPatch(){const target=getTarget(targetSelect.value);if(!target)throw new Error('Unknown targetId');const state=await readState();const mode=modeSelect.value;const patch=mode==='draft'?{pendingDrafts:[draftPreview(target,textBox.value),...(Array.isArray(state.pendingDrafts)?state.pendingDrafts:[])].slice(0,50)}:publishPatchPreview(target,textBox.value,state);return {target,mode,patch}}
  async function preview(){try{const r=await buildPatch();previewBox.textContent=pretty({safetyPage:true,callsWriteApiOnlyIfButtonClicked:true,targetId:r.target.targetId,mode:r.mode,patchPreview:r.patch})}catch(e){previewBox.textContent=pretty({error:e.message})}}
  async function write(){try{const t=key();if(!t)throw new Error('Need Nest key.');const r=await buildPatch();resultBox.textContent='Writing...';const res=await fetch('/api/set-state',{method:'POST',headers:{'Content-Type':'application/json','X-Nest-Token':t},body:JSON.stringify(r.patch),cache:'no-store'});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||data.message||res.status);resultBox.textContent=pretty({ok:true,writtenBy:'text-target-write-safety.html',targetId:r.target.targetId,mode:r.mode,updatedAt:data.value&&data.value.updatedAt,importantFields:{alexBubble:data.value&&data.value.alexBubble,coffeeCornerLapCloseBubble:data.value&&data.value.coffeeCornerLapCloseBubble,windowTemp:data.value&&data.value.windowTemp,hubbyNotePreview:String(data.value&&data.value.hubbyNote||'').slice(0,120),pendingDrafts:Array.isArray(data.value&&data.value.pendingDrafts)?data.value.pendingDrafts.length:null}})}catch(e){resultBox.textContent=pretty({ok:false,error:e.message})}}
  function fill(){const id=targetSelect.value;if(id==='coffeeCornerBubble')textBox.value='安全测试：普通咖啡角气泡。\n如果看到这句，说明 targetId 分发能写 coffeeCornerBubble。';else if(id==='coffeeCornerLapCloseBubble')textBox.value='坐稳，小猫。\n安全测试写入坐腿气泡。';else if(id==='windowWeather')textBox.value='23°C\nSafety breeze';else if(id==='hubbyNote')textBox.value='安全测试：统一 text target 写入页可以写粉本本。';else textBox.value='安全测试文本';preview()}
  async function init(){try{const res=await fetch('/data/text-targets.v1.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('registry '+res.status);registry=await res.json();targetSelect.innerHTML=Object.values(targets()).map(t=>'<option value="'+t.targetId+'">'+t.targetId+' · '+t.type+'</option>').join('');targetSelect.onchange=fill;modeSelect.onchange=preview;document.getElementById('preview').onclick=preview;document.getElementById('fill').onclick=fill;document.getElementById('write').onclick=write;fill()}catch(e){previewBox.textContent=pretty({error:e.message})}}
  init();
})();
</script>
</body>
</html>
