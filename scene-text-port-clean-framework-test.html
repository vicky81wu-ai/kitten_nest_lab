<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>scene textPort clean framework test</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;width:100%;min-height:100%;background:#120b12;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#fff}
  .wrap{width:min(430px,100vw);margin:0 auto;padding:12px 10px 28px}
  .note,.debug{padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:12px;line-height:1.45;color:rgba(255,255,255,.78)}
  .note{margin-bottom:10px}.note b,.debug b{color:#fff}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.ok{color:#b8ffd8}.warn{color:#ffd59f}
  #gameRoom{position:relative;width:100%;aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:#1b0f16;box-shadow:0 18px 55px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.12)}
  #gameBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.10));pointer-events:none}
  .bubble{position:absolute;z-index:22;max-width:45%;width:max-content;min-width:120px;padding:12px 14px;border-radius:20px;background:rgba(255,248,245,.86);border:1.4px solid rgba(255,255,255,.92);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 10px 28px rgba(83,38,51,.18),inset 0 0 0 1px rgba(120,50,70,.1);font-size:clamp(14px,3.5vw,20px);line-height:1.28;color:#733447;font-weight:540;text-shadow:0 1px rgba(255,255,255,.72);transition:opacity .18s ease,transform .18s ease;pointer-events:auto;touch-action:manipulation;white-space:pre-line}
  .bubble.hidden{opacity:0;transform:scale(.96);pointer-events:none}.bubble:after{content:"";position:absolute;right:22px;bottom:-9px;border-width:10px 7px 0 7px;border-style:solid;border-color:rgba(255,248,245,.86) transparent transparent transparent}
  .hot{position:absolute;border:0;background:transparent;z-index:30;touch-action:manipulation;color:transparent;font-size:0;padding:0}.tattooHot{border-radius:999px;background:rgba(255,80,130,.035);outline:1.5px solid rgba(255,80,130,.22)}.tattooHot:active{background:rgba(255,80,130,.16)}
  .panelText{position:absolute;z-index:18;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 22px rgba(70,30,45,.16);font-size:clamp(12px,3vw,16px);line-height:1.28;color:#6b3d49;white-space:pre-line;pointer-events:auto;touch-action:manipulation}.panelText.hidden{opacity:0;pointer-events:none}
  .panelHot{position:absolute;z-index:19;border:0;border-radius:16px;background:rgba(180,120,255,.055);outline:1.2px solid rgba(180,120,255,.22);touch-action:manipulation;color:transparent;font-size:0}
  .debug{margin-top:10px}.buttons{display:flex;gap:8px;margin-top:10px}.buttons button{flex:1;border:0;border-radius:14px;padding:10px 8px;background:rgba(255,255,255,.88);color:#733447;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="note">
    <b>scene textPort clean framework test</b><br>
    独立测试页。加载 <span class="mono">assets/scene-text-port-clean-controller.js</span>，用同一套配置同时管理 bubble textPort 和 panel-like textPort。仍然不接 <span class="mono">/cloud</span>。
  </div>
  <div id="gameRoom" class="room active" data-scene="coffeeCorner">
    <img id="gameBg" class="bg" alt="coffee corner" src="/assets/rooms/coffee-corner/morning-evening.jpg?v=text-port-framework-test-20260617">
    <div class="shade"></div>
    <div id="bubble" class="bubble"></div>
    <button class="hot tattooHot" type="button" aria-label="19.8 bubble hotspot"></button>
    <div id="frameworkPanelText" class="panelText hidden"></div>
    <button id="frameworkPanelHot" class="panelHot" type="button" aria-label="panel text hotspot"></button>
  </div>
  <div id="debug" class="debug"></div>
  <div class="buttons">
    <button id="resetBtn" type="button">Reset</button>
    <button id="longBtn" type="button">Long bubble</button>
    <button id="panelBtn" type="button">Panel next</button>
  </div>
</div>
<script src="/assets/scene-text-port-clean-controller.js?v=20260617-test-1"></script>
<script>
(function(){
  var bubbleApi = null;
  var panelApi = null;
  function renderDebug(){
    var bubbleEvents = bubbleApi ? bubbleApi.events.join(' | ') : 'loading';
    var panelEvents = panelApi ? panelApi.events.join(' | ') : 'loading';
    document.getElementById('debug').innerHTML = [
      '<b>status</b>: <span class="ok">isolated generic framework test</span>',
      '<b>module</b>: <span class="mono">' + (window.KittenNestSceneTextPortClean && window.KittenNestSceneTextPortClean.version || 'missing') + '</span>',
      '<b>route isolation</b>: <span class="ok">no /cloud wrapper, no app-q bridge, no cloudTextPatch, no state write</span>',
      '<b>bubble owner</b>: <span class="mono">' + (bubbleApi && bubbleApi.config.owner || '') + '</span> / <b>tag</b>: <span class="mono">' + (bubbleApi && bubbleApi.config.canonicalTag || '') + '</span>',
      '<b>panel owner</b>: <span class="mono">' + (panelApi && panelApi.config.owner || '') + '</span> / <b>tag</b>: <span class="mono">' + (panelApi && panelApi.config.canonicalTag || '') + '</span>',
      '<b>bubble visible/index</b>: ' + (bubbleApi ? bubbleApi.visible + ' / ' + bubbleApi.index : ''),
      '<b>panel visible/index</b>: ' + (panelApi ? panelApi.visible + ' / ' + panelApi.index : ''),
      '<b>bubble events</b>: <span class="mono">' + bubbleEvents + '</span>',
      '<b>panel events</b>: <span class="mono">' + panelEvents + '</span>'
    ].join('<br>');
  }
  function boot(){
    if(!window.KittenNestSceneTextPortClean){ renderDebug(); return; }
    bubbleApi = window.KittenNestSceneTextPortClean.create({
      id:'coffeeCorner.bubble.frameworkTest',
      owner:'sceneTextPortCleanController',
      canonicalTag:'[coffeeCornerBubble]',
      rootSelector:'#gameRoom',
      containerSelector:'#gameRoom',
      imageSelector:'#gameBg',
      textPort:{ selector:'#bubble', coordinate:{ x:0.905, y:0.23, width:0.48, anchor:'bottomRight', heightMode:'auto', growthDirection:'upward' } },
      trigger:{ selector:'.tattooHot', coordinate:{ x:0.73, y:0.345, width:0.15, height:0.08 } },
      stateFields:{ single:'coffeeCornerBubble', queue:'coffeeCornerBubbles', index:'coffeeCornerBubbleIndex' },
      fallbackStateFields:{ single:'alexBubble', queue:'alexBubbles', index:'bubbleIndex' },
      initialQueue:['come here, kitten.','coffee is warm. sit.'],
      onRender:renderDebug
    });
    panelApi = window.KittenNestSceneTextPortClean.create({
      id:'coffeeCorner.frameworkPanelText.frameworkTest',
      owner:'sceneTextPortCleanController',
      canonicalTag:'[coffeeCornerPanelTextTest]',
      rootSelector:'#gameRoom',
      containerSelector:'#gameRoom',
      imageSelector:'#gameBg',
      textPort:{ selector:'#frameworkPanelText', coordinate:{ x:0.12, y:0.72, width:0.46, anchor:'topLeft', heightMode:'auto', growthDirection:'downward' } },
      trigger:{ selector:'#frameworkPanelHot', coordinate:{ x:0.205, y:0.70, width:0.31, height:0.125 } },
      stateUrl:false,
      initialVisible:false,
      initialQueue:['Panel textPort also uses the same clean controller.','Second panel line: same owner pattern, different surface type.'],
      onRender:renderDebug
    });
    document.getElementById('resetBtn').addEventListener('click', function(){ bubbleApi.setQueue(bubbleApi.queue, 0).show(); panelApi.setQueue(panelApi.queue, 0).hide(); renderDebug(); });
    document.getElementById('longBtn').addEventListener('click', function(){ bubbleApi.setQueue(['Long coffeeCornerBubble line under the reusable scene textPort controller.\nThis verifies the framework can replace one-off bubble-specific code later.'], 0).show(); renderDebug(); });
    document.getElementById('panelBtn').addEventListener('click', function(){ panelApi.toggleNext(); renderDebug(); });
    renderDebug();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
