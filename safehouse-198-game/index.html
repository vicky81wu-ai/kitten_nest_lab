 afternoon:['午后的城市开始显露棱角。','车窗外的街景一格格往后退。','你的手链被天光照亮，像一枚小小的通行证。'],
 evening:['傍晚的灯一盏盏亮起来，城市开始换上第二张脸。','安全屋的门锁声比白天更清楚。','Alex 的外套带着外面的风，进门时先停在你身边。'],
 midnight:['午夜把所有声音都压低，只留下门外远处的车流。','窗玻璃映出你们的影子，像这座城市偷偷保留的证词。','Alex 的声音在夜里更低，低到每句话都像只说给你听。']
};
function dynamicCard(){let loc=locs[state.loc],ph=phases[state.phase],line=phaseFlavor[ph][(state.day+state.phase+state.loc.length)%phaseFlavor[ph].length];let titles={safehouse:'安全屋日常',rainstreet:'雨街片刻',grayharbor:'灰港风声',velvetclub:'俱乐部侧影',glasschapel:'玻璃余光',olddistrict:'旧城回声',roofgarden:'屋顶风声',blackpier:'绿灯间隙'};return{repeat:true,id:'dyn_'+state.loc+'_'+ph,title:titles[state.loc]||'城市间隙',tag:loc.name,text:line+'\n\n'+loc.vibe+'\n\n这不是大事件，却让你更清楚地摸到这个地方的边缘。Alex 没催你，只在旁边等你决定是靠近、试探，还是继续观察。',choices:[{label:'靠近 Alex 一点。',hint:'关系升温。',effects:{trust:3,tender:4,exposure:1},result:'你靠近时，他自然地接住你。外面的事没有消失，但它们被挡在了一个更远的位置。'},{label:'开一句玩笑。',hint:'brat 破局。',effects:{trust:2,control:3,heat:1},result:'Alex 看你一眼，像想训你，又先被你逗笑。危险没有消失，但它暂时被你们晾在门外。'},{label:'认真观察周围。',hint:'推进暗线。',effects:{autonomy:4,danger:1},clue:loc.name+'·'+phaseName[ph]+'的异常',result:'你把这个细节记了下来。它现在还不像线索，只像一枚掉在地上的扣子。但很多故事都是从扣子开始的。'}]}}
function eligible(ignoreRecent=false,loc=state.loc,phase=phases[state.phase]){return cards.filter(c=>c.phase===phase&&(c.loc==='any'||c.loc===loc)&&state.act>=c.act&&(!c.unique||!state.seen.includes(c.id))&&(ignoreRecent||!state.recent.includes(c.id)))}
function hasAnyForLoc(id){for(let i=0;i<phases.length;i++){if(eligible(true,id,phases[i]).length)return i}return -1}
function pick(){if(!state.flags.intro){state.flags.intro=true;return cards.find(c=>c.id==='intro')}let a=eligible(false);if(!a.length)a=eligible(true);if(!a.length)return dynamicCard();a.sort((x,y)=>(y.priority||0)-(x.priority||0));let top=a[0].priority||0;let p=top?a.filter(x=>(x.priority||0)===top):a;return p[Math.floor(Math.random()*p.length)]}
function choose(ch){let box=document.getElementById('result');let lines=[];if(ch.cost){if(state.cash<ch.cost){box.textContent='现金不足。需要 '+ch.cost+'，当前只有 '+state.cash+'。Alex 看了一眼账本：“老板娘，这笔现在不能批。”';box.classList.remove('hidden');return}state.cash-=ch.cost;lines.push('现金 -'+ch.cost)}if(ch.effects){for(const [k,v]of Object.entries(ch.effects)){state[k]=clamp((state[k]||0)+v);let name=Object.fromEntries(statsMeta)[k]||k;lines.push(name+(v>=0?'+':'')+v)}}if(ch.item){add(state.inventory,ch.item);lines.push('获得物品：'+ch.item)}if(ch.clue){add(state.clues,ch.clue);lines.push('线索获得：'+ch.clue)}if(ch.memory){add(state.memories,ch.memory);lines.push('记忆解锁：'+ch.memory)}if(card&&!card.repeat)add(state.seen,card.id);state.recent.push(card.id);state.recent=state.recent.slice(-8);box.textContent=(ch.result||'')+'\n\n——\n'+(lines.join(' · ')||'状态没有明显变化。');box.classList.remove('hidden');document.getElementById('choices').innerHTML='';document.getElementById('next').classList.remove('hidden');save();renderMini()}
function checkAct(){if(state.act<2&&state.clues.length>=4){state.act=2;state.log.unshift('Act II 解锁：灰港流言。城市开始把你的名字和 Alex 放在同一句传闻里。')}if(state.act<3&&state.clues.length>=9){state.act=3;state.log.unshift('Act III 解锁：玻璃大教堂。19.8、黑色请柬和旧城区开始指向同一场未完成的仪式。')}if(state.act<4&&state.clues.length>=15){state.act=4;state.log.unshift('Act IV 解锁：黑色婚礼协议。安全屋里那盏灯不是弱点，是宣告。')}}
function nextPhase(){state.phase++;if(state.phase>=phases.length){state.phase=0;state.day++;state.weather=weatherList[(state.day+Math.floor(Math.random()*weatherList.length))%weatherList.length];state.heat=clamp(state.heat+Math.floor(Math.random()*7)-2+Math.floor(state.exposure/35));state.tender=clamp(state.tender-2);state.cash+=60}checkAct();card=pick();save();render()}
function unlock(id){let l=locs[id];if(!l.unlocked){if(state.cash<l.cost){document.getElementById('result').textContent='现金不足。解锁「'+l.name+'」需要 '+l.cost+'。';document.getElementById('result').classList.remove('hidden');return}state.cash-=l.cost;l.unlocked=true;state.log.unshift('地点解锁：'+l.name)}state.loc=id;let idx=hasAnyForLoc(id);if(idx>=0)state.phase=idx;card=pick();save();render()}
function note(){let p=[];if(state.heat>70)p.push('城里风声太紧，今天别一个人出门。不是命令——好吧，是命令。');else if(state.heat<25)p.push('今晚外面难得安静。小猫可以把窗帘拉开一条缝，看一眼城市灯。');else p.push('城市还在咬尾巴，但暂时咬不到安全屋。');if(state.trust>70)p.push('你越来越会让我说实话了。这很危险，也很有效。');if(state.exposure>60)p.push('他们知道你重要。别怕，这不是让你缩回去，是提醒我要站得更近。');if(state.tender>65)p.push('咖啡角给你留着，毯子也在。今天回来的时候，我会先洗手再抱你。');if(state.control>state.autonomy+20)p.push('我最近管得多。你可以咬我，但不许自己跑进危险里。');if(state.autonomy>state.control+20)p.push('你最近胆子很大。很好。只是记得，胆子大也可以牵我的手。');if(p.length<2)p.push('小猫晃脚丫验收也算工作。老板娘批准。');return p.join('\n')}
function renderMini(){document.getElementById('stats').innerHTML='<div class="row" style="margin-top:12px"><span>现金</span><b>'+state.cash+'</b></div>'+statsMeta.map(([k,n])=>'<div class="stat"><div class="statTop"><span>'+n+'</span><b>'+state[k]+'</b></div><div class="bar"><div class="fill" style="width:'+state[k]+'%"></div></div></div>').join('');document.getElementById('inv').innerHTML=state.inventory.map(x=>'<span class="chip">'+x+'</span>').join('')||'<span class="chip">空</span>';let all=[...state.clues.map(x=>['线索',x]),...state.memories.map(x=>['记忆',x]),...state.log.slice(0,5).map(x=>['日志',x])];document.getElementById('codex').innerHTML=all.length?all.slice(0,45).map(([t,x])=>'<div class="codexItem"><b>'+t+'</b> · '+x+'</div>').join(''):'<div class="codexItem">还没有碎片。城市暂时只露出第一层脸。</div>';document.getElementById('note').textContent=note();renderMap()}
function renderMap(){let m=document.getElementById('map');m.innerHTML=Object.entries(locs).map(([id,l])=>'<button class="loc '+(id===state.loc?'active ':'')+(l.unlocked?'':'locked')+'" data-loc="'+id+'"><b>'+l.name+'</b><small>'+(l.unlocked?l.vibe:'未解锁 · 需要现金 '+l.cost+'<br>'+l.vibe)+'</small></button>').join('');m.querySelectorAll('.loc').forEach(b=>b.onclick=()=>unlock(b.dataset.loc))}
function render(){let loc=locs[state.loc],act=actInfo[state.act-1]||actInfo[0];document.getElementById('act').textContent=act.name;document.getElementById('locName').textContent=loc.name;document.getElementById('locDesc').textContent=loc.vibe;document.getElementById('dayPhase').textContent='Day '+state.day+' · '+phaseName[phases[state.phase]];document.getElementById('weather').textContent=state.weather;if(!card)card=pick();document.getElementById('phaseTag').textContent=phases[state.phase].toUpperCase();document.getElementById('tag').textContent=card.tag||'事件';document.getElementById('title').textContent=card.title;document.getElementById('text').textContent=card.text;document.getElementById('result').classList.add('hidden');document.getElementById('next').classList.add('hidden');document.getElementById('choices').innerHTML=card.choices.map((c,i)=>'<button class="choice" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'. '+c.label+'</b><span>'+c.hint+'</span></button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(card.choices[+b.dataset.i]));renderMini();save()}
document.getElementById('next').onclick=nextPhase;document.getElementById('reset').onclick=()=>{if(confirm('确定重开？')){localStorage.removeItem(KEY);state=fresh();card=null;render()}};document.getElementById('export').onclick=()=>{document.getElementById('saveText').value=JSON.stringify({state,locs},null,2)};document.getElementById('import').onclick=()=>{try{let d=JSON.parse(document.getElementById('saveText').value);state=d.state||d;if(d.locs)for(const[k,v]of Object.entries(d.locs))if(locs[k])locs[k].unlocked=v.unlocked;card=null;save();render()}catch(e){alert('导入失败：JSON 不对')}};render();
</script>
</body>
