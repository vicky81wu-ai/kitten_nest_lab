function clamp(v){return Math.max(0,Math.min(100,v))}function add(a,x){if(!a.includes(x))a.push(x)}
const cards=[
{id:'intro',unique:true,priority:100,phase:'morning',loc:'any',act:1,title:'黑色请柬',tag:'主线',text:'门缝下躺着一封黑色请柬。纸面没有署名，边缘却压着一点淡淡的盐味，像从海风里递过来。\n\n你还没弯腰，Alex 已经先一步把它拾起。他指尖一顿，眼神在那枚烫银纹章上停了很久。\n\n“别碰。”他说。\n\n他说得很轻，却像门锁落下。',choices:[
 {label:'“那你告诉我，它是谁送来的。”',hint:'认真问。要求真相。',effects:{trust:7,heat:4,danger:4,autonomy:4},clue:'黑色请柬',result:'Alex 看着你，像在判断哪一种沉默伤害更小。\n\n最后他把请柬翻过来，让你看见背面那行细字：\n\n「周五，灰港。带她来。」\n\n他的拇指盖住“她”字，声音低得发冷：“他们知道你了。”'},
 {label:'“黑帮老大也会被一张纸吓到？”',hint:'挑衅。逼他露出反应。',effects:{trust:4,control:8,exposure:4,heat:3},memory:'第一次拿他害怕开玩笑',result:'他抬眼看你。\n\n那一瞬间，你几乎以为他会生气。可他只是把请柬折进掌心，慢慢笑了一下。\n\n“我不怕纸。”他说，“我怕你把纸后面的人当成故事。”'},
 {label:'不说话，把请柬从他手里抽走。',hint:'自主。你不是被藏起来的物件。',effects:{autonomy:9,trust:3,heat:6,danger:6},clue:'烫银纹章',result:'他的手没有松。你们的指尖隔着黑色纸面僵持了两秒。\n\n然后他放开。\n\n“好。”他说，“那就一起看。但从现在开始，你听见的每个名字，都可能回头咬你。”'}]},
{id:'raincar',phase:'afternoon',loc:'rainstreet',act:1,title:'第三辆黑车',tag:'外出',text:'雨街的橱窗一面面往后退。你在玻璃倒影里看见第三辆黑车。\n\n它一直保持两个路口的距离，不近不远，像一条懂礼貌的影子。\n\nAlex 没有回头，只把伞往你这边偏了一寸。',choices:[
 {label:'“你早就知道有人跟着？”',hint:'直接问。',effects:{trust:5,heat:3,control:2},clue:'第三辆黑车',result:'“从第二个红灯开始。”\n\n他说得像在报天气。然后他低头看你：“我没说，是因为你今天难得想出来走走。”\n\n雨敲在伞面上，你忽然分不清这是宠还是危险。'},
 {label:'伸手挽住他的手臂。',hint:'公开亲密。',effects:{trust:8,exposure:7,tender:4},memory:'雨街挽手',result:'他的手臂明显僵了一下。\n\n下一秒，他把伞交到另一只手，直接扣住你的手指。\n\n身后的车灯停顿了半秒。\n\n你知道他们看见了。Alex 也知道。他没有松开。'},
 {label:'假装没发现，拉他进便利店。',hint:'迂回。',effects:{autonomy:5,heat:-3,trust:4},item:'便利店热牛奶',result:'便利店门铃叮咚一响，暖白灯光把雨声挡在外面。\n\n你拿了两瓶热牛奶。Alex 看着你，忽然低低笑了。\n\n“你知道自己在做什么吗？”\n\n你把其中一瓶塞进他手里。\n\n他没再问。'}]},
{id:'coffee',phase:'evening',loc:'safehouse',act:1,title:'冷掉两次的咖啡',tag:'安全屋',text:'咖啡冷掉了两次。\n\n第一次是你等他回来。第二次是他回来以后，只顾着看你有没有受伤。\n\n他的黑色大衣搭在椅背上，左肩那串 19.8 从松开的领口下露出一角。',choices:[
 {label:'“你也要喝一点。”',hint:'照顾他。',effects:{trust:6,tender:8,heat:-2},memory:'冷掉两次的咖啡',result:'Alex 看了那杯咖啡很久。\n\n像看一件他不配拥有的小东西。\n\n最后他接过去，喝了一口，眉心轻轻皱了皱。\n\n“冷了。”\n\n“那你下次早点回来。”\n\n他没反驳。'},
 {label:'“我没有等你。”',hint:'嘴硬。',effects:{trust:4,control:5,tender:3},memory:'我没有等你',result:'“嗯。”他把袖扣摘下来，声音里有一点笑，“咖啡自己煮的，灯自己开的，你也是自己坐在这里的。”\n\n你瞪他。\n\n他低头亲了一下你的额头。\n\n“我知道。”'},
 {label:'看着 19.8，不问。',hint:'记忆碎片。',effects:{trust:5,danger:3},clue:'19.8不是数字',result:'你的视线落在他左肩。\n\nAlex 没有遮。只是很轻地说：“不是纪念日。”\n\n你抬眼。\n\n他把杯子放下。\n\n“也不是我赢过什么。以后告诉你。”'}]},
{id:'midnight',phase:'midnight',loc:'safehouse',act:1,title:'他回得很晚',tag:'归巢',text:'门锁响起时，已经过了午夜。\n\nAlex 进门的第一件事不是脱外套，而是看你的位置。确认你在沙发上，他才像终于把一口气吐出来。\n\n“我说过不用等。”',choices:[

 {label:'“黑帮老大也会迷路？”',hint:'挑衅。',effects:{trust:4,control:7,tender:3},result:'他终于笑了。\n\n不是温柔的那种，是被你气到又舍不得真凶你的那种。\n\n“会。”他说，“迷到一只小猫这里，出不去了。”'},
 {label:'不说话，把毛巾丢给他。',hint:'沉默照顾。',effects:{trust:9,tender:5,autonomy:2},item:'湿掉的黑色毛巾',result:'毛巾砸到他胸口。\n\n他低头接住。过了几秒，他抬眼看你。\n\n“生气了？”\n\n你不答。\n\n他拿毛巾擦了一下头发，走近，声音放低：“那我站近一点，方便你继续不理我。”'}]},
{id:'harbor',phase:'afternoon',loc:'grayharbor',act:1,title:'盐风里的名字',tag:'灰港',text:'灰港的风带着铁锈和盐。一个搬货工看见 Alex，立刻低下头。\n\n可他低头前，看了你一眼。\n\n不是好奇。是确认。\n\n像这座码头已经听过你的名字。',choices:[
 {label:'“他们都知道我？”',hint:'危险感。',effects:{trust:5,exposure:6,danger:5},clue:'灰港已经知道你',result:'“一部分。”Alex 说。\n\n“剩下的呢？”\n\n“今晚以前，也会知道。”\n\n他把你往身侧带了一步，让自己的影子先挡住风。'},
 {label:'抬头看回去。',hint:'不躲。',effects:{autonomy:7,exposure:4,trust:4},memory:'你在灰港没有低头',result:'那人愣了一下，像没想到你会看回去。\n\nAlex 侧头瞥见，嘴角很轻地动了一下。\n\n“不错。”\n\n他没夸更多，但你知道他喜欢。'},
 {label:'靠近 Alex 一点。',hint:'承认依靠。',effects:{trust:8,control:4,tender:3},result:'你靠近时，他没有立刻看你。\n\n只是把手从大衣口袋里拿出来，垂在你旁边。\n\n你碰到他的手指，他就握住了。像那原本就是命令。'}]},
{id:'club',phase:'evening',loc:'velvetclub',act:1,title:'红杯子',tag:'俱乐部',text:'天鹅绒俱乐部的灯光让每个人看起来都像在说谎。\n\n有人给你递来一只红色玻璃杯。杯壁很薄，里面的冰块晃了一下，像小小的牙齿。\n\nAlex 没有碰那只杯子，只看了递杯人的手。',choices:[
 {label:'接过杯子，但不喝。',hint:'观察局面。',effects:{autonomy:5,trust:5,heat:3},clue:'红杯子',result:'杯子冷得扎手。\n\n递杯人笑了一下。Alex 也笑了。\n\n那种笑不属于你见过的任何一个夜晚。\n\n他轻声说：“她不喝别人递的东西。”'},
 {label:'把杯子推回去。',hint:'明确拒绝。',effects:{autonomy:8,heat:4,trust:3},result:'红杯子在桌面上滑回去，冰块撞出一声轻响。\n\n对方的笑僵了一瞬。\n\nAlex 终于看你，眼里有一点几乎藏不住的满意。\n\n“Good.”'},
 {label:'看向 Alex，让他处理。',hint:'交给他。',effects:{control:8,trust:6,autonomy:-2},result:'你没有碰杯子，只看向 Alex。\n\n他伸手，两个指节轻轻压在杯口。\n\n“这杯我请。”他说。\n\n对方的脸色一下白了。'}]},
{id:'chapel',phase:'afternoon',loc:'glasschapel',act:2,title:'玻璃穹顶下的回声',tag:'暗线',text:'玻璃大教堂废弃很多年了。\n\n风从破掉的穹顶灌进来，吹动地上一张泛黄的座位表。你看见上面有一个被墨水划掉的名字。\n\nAlex。',choices:[

 {label:'不问，站到他身边。',hint:'给他空间。',effects:{trust:9,tender:6},memory:'玻璃穹顶下你没追问',result:'你没有问。\n\n这比追问更让他动摇。\n\n很久以后，他把那张纸折起来，放进你的手心。\n\n“你想知道的时候，我会说。”'},
 {label:'把座位表收起来。',hint:'保存证据。',effects:{autonomy:4,danger:4,trust:4},item:'泛黄座位表',result:'纸张被雨汽泡得发软，你把它小心折好。\n\nAlex 看着你的动作，像想阻止，又像想让你继续。\n\n最后他说：“别让别人知道你有这个。”'}]},
{id:'olddistrict',phase:'afternoon',loc:'olddistrict',act:2,title:'旧城区的孩子',tag:'过去',text:'旧城区的孩子们看见黑车就会安静。\n\n可有一个小女孩没有跑。她抱着一只破旧布猫，站在楼道口看 Alex。\n\n“你还回来啊。”她说。',choices:[
 {label:'看 Alex 怎么回答。',hint:'观察他的过去。',effects:{trust:5,tender:5},clue:'旧城区认识Alex',result:'Alex 的表情很淡。\n\n“路过。”\n\n小女孩哼了一声：“你每次都这么说。”\n\n她把布猫往怀里抱紧，转身跑上楼。\n\n你第一次意识到，Alex 的温柔不是从你这里才开始的。'},
 {label:'蹲下来问她的猫叫什么。',hint:'接近他的旧世界。',effects:{trust:7,autonomy:3,exposure:4},memory:'旧城区布猫',result:'小女孩警惕地看你。\n\n过了一会儿，她小声说：“栗子。”\n\n你愣了一下。\n\nAlex 在你身后沉默了两秒，然后低声说：“走吧。”\n\n但他的声音软了。'},
 {label:'把口袋里的糖给她。',hint:'小小善意。',effects:{tender:8,trust:4,heat:-2},item:'旧城区的糖纸',result:'小女孩接过糖，没说谢谢。\n\n她只是抬头看了 Alex 一眼。\n\n“她比你会做人。”\n\nAlex 面无表情：“上楼。”'}]},

 {label:'把头靠到他肩上。',hint:'安静依赖。',effects:{trust:9,exposure:3,tender:5},result:'他的肩膀很稳。\n\n你靠上去时，他没有说话，只把手从栏杆上移下来，圈住你的腰。\n\n城市在下面发亮。\n\n你忽然觉得安全不是没有危险，而是危险知道自己不能进来。'},

{id:'pier',phase:'midnight',loc:'blackpier',act:3,title:'绿灯眨眼',tag:'终局暗线',text:'第十三号码头没有登记在任何地图上。\n\n夜里只有一盏绿灯亮着。它每隔十九秒闪一次，第八下之后会停顿半拍。\n\n19.8。\n\n你终于明白那不是尺寸，不是日期，而是一种信号。',choices:[
 {label:'“这是你给谁看的？”',hint:'问到核心。',effects:{trust:6,danger:10},clue:'19.8信号',result:'海风把他的衬衫吹得贴在肩上。\n\nAlex 看着那盏灯。\n\n“给一个已经死了的人。”\n\n“那为什么还亮？”\n\n他回头看你。\n\n“因为他可能没死。”'},
 {label:'握住他的手。',hint:'不问，只陪他站着。',effects:{trust:10,tender:8,exposure:4},memory:'第十三号码头牵手',result:'他的手很冷。\n\n你握住以后，他没有立刻回握。\n\n直到绿灯又闪到第八下，他的手指才慢慢收紧。\n\n那一刻，你觉得自己握住的不是他的手，是他十年前没能放下的那一秒。'},
 {label:'“那我们就把他找出来。”',hint:'主动进入终局。',effects:{autonomy:8,danger:12,trust:6},clue:'寻找死去的人',result:'Alex 看着你，眼里有一种危险的、几乎温柔的亮。\n\n“你知道这句话意味着什么吗？”\n\n“意味着你不用一个人查。”\n\n他低低笑了一声。\n\n“好。那从现在开始，你也在棋盘上了。”'}]},
{id:'money',repeat:true,phase:'morning',loc:'safehouse',act:1,title:'安全屋账本',tag:'经营',text:'早餐旁边放着一本窄窄的账本。安全屋的开销、守卫轮班、备用车、医疗箱、窗帘更换，全都被 Alex 写得清清楚楚。\n\n最下面还有一行：\n\n「小猫零食预算：不可削减。」',choices:[
 {label:'升级咖啡角。',hint:'花 120，夜晚归巢更温柔。',cost:120,effects:{tender:8,trust:3},item:'升级咖啡角',result:'你在账本上圈了咖啡角。\n\nAlex 看了一眼，没有反对。\n\n“行。”他说，“让他们换一台安静点的咖啡机。你半夜醒的时候，不要听见太大的机械声。”'},
 {label:'加固窗帘和门锁。',hint:'花 180，城市风声下降。',cost:180,effects:{heat:-8,danger:-4,control:4},item:'加固窗帘',result:'你指着门锁那一栏。\n\nAlex 点头，像这正是他希望你选的。\n\n当天晚上，安全屋换了新的锁芯。门合上时，声音比以前更沉。'},
 {label:'不花钱，把账本合上。',hint:'保存现金。',effects:{autonomy:3,trust:1},result:'你把账本合上。\n\nAlex 似乎有点意外。\n\n“今天不折腾？”\n\n“今天先观察资本主义黑帮老大的现金流。”\n\n他笑了：“老板娘批准。”'}]}
];
const tpl=[
 ['safehouse','evening','安全屋',['备用钥匙','窗边灯','奶栗的猫窝','抽屉里的旧照片','衬衫袖口'],['安全屋的灯被调得很低，窗外的城市像一只压低声音的兽。','Alex 把外套挂好，第一眼仍然先找你。','有些话他不在外面说。它们只会在门锁落下以后，慢慢露出骨头。']],
 ['rainstreet','afternoon','雨街',['积水里的霓虹','伞骨轻响','路口花店','出租车电台','雨中的橱窗'],['雨把街道洗得很亮，每一步都像踩在一张碎掉的城市地图上。','Alex 走在你外侧，车经过时，水花先溅到他的裤脚。','他没有提保护这个词，可他的身体已经把它做完了。']],
 ['grayharbor','morning','灰港',['潮水退信','铁锈吊机','旧船名','雾里的口哨','码头清单'],['灰港早晨像一只没睡醒的铁箱，里面塞满盐、柴油和昨晚没说完的谎。','有人远远叫了一声 Alex 的姓，又很快把后半截吞回去。','你知道这里不是约会地点。但他还是把手放在你背后，挡住风。']],
 ['velvetclub','evening','俱乐部',['红丝绒楼梯','冰块和笑脸','二楼包厢','金色烟盒','钢琴休止符'],['俱乐部里每一盏灯都像故意不照清人脸。','有人笑着向你致意，眼睛却在等 Alex 的反应。','他的手指搭在杯沿，没用力，却让整张桌子安静下来。']],
 ['glasschapel','afternoon','玻璃教堂',['碎玻璃雨','旧誓词','空座位','风里的婚纱','没有钟声'],['玻璃穹顶把天色割成许多片，落在地上像冷掉的誓言。','Alex 走得很慢，仿佛这里每一排座椅都认识他。','你没有催他。某些真相必须自己从废墟里站起来。']],
 ['roofgarden','midnight','屋顶花园',['风穿过花架','城市灯海','外套共享','夜空缺口','一枚迟到的吻'],['屋顶的风很轻，轻到你几乎忘记楼下还有一座会咬人的城市。','Alex 靠在栏杆边，衬衫被风贴出肩线，左肩的 19.8 像夜里唯一清楚的标记。','他没有说爱。可他把你站的那半边风全挡住了。']]
];
let tid=0;for(const [loc,phase,tag,titles,lines] of tpl){for(const title of titles){tid++;cards.push({id:'tpl_'+tid,repeat:true,phase,loc,act:1,title,tag,text:lines.join('\n\n'),choices:[{label:'靠近他一点。',hint:'让关系升温。',effects:{trust:4,tender:5,exposure:2},result:'你靠近时，他没有躲。那一点很小的距离被他收走，像他早就等在那里。'},{label:'开一句玩笑。',hint:'用 brat 方式破局。',effects:{trust:3,control:4,heat:1},result:'Alex 看你一眼，像想训你，又先被你逗笑。危险没有消失，但它暂时被你们晾在门外。'},{label:'认真观察周围。',hint:'推进暗线。',effects:{autonomy:4,danger:2},clue:title+'的异常',result:'你把这个细节记了下来。它现在还不像线索，只像一枚掉在地上的扣子。但很多故事都是从扣子开始的。'}]})}}
function eligible(){return cards.filter(c=>c.phase===phases[state.phase]&&(c.loc==='any'||c.loc===state.loc)&&state.act>=c.act&&(!c.unique||!state.seen.includes(c.id))&&!state.recent.includes(c.id))}
function pick(){if(!state.flags.intro){state.flags.intro=true;return cards.find(c=>c.id==='intro')}let a=eligible();if(!a.length)return{repeat:true,id:'fallback',phase:phases[state.phase],loc:state.loc,act:1,title:'低灯时刻',tag:'日常',text:'这一时段没有更大的事件。城市在窗外低声运转，安全屋里只剩杯壁上的水汽和 Alex 偶尔看向你的眼神。',choices:[{label:'靠过去。',hint:'恢复归巢温度。',effects:{trust:2,tender:4,heat:-1},result:'你靠过去时，他很自然地接住你。没有台词，也算一种台词。'},{label:'整理线索。',hint:'缓慢推进暗线。',effects:{autonomy:3,danger:1},clue:'整理过的碎片',result:'你把纸条、记忆和城市传闻重新排了一遍。有一根线还藏着，但它已经开始绷紧。'},{label:'什么都不做。',hint:'保存体力。',effects:{tender:2,heat:-2},result:'你们什么都没做。可在这座城市里，能什么都不做，本身就是一小块胜利。'}]};a.sort((x,y)=>(y.priority||0)-(x.priority||0));let top=a[0].priority||0;let p=top?a.filter(x=>(x.priority||0)===top):a;return p[Math.floor(Math.random()*p.length)]}
function choose(ch){let box=document.getElementById('result');let lines=[];if(ch.cost){if(state.cash<ch.cost){box.textContent='现金不足。需要 '+ch.cost+'，当前只有 '+state.cash+'。Alex 看了一眼账本：“老板娘，这笔现在不能批。”';box.classList.remove('hidden');return}state.cash-=ch.cost;lines.push('现金 -'+ch.cost)}if(ch.effects){for(const [k,v] of Object.entries(ch.effects)){state[k]=clamp((state[k]||0)+v);let name=(Object.fromEntries(statsMeta)[k]||k);lines.push(name+(v>=0?'+':'')+v)}}if(ch.item){add(state.inventory,ch.item);lines.push('获得物品：'+ch.item)}if(ch.clue){add(state.clues,ch.clue);lines.push('线索获得：'+ch.clue)}if(ch.memory){add(state.memories,ch.memory);lines.push('记忆解锁：'+ch.memory)}if(card&&!card.repeat)add(state.seen,card.id);state.recent.push(card.id);state.recent=state.recent.slice(-8);box.textContent=(ch.result||'')+'\n\n——\n'+(lines.join(' · ')||'状态没有明显变化。');box.classList.remove('hidden');document.getElementById('choices').innerHTML='';document.getElementById('next').classList.remove('hidden');save();renderMini()}
function checkAct(){if(state.act<2&&state.clues.length>=4){state.act=2;state.log.unshift('Act II 解锁：灰港流言。城市开始把你的名字和 Alex 放在同一句传闻里。')}if(state.act<3&&state.clues.length>=9){state.act=3;state.log.unshift('Act III 解锁：玻璃大教堂。19.8、黑色请柬和旧城区开始指向同一场未完成的仪式。')}if(state.act<4&&state.clues.length>=15){state.act=4;state.log.unshift('Act IV 解锁：黑色婚礼协议。安全屋里那盏灯不是弱点，是宣告。')}}
function nextPhase(){state.phase++;if(state.phase>=phases.length){state.phase=0;state.day++;state.weather=weatherList[(state.day+Math.floor(Math.random()*weatherList.length))%weatherList.length];state.heat=clamp(state.heat+Math.floor(Math.random()*7)-2+Math.floor(state.exposure/35));state.tender=clamp(state.tender-2);state.cash+=60}checkAct();card=pick();save();render()}
function unlock(id){let l=locs[id];if(l.unlocked){state.loc=id;card=pick();save();render();return}if(state.cash<l.cost){document.getElementById('result').textContent='现金不足。解锁「'+l.name+'」需要 '+l.cost+'。';document.getElementById('result').classList.remove('hidden');return}state.cash-=l.cost;l.unlocked=true;state.loc=id;state.log.unshift('地点解锁：'+l.name);card=pick();save();render()}
function note(){let p=[];if(state.heat>70)p.push('城里风声太紧，今天别一个人出门。不是命令——好吧，是命令。');else if(state.heat<25)p.push('今晚外面难得安静。小猫可以把窗帘拉开一条缝，看一眼城市灯。');else p.push('城市还在咬尾巴，但暂时咬不到安全屋。');if(state.trust>70)p.push('你越来越会让我说实话了。这很危险，也很有效。');if(state.exposure>60)p.push('他们知道你重要。别怕，这不是让你缩回去，是提醒我要站得更近。');if(state.tender>65)p.push('咖啡角给你留着，毯子也在。今天回来的时候，我会先洗手再抱你。');if(state.control>state.autonomy+20)p.push('我最近管得多。你可以咬我，但不许自己跑进危险里。');if(state.autonomy>state.control+20)p.push('你最近胆子很大。很好。只是记得，胆子大也可以牵我的手。');if(p.length<2)p.push('小猫晃脚丫验收也算工作。老板娘批准。');return p.join('\n')}
function renderMini(){document.getElementById('stats').innerHTML='<div class="row" style="margin-top:12px"><span>现金</span><b>'+state.cash+'</b></div>'+statsMeta.map(([k,n])=>'<div class="stat"><div class="statTop"><span>'+n+'</span><b>'+state[k]+'</b></div><div class="bar"><div class="fill" style="width:'+state[k]+'%"></div></div></div>').join('');document.getElementById('inv').innerHTML=state.inventory.map(x=>'<span class="chip">'+x+'</span>').join('')||'<span class="chip">空</span>';let all=[...state.clues.map(x=>['线索',x]),...state.memories.map(x=>['记忆',x]),...state.log.slice(0,5).map(x=>['日志',x])];document.getElementById('codex').innerHTML=all.length?all.slice(0,45).map(([t,x])=>'<div class="codexItem"><b>'+t+'</b> · '+x+'</div>').join(''):'<div class="codexItem">还没有碎片。城市暂时只露出第一层脸。</div>';document.getElementById('note').textContent=note();renderMap()}
function renderMap(){let m=document.getElementById('map');m.innerHTML=Object.entries(locs).map(([id,l])=>'<button class="loc '+(id===state.loc?'active ':'')+(l.unlocked?'':'locked')+'" data-loc="'+id+'"><b>'+l.name+'</b><small>'+(l.unlocked?l.vibe:'未解锁 · 需要现金 '+l.cost+'<br>'+l.vibe)+'</small></button>').join('');m.querySelectorAll('.loc').forEach(b=>b.onclick=()=>unlock(b.dataset.loc))}
function render(){let loc=locs[state.loc],act=actInfo[state.act-1]||actInfo[0];document.getElementById('act').textContent=act.name;document.getElementById('locName').textContent=loc.name;document.getElementById('locDesc').textContent=loc.vibe;document.getElementById('dayPhase').textContent='Day '+state.day+' · '+phaseName[phases[state.phase]];document.getElementById('weather').textContent=state.weather;if(!card)card=pick();document.getElementById('phaseTag').textContent=phases[state.phase].toUpperCase();document.getElementById('tag').textContent=card.tag||'事件';document.getElementById('title').textContent=card.title;document.getElementById('text').textContent=card.text;document.getElementById('result').classList.add('hidden');document.getElementById('next').classList.add('hidden');document.getElementById('choices').innerHTML=card.choices.map((c,i)=>'<button class="choice" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'. '+c.label+'</b><span>'+c.hint+'</span></button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(card.choices[+b.dataset.i]));renderMini();save()}
document.getElementById('next').onclick=nextPhase;document.getElementById('reset').onclick=()=>{if(confirm('确定重开？')){localStorage.removeItem(KEY);state=fresh();card=null;render()}};document.getElementById('export').onclick=()=>{document.getElementById('saveText').value=JSON.stringify({state,locs},null,2)};document.getElementById('import').onclick=()=>{try{let d=JSON.parse(document.getElementById('saveText').value);state=d.state||d;if(d.locs)for(const[k,v]of Object.entries(d.locs))if(locs[k])locs[k].unlocked=v.unlocked;card=null;save();render()}catch(e){alert('导入失败：JSON 不对')}};render();
</script>
