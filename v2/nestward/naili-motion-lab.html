<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#241915">
<title>奶栗动态动作实验 · Kitten Nest</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#221814;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#lab{position:fixed;inset:0;display:grid;place-items:center;background:#221814}
#stage{width:100%;height:100%;display:block;touch-action:manipulation}
.panel{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:7px;border-radius:16px;background:rgba(36,25,21,.48);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12)}
button{border:0;border-radius:12px;padding:10px 13px;background:rgba(255,248,239,.88);color:#49352d;font-weight:700;font-size:13px}
#status{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(36,25,21,.42);color:#fff7ef;font-size:12px;backdrop-filter:blur(8px);pointer-events:none}
.tip{position:fixed;right:12px;top:max(14px,env(safe-area-inset-top));color:rgba(255,255,255,.76);font-size:11px;background:rgba(36,25,21,.34);padding:6px 8px;border-radius:10px}
</style>
</head>
<body>
<main id="lab">
<canvas id="stage" aria-label="奶栗动态动作实验"></canvas>
<div id="status">载入奶栗...</div>
<div class="tip">也可以直接点地板</div>
<div class="panel">
<button id="runLeft" type="button">跑左边</button>
<button id="auto" type="button">自动演示</button>
<button id="runRight" type="button">跑右边</button>
</div>
</main>
<script type="module" src="./naili-motion-lab.js"></script>
</body>
</html>
