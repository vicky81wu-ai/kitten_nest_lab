<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#241915">
<title>奶栗动态动作实验 · Kitten Nest</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#221814;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#lab{position:fixed;inset:0;display:grid;place-items:center;background:#221814}
#stage{width:100%;height:100%;display:block;touch-action:manipulation}
.panel{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:7px;border-radius:16px;background:rgba(36,25,21,.48);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);white-space:nowrap}
button{border:0;border-radius:12px;padding:10px 12px;background:rgba(255,248,239,.90);color:#49352d;font-weight:700;font-size:12px}
#follow{min-width:118px}
#status{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(36,25,21,.42);color:#fff7ef;font-size:12px;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap}
.tip{position:fixed;right:12px;top:max(14px,env(safe-area-inset-top));color:rgba(255,255,255,.76);font-size:11px;background:rgba(36,25,21,.34);padding:6px 8px;border-radius:10px}
</style>
</head>
<body>
<main id="lab">
<canvas id="stage" aria-label="奶栗动态动作实验"></canvas>
<div id="status">载入奶栗...</div>
<div class="tip">点地板让小猫走动</div>
<div class="panel">
<button id="runLeft" type="button">奶栗跑左边</button>
<button id="follow" type="button">让奶栗自由跑</button>
<button id="runRight" type="button">奶栗跑右边</button>
</div>
</main>
<script type="module" src="./naili-motion-lab.js"></script>
</body>
</html>
