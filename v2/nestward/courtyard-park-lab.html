<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111612" />
  <title>Ancient Chinese Courtyard Park · Kitten Nest Lab</title>
  <style>
    :root{
      color-scheme:dark;
      --glass:rgba(15,20,16,.58);
      --line:rgba(255,255,255,.16);
      --text:#f6f2e8;
      --muted:rgba(246,242,232,.72);
      --accent:#d7b77a;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101510;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    #stage{position:fixed;inset:0;background:
      radial-gradient(circle at 62% 8%,rgba(255,224,162,.14),transparent 32%),
      linear-gradient(#7894a1 0%,#a9b6ab 38%,#586953 100%)}
    #viewer{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
    .veil{position:absolute;inset:0;pointer-events:none;background:
      linear-gradient(to bottom,rgba(11,17,13,.22),transparent 18%,transparent 72%,rgba(9,12,10,.33));
      z-index:2}
    .topbar{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
    .card,.toolbar{backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 34px rgba(0,0,0,.24)}
    .card{border-radius:18px;padding:11px 13px;max-width:min(72vw,460px)}
    .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:750}
    h1{font-size:15px;line-height:1.25;margin:4px 0 2px;font-weight:720;color:var(--text)}
    .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .back{pointer-events:auto;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;text-decoration:none;color:var(--text);font-size:25px;line-height:1;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 34px rgba(0,0,0,.24)}
    .toolbar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));border-radius:999px;padding:5px;display:flex;gap:4px}
    button{appearance:none;border:0;border-radius:999px;padding:9px 13px;background:transparent;color:var(--muted);font:650 12px/1 inherit;cursor:pointer}
    button.active{background:rgba(255,255,255,.14);color:var(--text)}
    button:hover{color:var(--text)}
    .status{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:11px 15px;border-radius:999px;background:rgba(11,15,12,.68);border:1px solid rgba(255,255,255,.15);color:#f2eee4;font-size:12px;letter-spacing:.03em;backdrop-filter:blur(16px);transition:opacity .35s ease}
    .status.ready{opacity:0;pointer-events:none}
    .credit{position:absolute;z-index:5;right:max(12px,env(safe-area-inset-right));bottom:max(74px,calc(env(safe-area-inset-bottom) + 66px));max-width:min(76vw,360px);padding:8px 10px;border-radius:12px;background:rgba(11,15,12,.48);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(14px);color:rgba(255,255,255,.72);font-size:10px;line-height:1.4}
    .credit a{color:#f0d8a7;text-decoration:none}
    .walkpad{position:absolute;z-index:7;left:max(16px,env(safe-area-inset-left));bottom:max(82px,calc(env(safe-area-inset-bottom) + 76px));display:none;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:5px;touch-action:none;user-select:none;-webkit-user-select:none}
    .walkpad.show{display:grid}
    .walkpad button{width:54px;height:54px;padding:0;border-radius:17px;background:rgba(13,18,14,.62);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);color:#fff;font-size:21px;box-shadow:0 6px 20px rgba(0,0,0,.22);touch-action:none}
    .walkpad button:active{background:rgba(215,183,122,.26)}
    .walk-up{grid-column:2;grid-row:1}.walk-left{grid-column:1;grid-row:2}.walk-down{grid-column:2;grid-row:2}.walk-right{grid-column:3;grid-row:2}
    .walkhint{position:absolute;z-index:7;left:max(18px,env(safe-area-inset-left));bottom:max(194px,calc(env(safe-area-inset-bottom) + 188px));display:none;padding:7px 9px;border-radius:10px;background:rgba(13,18,14,.54);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);font-size:10px;backdrop-filter:blur(12px)}
    .walkhint.show{display:block}
    @media (max-width:640px){
      .card{max-width:calc(100vw - 76px);padding:9px 11px}
      h1{font-size:13px}.meta{font-size:10px}
      .credit{display:none}
      .toolbar{bottom:max(12px,calc(env(safe-area-inset-bottom) + 6px))}
      button{padding:9px 12px}
      .walkpad{bottom:max(78px,calc(env(safe-area-inset-bottom) + 72px))}
      .walkhint{bottom:max(192px,calc(env(safe-area-inset-bottom) + 186px))}
    }
  </style>
  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
</head>
<body>
  <main id="stage" aria-label="古风庭院实验区">
    <iframe id="viewer" title="Ancient Chinese courtyard Park 3D viewer"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen></iframe>
    <div class="veil"></div>

    <div class="topbar">
      <a class="back" href="/cloud" aria-label="返回猫窝">‹</a>
      <section class="card" aria-label="实验场景信息">
        <div class="eyebrow">Kitten Nest · Safe 3D Lab</div>
        <h1>Ancient Chinese Courtyard Park</h1>
        <div class="meta">268.6k tris · 154.2k verts · 古风庭院整片实验</div>
      </section>
    </div>

    <div id="status" class="status">庭院正在醒来…</div>

    <nav class="toolbar" aria-label="视角模式">
      <button id="orbitBtn" type="button">环绕看景</button>
      <button id="fpsBtn" type="button">第一视角</button>
      <button id="enterBtn" type="button">走进去</button>
      <button id="resetBtn" type="button">归位</button>
    </nav>

    <div id="walkHint" class="walkhint">按住方向键移动 · 在画面里拖动转头</div>
    <div id="walkPad" class="walkpad" aria-label="第一视角移动">
      <button class="walk-up" data-move="forward" aria-label="向前">↑</button>
      <button class="walk-left" data-move="left" aria-label="向左">←</button>
      <button class="walk-down" data-move="back" aria-label="向后">↓</button>
      <button class="walk-right" data-move="right" aria-label="向右">→</button>
    </div>

    <div class="credit">
      Scene: <a href="https://sketchfab.com/3d-models/ancient-chinese-courtyard-park-55d8371278844dbbbe43e1f867b5fcde" target="_blank" rel="noopener">Ancient Chinese courtyard Park</a>
      by noyou · CC BY · provided through Sketchfab.
    </div>
  </main>

  <script>
    (() => {
      const UID = '55d8371278844dbbbe43e1f867b5fcde';
      const iframe = document.getElementById('viewer');
      const status = document.getElementById('status');
      const orbitBtn = document.getElementById('orbitBtn');
      const fpsBtn = document.getElementById('fpsBtn');
      const resetBtn = document.getElementById('resetBtn');
      const enterBtn = document.getElementById('enterBtn');
      const walkPad = document.getElementById('walkPad');
      const walkHint = document.getElementById('walkHint');
      const params = new URLSearchParams(location.search);
      const coarse = matchMedia('(pointer: coarse)').matches;
      const mode = params.get('mode') === 'fps' ? 'fps' : params.get('mode') === 'orbit' ? 'orbit' : (coarse ? 'orbit' : 'fps');
      let api = null;

      orbitBtn.classList.toggle('active', mode === 'orbit');
      fpsBtn.classList.toggle('active', mode === 'fps');
      walkPad.classList.toggle('show', mode === 'fps');
      walkHint.classList.toggle('show', mode === 'fps');

      function switchMode(next) {
        const url = new URL(location.href);
        url.searchParams.set('mode', next);
        location.href = url.toString();
      }

      orbitBtn.addEventListener('click', () => switchMode('orbit'));
      fpsBtn.addEventListener('click', () => switchMode('fps'));
      resetBtn.addEventListener('click', () => {
        if (!api) return;
        if (typeof api.recenterCamera === 'function') api.recenterCamera();
        else if (typeof api.focusOnVisibleGeometries === 'function') api.focusOnVisibleGeometries();
      });

      enterBtn.addEventListener('click', () => {
        if (!api) return;
        if (mode !== 'fps') return switchMode('fps');
        api.getCameraLookAt((err, camera) => {
          if (err || !camera) return;
          const p = camera.position.slice();
          const t = camera.target.slice();
          const dx = t[0] - p[0], dy = t[1] - p[1];
          const horizontal = Math.hypot(dx, dy);
          if (horizontal < .001) return;
          const travel = Math.max(0, horizontal * .58);
          const nx = dx / horizontal, ny = dy / horizontal;
          const nextP = [p[0] + nx * travel, p[1] + ny * travel, p[2]];
          const nextT = [t[0] + nx * travel, t[1] + ny * travel, t[2]];
          api.setCameraLookAt(nextP, nextT, 1.2);
        });
      });

      let moveTimer = 0;
      let moveVector = null;
      let moveBusy = false;

      function walkTick() {
        if (!api || !moveVector || moveBusy) return;
        moveBusy = true;
        api.getCameraLookAt((err, camera) => {
          if (!err && camera && moveVector) {
            const p = camera.position.slice();
            const t = camera.target.slice();
            const fx0 = t[0] - p[0], fy0 = t[1] - p[1];
            const len = Math.hypot(fx0, fy0) || 1;
            const fx = fx0 / len, fy = fy0 / len;
            const rx = fy, ry = -fx;
            const step = .42;
            const mx = (fx * moveVector.forward + rx * moveVector.strafe) * step;
            const my = (fy * moveVector.forward + ry * moveVector.strafe) * step;
            api.setCameraLookAt(
              [p[0] + mx, p[1] + my, p[2]],
              [t[0] + mx, t[1] + my, t[2]],
              0
            );
          }
          moveBusy = false;
        });
      }

      function startWalk(kind) {
        if (mode !== 'fps') return;
        moveVector = kind === 'forward' ? {forward:1,strafe:0}
          : kind === 'back' ? {forward:-1,strafe:0}
          : kind === 'left' ? {forward:0,strafe:-1}
          : {forward:0,strafe:1};
        walkTick();
        clearInterval(moveTimer);
        moveTimer = setInterval(walkTick, 70);
      }

      function stopWalk() {
        moveVector = null;
        clearInterval(moveTimer);
        moveTimer = 0;
      }

      walkPad.querySelectorAll('[data-move]').forEach((button) => {
        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          startWalk(button.dataset.move);
        });
        button.addEventListener('pointerup', stopWalk);
        button.addEventListener('pointercancel', stopWalk);
        button.addEventListener('pointerleave', (event) => {
          if (event.buttons === 0) stopWalk();
        });
      });
      addEventListener('blur', stopWalk);

      if (!window.Sketchfab) {
        status.textContent = '3D viewer 加载失败';
        iframe.src = 'https://sketchfab.com/models/' + UID + '/embed?autostart=1&camera=0&dnt=1';
        return;
      }

      const client = new Sketchfab('1.12.1', iframe);
      client.init(UID, {
        autostart: 1,
        camera: 0,
        navigation: mode,
        fps_speed: 16,
        preload: 0,
        dnt: 1,
        dof_circle: 0,
        max_texture_size: coarse ? 2048 : 4096,
        ui_stop: 0,
        ui_theme: 'dark',
        success(viewerApi) {
          api = viewerApi;
          api.start();
          api.addEventListener('viewerready', () => {
            status.classList.add('ready');
            try { api.setShadingStyle('pbr', { type: 'lit' }); } catch (_) {}
            try { api.setFov(mode === 'fps' ? 62 : 48); } catch (_) {}
          });
        },
        error() {
          status.textContent = '庭院载入失败，正在切换兼容模式…';
          iframe.src = 'https://sketchfab.com/models/' + UID + '/embed?autostart=1&camera=0&dnt=1&navigation=' + mode;
        }
      });

      setTimeout(() => {
        if (!api && !status.classList.contains('ready')) {
          status.textContent = '首次载入可能较慢，请稍等…';
        }
      }, 8000);
    })();
  </script>
</body>
</html>
