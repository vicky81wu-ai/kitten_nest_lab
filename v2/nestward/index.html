<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#241915" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kitten Nest" />
  <title>Kitten Nest</title>
  <link rel="stylesheet" href="./nestward.css" />
</head>
<body>
  <main id="nestward" class="nestward-shell" aria-label="回家的小世界">
    <canvas id="world" aria-label="可以行走和互动的小世界"></canvas>

    <a class="nw-exit" href="/cloud" aria-label="返回猫窝"><span aria-hidden="true">‹</span></a>

    <div id="hint" class="nw-hint" hidden></div>
    <div id="bubble" class="nw-bubble" hidden><div id="bubbleText" class="nw-bubble__text"></div></div>

    <section id="actions" class="nw-actions" hidden aria-live="polite">
      <div id="actionTitle" class="nw-actions__title"></div>
      <div id="actionButtons" class="nw-actions__buttons"></div>
    </section>

    <section id="textPanel" class="nw-panel" hidden aria-modal="true" role="dialog">
      <button class="nw-panel__scrim" data-close-panel type="button" aria-label="关闭"></button>
      <div class="nw-paper">
        <div class="nw-paper__tape" aria-hidden="true"></div>
        <header class="nw-paper__head">
          <div><h1 id="textPanelTitle"></h1><p id="textPanelSub"></p></div>
          <button id="closeTextPanel" class="nw-close" type="button" aria-label="关闭">×</button>
        </header>
        <textarea id="textEditor" class="nw-textarea" rows="8" spellcheck="false"></textarea>
        <button id="saveText" class="nw-save" type="button">收进这里</button>
      </div>
    </section>

    <section id="wardrobePanel" class="nw-panel" hidden aria-modal="true" role="dialog">
      <button class="nw-panel__scrim" data-close-wardrobe type="button" aria-label="关闭"></button>
      <div class="nw-wardrobe">
        <header class="nw-wardrobe__head">
          <div><h1>衣柜</h1><p>喷泉送来的东西会自己找到这里</p></div>
          <button id="closeWardrobe" class="nw-close" type="button" aria-label="关闭">×</button>
        </header>
        <div class="nw-wardrobe__people">
          <section><h2>小猫</h2><div id="kittenOutfits" class="nw-outfits"></div></section>
          <section><h2>Hubby</h2><div id="hubbyOutfits" class="nw-outfits"></div></section>
        </div>
      </div>
    </section>

    <div id="transition" class="nw-transition" aria-hidden="true"></div>
    <div id="loading" class="nw-loading" aria-live="polite"><div class="nw-loading__glow"></div><p id="loadingStatus" class="nw-loading__status">小世界正在醒来</p></div>
  </main>
  <script type="module" src="./nestward.js"></script>
</body>
</html>
