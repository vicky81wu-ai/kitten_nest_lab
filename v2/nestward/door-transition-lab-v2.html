<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>NW Door Transition Lab v2</title></head>
<body style="margin:0;background:#17100e;color:#fff7ef;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<div id="boot" style="padding:24px">正在载入 Door Transition Lab v2…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./door-transition-lab.html?base=d09f18bb',{cache:'no-store'});
    if(!r.ok) throw new Error('base lab '+r.status);
    let html=await r.text();
    const oldScenes="const scenes={indoor:{wallBottom:465,floorBottom:1024,bg:'./assets/indoor-world.webp',kittenHeight:156,hubbyHeight:184},outdoor:{wallBottom:390,floorBottom:1024,bg:'./assets/outdoor-world.webp',kittenHeight:156,hubbyHeight:184}};";
    const newScenes="const scenes={indoor:{wallBottom:465,floorBottom:1024,bg:'./assets/indoor-world.webp',kittenHeight:257,hubbyHeight:294},outdoor:{wallBottom:390,floorBottom:1024,bg:'./assets/outdoor-world.webp',kittenHeight:156,hubbyHeight:184}};";
    const oldLayout="function actorLayout(el,role,pos){const scene=scenes[sceneName],height=(role==='kitten'?scene.kittenHeight:scene.hubbyHeight)*actorScale(pos.z);el.style.left=`${pos.x}px`;el.style.top=`${groundY(scene,pos.z)}px`;el.style.height=`${height}px`;el.style.width='auto';}";
    const newLayout="function actorLayout(el,role,pos){const scene=scenes[sceneName],perspective=actorScale(pos.z)/actorScale(.62),height=(role==='kitten'?scene.kittenHeight:scene.hubbyHeight)*perspective;el.style.left=`${pos.x}px`;el.style.top=`${groundY(scene,pos.z)}px`;el.style.height=`${height}px`;el.style.width='auto';}";
    const oldPrepare="async function prepareB(){try{const calibration=loadAcceptedDoorAwayCalibration();if(!calibration){badge.textContent='没有找到已验收 A/B；请从同一 Door Lab 固定域名打开';return}badge.textContent='生成已验收 B 门框…';const masks=await buildAcceptedDoorAwayMasks(calibration);await bg.decode().catch(()=>{});fgc.clearRect(0,0,W,H);fgc.drawImage(bg,0,0,W,H);fgc.globalCompositeOperation='destination-in';fgc.drawImage(masks.maskB,0,0);fgc.globalCompositeOperation='source-over';maskBReady=true;badge.textContent='B 门框就绪';setTimeout(()=>{if(badge.textContent==='B 门框就绪')badge.textContent='拖人物 → 确认坐标';},1200)}catch(err){console.error(err);badge.textContent='B 门框生成失败：'+err.message}}";
    const newPrepare="async function prepareB(){try{const calibration=loadAcceptedDoorAwayCalibration();if(!calibration){badge.textContent='没有找到已验收 A/B；请从同一 Door Lab 固定域名打开';return}badge.textContent='生成已验收 B 门框…';const masks=await buildAcceptedDoorAwayMasks(calibration);const indoorSource=new Image();indoorSource.src='./assets/indoor-world.webp';await indoorSource.decode();fgc.clearRect(0,0,W,H);fgc.globalCompositeOperation='source-over';fgc.drawImage(indoorSource,0,0,W,H);fgc.globalCompositeOperation='destination-in';fgc.drawImage(masks.maskB,0,0);fgc.globalCompositeOperation='source-over';maskBReady=true;badge.textContent='B 门框就绪';setTimeout(()=>{if(badge.textContent==='B 门框就绪')badge.textContent='拖人物 → 确认坐标';},1200)}catch(err){console.error(err);badge.textContent='B 门框生成失败：'+err.message}}";
    const oldBinding="$('#runPreview').onclick=previewLoop;$('#stopPreview').onclick=stopPreview;";
    const newBinding="const runPreviewBtn=$('#runPreview');runPreviewBtn.onclick=async()=>{if(sceneName!=='indoor')return;if(previewing){flash('预览已经在运行');return}runPreviewBtn.textContent='⏳ 等待 B 门框…';runPreviewBtn.classList.add('active');if(!maskBReady){badge.textContent='预览已请求 · 等待 B 门框…';for(let i=0;i<200&&!maskBReady;i++){await sleep(100);if(badge.textContent.startsWith('没有找到')||badge.textContent.startsWith('B 门框生成失败'))break}}if(!maskBReady){runPreviewBtn.textContent='▶ 循环预览 B 遮挡';runPreviewBtn.classList.remove('active');if(!badge.textContent.startsWith('没有找到')&&!badge.textContent.startsWith('B 门框生成失败'))badge.textContent='B 门框未就绪';return}runPreviewBtn.textContent='▶ 预览运行中';try{await previewLoop()}catch(err){console.error(err);badge.textContent='预览失败：'+err.message;previewing=false;runPreviewBtn.textContent='▶ 循环预览 B 遮挡';runPreviewBtn.classList.remove('active')}};$('#stopPreview').onclick=()=>{stopPreview();runPreviewBtn.textContent='▶ 循环预览 B 遮挡';runPreviewBtn.classList.remove('active')};";
    if(!html.includes(oldScenes)) throw new Error('scene sizing signature missing');
    if(!html.includes(oldLayout)) throw new Error('actor layout signature missing');
    if(!html.includes(oldPrepare)) throw new Error('B overlay signature missing');
    if(!html.includes(oldBinding)) throw new Error('preview binding signature missing');
    html=html.replace(oldScenes,newScenes).replace(oldLayout,newLayout).replace(oldPrepare,newPrepare).replace(oldBinding,newBinding);
    html=html.replace('<title>NW Door Transition Lab</title>','<title>NW Door Transition Lab v2</title>');
    html=html.replace('NW Door Transition Lab · 场景切换锚点','NW Door Transition Lab v2 · 场景切换锚点');
    document.open();document.write(html);document.close();
  }catch(err){
    document.getElementById('boot').textContent='Door Transition Lab v2 载入失败：'+err.message;
  }
})();
</script>
</body></html>
