<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asset Resolver Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5,#ffeef4,#f7edf7);color:#684054}main{max-width:900px;margin:0 auto;padding:24px 16px}.card{border-radius:28px;background:rgba(255,255,255,.78);padding:18px;margin:14px 0;box-shadow:0 18px 48px rgba(121,68,88,.14)}h1,h2{margin:0 0 8px;color:#63364a}p{color:#8b6474;line-height:1.55}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button,a{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;font-weight:800;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14)}.primary{background:#eafff1;color:#215c37}.warn{background:#fff8df;color:#7a5417}select{border:0;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14);font-weight:800}.grid{display:grid;grid-template-columns:1fr;gap:14px}img{width:100%;border-radius:22px;background:#fff0f4;display:block}.log{white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.6);border-radius:16px;padding:12px;margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#fff2f7;font-size:11px;margin:2px 4px 2px 0}</style></head><body><main><section class="card"><h1>Asset Resolver 预演桥</h1><p>模拟未来 /cloud 的图片解析顺序：本地图优先，Supabase 当前绑定第二，GitHub fallback 第三。这里只读，不改主窝。</p><div class="bar"><a href="/assets-admin/">素材库后台</a><a href="/asset-runtime-test/">runtime 读取测试</a><a class="primary" href="/cloud">回 /cloud</a></div></section><section class="card"><h2>选择槽位</h2><div class="bar"><select id="preset"><option value="coffeeCorner|background.main">coffeeCorner / background.main</option><option value="home|background.day">home / background.day</option><option value="home|background.night">home / background.night</option></select><button class="primary" id="run">运行解析</button></div></section><section class="card"><h2>解析结果</h2><div id="tags"></div><img id="img" alt="resolved asset" style="display:none"><div id="log" class="log">ready.</div></section></main><script>const SUPA='https://pmkxzmogolxllijzqnfr.supabase.co';const KEY='sb_publishable_a_E9X0r3m6i641s0KluUrg_squa6uc_';const GIT_FALLBACKS={ 'coffeeCorner|background.main':'/assets/rooms/coffee-corner/morning-evening.jpg', 'home|background.day':'/assets/rooms/home/day.jpg', 'home|background.night':'/assets/rooms/home/night.jpg' };const log=document.getElementById('log');function out(x){log.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function get(path){const r=await fetch(`${SUPA}/rest/v1/${path}`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,Accept:'application/json'}});const d=await r.json().catch(()=>[]);if(!r.ok)throw new Error(r.status+' '+JSON.stringify(d));return d}function localOverrideKey(room,slot){return `kittenNest.localAsset.${room}.${slot}`}async function resolve(room,slot){const key=`${room}|${slot}`;const local=localStorage.getItem(localOverrideKey(room,slot));if(local)return {source:'localStorage-demo',url:local,room,slot};const slots=await get(`room_asset_slots?select=room_id,slot,asset_id,status&room_id=eq.${encodeURIComponent(room)}&slot=eq.${encodeURIComponent(slot)}&status=eq.active&limit=1`);if(slots.length){const assetId=slots[0].asset_id;const assets=await get(`nest_assets?select=asset_id,room_id,status,storage_path,public_url,scene_group,scene_key,visibility,lock_state&asset_id=eq.${encodeURIComponent(assetId)}&status=eq.published&limit=1`);if(assets.length)return {source:'supabase-slot-binding',url:assets[0].public_url,room,slot,slotRow:slots[0],asset:assets[0]}}return {source:'git-fallback',url:GIT_FALLBACKS[key],room,slot}}async function run(){try{const [room,slot]=document.getElementById('preset').value.split('|');out('resolving '+room+' / '+slot+' ...');document.getElementById('tags').innerHTML='';const result=await resolve(room,slot);const img=document.getElementById('img');img.style.display='none';img.src=result.url+(result.url.includes('?')?'&':'?')+'v='+Date.now();img.onload=()=>{document.getElementById('tags').innerHTML=`<span class="tag">${result.source}</span><span class="tag">${room}</span><span class="tag">${slot}</span>`;img.style.display='block';out({ok:true,message:'asset resolver succeeded',result,image:{naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}})};img.onerror=()=>out({ok:false,message:'resolved image failed to load',result});}catch(e){out('ERROR: '+e.message)}}document.getElementById('run').onclick=run;run();</script></body></html>
