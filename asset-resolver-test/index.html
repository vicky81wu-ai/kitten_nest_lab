<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asset Resolver Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5,#ffeef4,#f7edf7);color:#684054}main{max-width:900px;margin:0 auto;padding:24px 16px}.card{border-radius:28px;background:rgba(255,255,255,.78);padding:18px;margin:14px 0;box-shadow:0 18px 48px rgba(121,68,88,.14)}h1,h2{margin:0 0 8px;color:#63364a}p{color:#8b6474;line-height:1.55}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button,a{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;font-weight:800;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14)}.primary{background:#eafff1;color:#215c37}.danger{background:#ffe5eb;color:#92223b}select{border:0;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14);font-weight:800}img{width:100%;border-radius:22px;background:#fff0f4;display:block}.log{white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.6);border-radius:16px;padding:12px;margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#fff2f7;font-size:11px;margin:2px 4px 2px 0}.sourceBox{border-radius:22px;background:rgba(255,255,255,.72);padding:14px;margin:12px 0;border:1px solid rgba(255,255,255,.9)}.sourceTitle{font-size:20px;font-weight:900;color:#63364a;margin-bottom:8px}.steps{display:grid;gap:8px;margin-top:10px}.step{border-radius:15px;padding:10px 12px;background:#fff;color:#7b5260;font-weight:800}.step.on{background:#eafff1;color:#215c37}.step.skip{opacity:.55}</style></head><body><main><section class="card"><h1>Asset Resolver 预演桥</h1><p>模拟未来 /cloud 的图片解析顺序：真实 IndexedDB 本地图优先，Supabase 当前绑定第二，GitHub fallback 第三。这里只读，不改主窝。</p><div class="bar"><a href="/assets-admin/">素材库后台</a><a href="/asset-runtime-test/">runtime 读取测试</a><a class="primary" href="/cloud">回 /cloud</a></div></section><section class="card"><h2>选择槽位</h2><div class="bar"><select id="preset"><option value="coffeeCorner|background.main">coffeeCorner / background.main</option><option value="home|background.day">home / background.day</option><option value="home|background.night">home / background.night</option></select><button class="primary" id="run">运行解析</button><button class="danger" id="clearLocal">撤下本槽位本地图</button></div></section><section class="card"><h2>解析结果</h2><div class="sourceBox"><div class="sourceTitle" id="sourceTitle">等待解析</div><div id="sourceText">还没运行。</div><div class="steps" id="steps"><div class="step">1 真实本地图 IndexedDB</div><div class="step">2 Supabase 当前绑定</div><div class="step">3 GitHub fallback</div></div></div><div id="tags"></div><img id="img" alt="resolved asset" style="display:none"><div id="log" class="log">ready.</div></section></main><script>const SUPA='https://pmkxzmogolxllijzqnfr.supabase.co';const KEY='sb_publishable_a_E9X0r3m6i641s0KluUrg_squa6uc_';const DB='kittenNestLabDB',STORE='images';const GIT_FALLBACKS={ 'coffeeCorner|background.main':'/assets/rooms/coffee-corner/morning-evening.jpg', 'home|background.day':'/assets/rooms/home/day.jpg', 'home|background.night':'/assets/rooms/home/night.jpg' };const LOCAL_KEYS={ 'coffeeCorner|background.main':'gameRoom', 'home|background.day':'homeOn', 'home|background.night':'homeOff' };const log=document.getElementById('log');function out(x){log.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}async function get(path){const r=await fetch(`${SUPA}/rest/v1/${path}`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,Accept:'application/json'}});const d=await r.json().catch(()=>[]);if(!r.ok)throw new Error(r.status+' '+JSON.stringify(d));return d}function selected(){return document.getElementById('preset').value.split('|')}function localKey(room,slot){return LOCAL_KEYS[`${room}|${slot}`]}function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function getLocalImage(key){if(!key)return null;const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const q=tx.objectStore(STORE).get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}async function deleteLocalImage(key){if(!key)return;const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function renderSource(result){const title=document.getElementById('sourceTitle'),text=document.getElementById('sourceText'),steps=document.getElementById('steps').children;[...steps].forEach(x=>{x.className='step skip'});if(result.source==='indexeddb-local-override'){title.textContent='当前使用：真实本地图 IndexedDB';text.textContent='验证了第一优先级：主窝上传的本地图存在，所以不再往下用 Supabase / GitHub。';steps[0].className='step on'}else if(result.source==='supabase-slot-binding'){title.textContent='当前使用：Supabase 当前绑定';text.textContent='没有本地图时，读取 room_asset_slots → nest_assets → public_url。';steps[1].className='step on'}else{title.textContent='当前使用：GitHub fallback';text.textContent='Supabase 没有可用 published 绑定时，回退到 GitHub 静态图。';steps[2].className='step on'}}async function resolve(room,slot){const key=`${room}|${slot}`;const lk=localKey(room,slot);const localBlob=await getLocalImage(lk).catch(()=>null);if(localBlob)return {source:'indexeddb-local-override',url:URL.createObjectURL(localBlob),room,slot,local_key:lk};const slots=await get(`room_asset_slots?select=room_id,slot,asset_id,status&room_id=eq.${encodeURIComponent(room)}&slot=eq.${encodeURIComponent(slot)}&status=eq.active&limit=1`);if(slots.length){const assetId=slots[0].asset_id;const assets=await get(`nest_assets?select=asset_id,room_id,status,storage_path,public_url,scene_group,scene_key,visibility,lock_state&asset_id=eq.${encodeURIComponent(assetId)}&status=eq.published&limit=1`);if(assets.length)return {source:'supabase-slot-binding',url:assets[0].public_url,room,slot,local_key:lk,slotRow:slots[0],asset:assets[0]}}return {source:'git-fallback',url:GIT_FALLBACKS[key],room,slot,local_key:lk}}async function run(){try{const [room,slot]=selected();out('resolving '+room+' / '+slot+' ...');document.getElementById('tags').innerHTML='';const result=await resolve(room,slot);renderSource(result);const img=document.getElementById('img');img.style.display='none';img.src=result.url+(result.url.startsWith('blob:')?'':((result.url.includes('?')?'&':'?')+'v='+Date.now()));img.onload=()=>{document.getElementById('tags').innerHTML=`<span class="tag">${result.source}</span><span class="tag">${room}</span><span class="tag">${slot}</span><span class="tag">local key: ${result.local_key||'none'}</span>`;img.style.display='block';out({ok:true,message:'asset resolver succeeded',used_source:result.source,result,image:{naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}})};img.onerror=()=>out({ok:false,message:'resolved image failed to load',result});}catch(e){out('ERROR: '+e.message)}}document.getElementById('run').onclick=run;document.getElementById('clearLocal').onclick=async()=>{const [room,slot]=selected();const lk=localKey(room,slot);await deleteLocalImage(lk);out('removed real local override: '+lk);run()};run();</script></body></html>
