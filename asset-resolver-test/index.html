<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asset Resolver Test</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#fff4f7;color:#684054}main{padding:18px;max-width:760px;margin:auto}.card{background:white;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 30px #0001}button,a{display:inline-block;margin:4px;padding:10px 12px;border:0;border-radius:14px;background:#eafff1;color:#215c37;font-weight:800;text-decoration:none}.imgbox{border-radius:22px;overflow:hidden;background:#120b12}.imgbox img{width:100%;display:block}.chips span{display:inline-block;margin:4px;padding:6px 9px;border-radius:999px;background:#fff2f7;font-size:12px;font-weight:800}.log{white-space:pre-wrap;word-break:break-all;background:#fff8fb;border-radius:14px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}</style></head><body><main><div class="card"><h1>Asset Resolver Test</h1><p>静态 resolver 测试页：引用 /lib/asset-resolver.js，不使用 /api，不新增 Vercel Function。</p><a href="/cloud">回 /cloud</a><a href="/dynamic-preview.html?v=from-resolver-test">动态预览页</a><button id="run">重新解析</button><button id="homeDay">主页亮图</button><button id="homeNight">主页暗图</button><button id="coffee">咖啡角</button></div><div class="card"><div class="chips" id="chips"></div><div class="imgbox"><img id="img" alt="resolved image"></div><div class="log" id="log">booting...</div></div></main><script src="/lib/asset-resolver.js?v=static-1"></script><script>const slots={homeDay:['home','background.day','主页亮图'],homeNight:['home','background.night','主页暗图'],coffee:['coffeeCorner','background.main','咖啡角']};let current='coffee';const img=document.getElementById('img'),log=document.getElementById('log'),chips=document.getElementById('chips');function url(r){return r.url+(r.url&&r.url.startsWith('blob:')?'':((r.url&&r.url.includes('?')?'&':'?')+'v='+Date.now()))}async function resolveOne(k){current=k;try{if(!window.KittenNestAssetResolver)throw new Error('resolver not loaded');const s=slots[k];const r=await window.KittenNestAssetResolver.resolveAsset(s[0],s[1]);img.src=url(r);chips.innerHTML='<span>'+s[2]+'</span><span>'+r.source+'</span><span>local key: '+(r.local_key||'none')+'</span>';log.textContent=JSON.stringify(r,null,2)}catch(e){log.textContent='ERROR: '+e.message}}document.getElementById('run').onclick=()=>resolveOne(current);document.getElementById('homeDay').onclick=()=>resolveOne('homeDay');document.getElementById('homeNight').onclick=()=>resolveOne('homeNight');document.getElementById('coffee').onclick=()=>resolveOne('coffee');resolveOne('coffee');</script></body></html>
