<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Asset Resolver Test</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5,#ffeef4,#f7edf7);color:#684054}body.preview{height:100vh;overflow:hidden;background:#120b12}main{max-width:900px;margin:0 auto;padding:24px 16px}.card{border-radius:28px;background:rgba(255,255,255,.78);padding:18px;margin:14px 0;box-shadow:0 18px 48px rgba(121,68,88,.14)}h1,h2{margin:0 0 8px;color:#63364a}p{color:#8b6474;line-height:1.55}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button,a{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;font-weight:800;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14)}.primary{background:#eafff1;color:#215c37}.danger{background:#ffe5eb;color:#92223b}.warn{background:#fff8df;color:#7a5417}select{border:0;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14);font-weight:800}img{width:100%;border-radius:22px;background:#fff0f4;display:block}.log{white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.6);border-radius:16px;padding:12px;margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#fff2f7;font-size:11px;margin:2px 4px 2px 0}.sourceBox{border-radius:22px;background:rgba(255,255,255,.72);padding:14px;margin:12px 0;border:1px solid rgba(255,255,255,.9)}.sourceTitle{font-size:20px;font-weight:900;color:#63364a;margin-bottom:8px}.steps{display:grid;gap:8px;margin-top:10px}.step{border-radius:15px;padding:10px 12px;background:#fff;color:#7b5260;font-weight:800}.step.on{background:#eafff1;color:#215c37}.step.skip{opacity:.55}.screen{position:fixed;inset:0;width:100vw;height:100dvh;background:#120b12;overflow:hidden;display:none}.preview .screen{display:block}.preview main{display:none}.room{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease}.room.active{opacity:1;pointer-events:auto}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0;background:#120b12}.home-off{opacity:0}.night .home-on{opacity:0}.night .home-off{opacity:1}.hot{position:absolute;border:0;background:transparent;z-index:20}.toGameHot{right:0;bottom:0;width:28%;height:20%}.toHomeHot{left:0;top:0;width:22%;height:14%}.bubble{position:absolute;right:5%;top:20%;max-width:45%;min-width:120px;padding:12px 14px;border-radius:20px;background:rgba(255,248,245,.86);border:1.4px solid rgba(255,255,255,.92);box-shadow:0 10px 28px rgba(83,38,51,.18);font-size:clamp(14px,3.5vw,20px);line-height:1.28;color:#733447;font-weight:540;z-index:22}.hud{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:90;border-radius:22px;padding:12px;background:rgba(255,245,247,.9);backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(58,19,38,.28);font-size:12px;color:#69394a}.pill{display:inline-block;border-radius:999px;padding:6px 9px;background:#fff;color:#704456;font-weight:800;margin:3px}.pill.on{background:#eafff1;color:#215c37}.pill.warn{background:#fff8df;color:#7a5417}.toast{position:absolute;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:100;background:rgba(255,247,244,.92);border-radius:999px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:.25s}.toast.show{opacity:1}</style></head><body><main><section class="card"><h1>Asset Resolver 预演桥</h1><p>已改成双模式：普通模式看单张解析；动态预演模式模拟接近 /cloud 的三张主图运行。调用共享 resolver，不改正式 /cloud。</p><div class="bar"><button class="primary" id="openPreview">进入动态主窝预演</button><a href="/assets-admin/">素材库后台</a><a class="primary" href="/cloud">回 /cloud</a></div></section><section class="card"><h2>选择槽位</h2><div class="bar"><select id="preset"><option value="coffeeCorner|background.main">coffeeCorner / background.main</option><option value="home|background.day">home / background.day</option><option value="home|background.night">home / background.night</option></select><button class="primary" id="run">运行解析</button><button class="danger" id="clearLocal">撤下本槽位本地图</button></div></section><section class="card"><h2>解析结果</h2><div class="sourceBox"><div class="sourceTitle" id="sourceTitle">等待解析</div><div id="sourceText">还没运行。</div><div class="steps" id="steps"><div class="step">1 真实本地图 IndexedDB</div><div class="step">2 Supabase 当前绑定</div><div class="step">3 GitHub fallback</div></div></div><div id="tags"></div><img id="img" alt="resolved asset" style="display:none"><div id="log" class="log">ready.</div></section></main><div id="preview" class="screen"><section id="homeRoom" class="room active"><img id="homeDay" class="bg home-on"><img id="homeNight" class="bg home-off"><button id="toCoffee" class="hot toGameHot"></button></section><section id="coffeeRoom" class="room"><img id="coffeeBg" class="bg"><button id="toHome" class="hot toHomeHot"></button><div class="bubble">come here, kitten.</div></section><div class="hud"><b>动态主窝预演</b><div id="previewSources"></div><div class="bar"><button id="reloadPreview" class="primary">重新解析三张图</button><button id="showHome" class="warn">主页</button><button id="showCoffee" class="warn">咖啡角</button><button id="toggleNight" class="warn">切日夜</button><button id="closePreview" class="danger">退出预演</button></div><div id="previewLog" class="log">booting...</div></div><div id="toast" class="toast">saved</div></div><script src="/api/asset-resolver.js?v=shared-1"></script><script>const log=document.getElementById('log');function out(x){log.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function selected(){return document.getElementById('preset').value.split('|')}function renderSource(result){const title=document.getElementById('sourceTitle'),text=document.getElementById('sourceText'),steps=document.getElementById('steps').children;[...steps].forEach(x=>{x.className='step skip'});if(result.source==='indexeddb-local-override'){title.textContent='当前使用：真实本地图 IndexedDB';text.textContent='主窝上传的本地图存在，所以不再往下用 Supabase / GitHub。';steps[0].className='step on'}else if(result.source==='supabase-slot-binding'){title.textContent='当前使用：Supabase 当前绑定';text.textContent='没有本地图时，读取 room_asset_slots → nest_assets → public_url。';steps[1].className='step on'}else{title.textContent='当前使用：GitHub fallback';text.textContent='Supabase 没有可用 published 绑定时，回退到 GitHub 静态图。';steps[2].className='step on'}}function imgUrl(result){if(!result.url)return'';return result.url+(result.url.startsWith('blob:')?'':((result.url.includes('?')?'&':'?')+'v='+Date.now()))}async function run(){try{if(!window.KittenNestAssetResolver)throw new Error('shared resolver module not loaded');const [room,slot]=selected();out('resolving '+room+' / '+slot+' ...');document.getElementById('tags').innerHTML='';const result=await window.KittenNestAssetResolver.resolveAsset(room,slot);renderSource(result);const img=document.getElementById('img');img.style.display='none';img.src=imgUrl(result);img.onload=()=>{document.getElementById('tags').innerHTML=`<span class="tag">${result.source}</span><span class="tag">${room}</span><span class="tag">${slot}</span><span class="tag">local key: ${result.local_key||'none'}</span>`;img.style.display='block';out({ok:true,message:'asset resolver succeeded',used_source:result.source,result,image:{naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}})};img.onerror=()=>out({ok:false,message:'resolved image failed to load',result});}catch(e){out('ERROR: '+e.message)}}document.getElementById('run').onclick=run;document.getElementById('clearLocal').onclick=async()=>{const [room,slot]=selected();await window.KittenNestAssetResolver.deleteLocalBlob(room,slot);out('removed real local override for '+room+' / '+slot);run()};const previewSlots=[{room:'home',slot:'background.day',img:document.getElementById('homeDay'),label:'主页亮图'},{room:'home',slot:'background.night',img:document.getElementById('homeNight'),label:'主页暗图'},{room:'coffeeCorner',slot:'background.main',img:document.getElementById('coffeeBg'),label:'咖啡角'}];const pState={};function flash(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}function renderPreviewSources(){document.getElementById('previewSources').innerHTML=previewSlots.map(s=>{const k=s.room+'|'+s.slot,src=pState[k]?.source||'pending',cls=src==='indexeddb-local-override'?'on':(src==='git-fallback'?'warn':'');return `<span class="pill ${cls}">${s.label}: ${src}</span>`}).join('')}async function resolvePreview(){try{document.getElementById('previewLog').textContent='resolving...';for(const s of previewSlots){const r=await window.KittenNestAssetResolver.resolveAsset(s.room,s.slot);pState[s.room+'|'+s.slot]=r;s.img.src=imgUrl(r)}renderPreviewSources();document.getElementById('previewLog').textContent=JSON.stringify(pState,null,2);flash('三张图已解析')}catch(e){document.getElementById('previewLog').textContent='ERROR: '+e.message}}function setPreviewRoom(r){document.getElementById('homeRoom').classList.toggle('active',r==='home');document.getElementById('coffeeRoom').classList.toggle('active',r==='coffee')}document.getElementById('openPreview').onclick=()=>{document.body.classList.add('preview');resolvePreview()};document.getElementById('closePreview').onclick=()=>document.body.classList.remove('preview');document.getElementById('reloadPreview').onclick=resolvePreview;document.getElementById('showHome').onclick=()=>setPreviewRoom('home');document.getElementById('showCoffee').onclick=()=>setPreviewRoom('coffee');document.getElementById('toCoffee').onclick=()=>setPreviewRoom('coffee');document.getElementById('toHome').onclick=()=>setPreviewRoom('home');document.getElementById('toggleNight').onclick=()=>document.body.classList.toggle('night');run();</script></body></html>
