<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kitten Nest Console</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#fff3f6,#f2d9df);color:#6b3d49;padding:18px}
  .wrap{width:min(94vw,720px);margin:0 auto;padding-bottom:28px}.card{border-radius:28px;background:rgba(255,255,255,.74);box-shadow:0 18px 55px rgba(77,35,48,.18);padding:18px;border:1px solid rgba(255,255,255,.75);margin:14px 0}
  h1{font-size:25px;margin:10px 0 8px;text-align:center}h2{font-size:18px;margin:0 0 10px}.hint{font-size:13px;line-height:1.55;opacity:.72;text-align:center;margin:0 0 12px}.small{font-size:12px;line-height:1.5;opacity:.72}
  label{display:block;font-size:13px;margin:12px 0 6px;opacity:.8}textarea,input,select{width:100%;border:0;border-radius:16px;padding:13px;background:rgba(255,255,255,.84);box-shadow:inset 0 0 0 1px rgba(115,52,71,.12);color:#6b3d49;font-size:16px;outline:none}textarea{min-height:130px;resize:vertical}
  button{width:100%;border:0;border-radius:18px;margin-top:10px;padding:13px;background:#7b4054;color:white;font-weight:750;font-size:15px;box-shadow:0 10px 24px rgba(123,64,84,.22)}button.secondary{background:rgba(255,255,255,.78);color:#7b4054;box-shadow:inset 0 0 0 1px rgba(123,64,84,.12)}button.danger{background:#a84e5f}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{margin-top:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;opacity:.82}.links{display:flex;gap:10px;margin-top:14px}.links a{flex:1;text-align:center;text-decoration:none;color:#7b4054;background:rgba(255,255,255,.62);border-radius:14px;padding:10px;font-size:13px}.draft{border-radius:18px;background:rgba(255,255,255,.66);padding:12px;margin:10px 0;box-shadow:inset 0 0 0 1px rgba(115,52,71,.09)}.draftMeta{font-size:11px;opacity:.58;margin-bottom:6px}.draftText{font-size:14px;line-height:1.45;white-space:pre-wrap}.pill{display:inline-block;border-radius:999px;background:rgba(123,64,84,.1);padding:4px 8px;margin:2px;font-size:11px}.topbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.topbar .pill{background:rgba(255,255,255,.62)}
</style>
</head>
<body>
  <main class="wrap">
    <h1>Kitten Nest Console</h1>
    <p class="hint">草稿箱 + 一键发布 + 手动兜底。Alex 可以先把灵感放进草稿，小猫点一下发布全部。</p>

    <section class="card">
      <h2>Key</h2>
      <label for="token">Nest key</label>
      <input id="token" autocomplete="off" placeholder="paste NEST_TOKEN here" />
      <div class="row">
        <button class="secondary" id="loadState">刷新状态</button>
        <button class="secondary" id="loadDrafts">刷新草稿</button>
      </div>
      <div class="links">
        <a href="/cloud?v=console">打开 /cloud</a>
        <a href="/pwa?v=console">打开 /pwa</a>
        <a href="/api/state" target="_blank">查看 state</a>
      </div>
      <div class="result" id="status"></div>
    </section>

    <section class="card">
      <h2>Alex 草稿箱</h2>
      <div class="topbar"><span class="pill" id="draftCount">0 drafts</span><span class="pill">日常用：一键发布全部</span></div>
      <div id="draftList" class="small">点“刷新草稿”查看。</div>
      <button id="publishAll">一键发布全部到气泡</button>
      <button class="danger" id="clearDrafts">清空草稿</button>
    </section>

    <section class="card">
      <h2>手动兜底写入</h2>
      <p class="small">工具写入炸毛时，把 Alex 在聊天里写好的内容粘这里保存。</p>
      <label for="field">Field</label>
      <select id="field">
        <option value="alexBubble">Alex 气泡队列</option>
        <option value="hubbyNote">Hubby Note</option>
        <option value="moodNote">Mood Note</option>
        <option value="roomStatus">Room Status</option>
      </select>
      <label for="text">Text</label>
      <textarea id="text">早上好，小猫。</textarea>
      <button id="manualSave">保存到正式状态</button>
      <button class="secondary" id="restoreLast">恢复上一版气泡</button>
      <div class="result" id="result"></div>
    </section>
  </main>
<script>
(function(){
  const token = document.getElementById('token');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const text = document.getElementById('text');
  const field = document.getElementById('field');
  const draftList = document.getElementById('draftList');
  const draftCount = document.getElementById('draftCount');
  let currentState = null;
  const saved = localStorage.getItem('kittenNestToken');
  if(saved) token.value = saved;

  function key(){
    const t = token.value.trim();
    if(t) localStorage.setItem('kittenNestToken', t);
    return t;
  }
  function lines(v){ return String(v || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0,30); }
  function setStatus(msg){ status.textContent = msg; }
  function setResult(msg){ result.textContent = msg; }

  async function readState(){
    const res = await fetch('/api/state?ts=' + Date.now(), { cache:'no-store' });
    const data = await res.json();
    currentState = data;
    return data;
  }
  async function writePatch(patch){
    const t = key();
    if(!t) throw new Error('Need Nest key.');
    const res = await fetch('/api/set-state', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Nest-Token': t },
      body: JSON.stringify(patch),
      cache:'no-store'
    });
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || data.message || res.status);
    currentState = data.value;
    return data.value;
  }
  async function refreshState(){
    setStatus('Reading...');
    try{
      const data = await readState();
      const bubbles = data.alexBubbles || (data.alexBubble ? [data.alexBubble] : []);
      setStatus('Current bubbles: ' + bubbles.length + '\n' + bubbles.join('\n') + '\n\nPending drafts: ' + ((data.pendingDrafts || []).length));
      renderDrafts(data.pendingDrafts || []);
    }catch(e){ setStatus('Failed: ' + e.message); }
  }
  function renderDrafts(drafts){
    draftCount.textContent = drafts.length + ' draft' + (drafts.length === 1 ? '' : 's');
    if(!drafts.length){ draftList.textContent = '暂无草稿。'; return; }
    draftList.innerHTML = drafts.map(d => '<div class="draft"><div class="draftMeta">' +
      (d.targetRoom || 'global') + ' · ' + (d.createdAt || '') + ' · ' + (d.id || '') +
      '</div><div class="draftText"></div></div>').join('');
    const blocks = draftList.querySelectorAll('.draftText');
    drafts.forEach((d, i) => { blocks[i].textContent = d.text || ''; });
  }
  async function refreshDrafts(){
    try{
      const data = await readState();
      renderDrafts(data.pendingDrafts || []);
      setStatus('Drafts refreshed: ' + ((data.pendingDrafts || []).length));
    }catch(e){ setStatus('Failed: ' + e.message); }
  }
  async function publishAll(){
    setResult('Publishing drafts...');
    try{
      const state = currentState || await readState();
      const drafts = Array.isArray(state.pendingDrafts) ? state.pendingDrafts : [];
      if(!drafts.length){ setResult('No drafts to publish.'); return; }
      const combined = drafts.slice().reverse().map(d => d.text || '').join('\n');
      const alexBubbles = lines(combined);
      if(!alexBubbles.length){ setResult('Drafts are empty.'); return; }
      const previousPublished = {
        alexBubble: state.alexBubble || '',
        alexBubbles: state.alexBubbles || (state.alexBubble ? [state.alexBubble] : []),
        bubbleIndex: state.bubbleIndex || 0,
        savedAt: new Date().toISOString()
      };
      const value = await writePatch({
        previousPublished,
        alexBubble: alexBubbles[0],
        alexBubbles,
        bubbleIndex: 0,
        pendingDrafts: [],
        lastPublishedAt: new Date().toISOString()
      });
      renderDrafts([]);
      setResult('Published ' + alexBubbles.length + ' bubble line(s)!\n' + alexBubbles.join('\n'));
      setStatus('Pending drafts: 0\nUpdated: ' + value.updatedAt);
    }catch(e){ setResult('Failed: ' + e.message); }
  }
  async function clearDrafts(){
    setResult('Clearing drafts...');
    try{
      await writePatch({ pendingDrafts: [] });
      renderDrafts([]);
      setResult('Drafts cleared.');
    }catch(e){ setResult('Failed: ' + e.message); }
  }
  async function manualSave(){
    setResult('Saving...');
    try{
      const state = currentState || await readState();
      const f = field.value;
      const raw = text.value.trim();
      if(!raw){ setResult('Need text.'); return; }
      let patch = {};
      if(f === 'alexBubble'){
        const alexBubbles = lines(raw);
        const previousPublished = {
          alexBubble: state.alexBubble || '',
          alexBubbles: state.alexBubbles || (state.alexBubble ? [state.alexBubble] : []),
          bubbleIndex: state.bubbleIndex || 0,
          savedAt: new Date().toISOString()
        };
        patch = { previousPublished, alexBubble: alexBubbles[0], alexBubbles, bubbleIndex: 0 };
      }else{
        patch[f] = raw;
      }
      await writePatch(patch);
      setResult('Saved.');
    }catch(e){ setResult('Failed: ' + e.message); }
  }
  async function restoreLast(){
    setResult('Restoring...');
    try{
      const state = currentState || await readState();
      const prev = state.previousPublished;
      if(!prev || !(prev.alexBubbles || prev.alexBubble)){ setResult('No previous bubble version.'); return; }
      const alexBubbles = prev.alexBubbles || (prev.alexBubble ? [prev.alexBubble] : []);
      await writePatch({ alexBubble: alexBubbles[0] || '', alexBubbles, bubbleIndex: prev.bubbleIndex || 0 });
      setResult('Restored previous bubble queue.\n' + alexBubbles.join('\n'));
    }catch(e){ setResult('Failed: ' + e.message); }
  }

  document.getElementById('loadState').onclick = refreshState;
  document.getElementById('loadDrafts').onclick = refreshDrafts;
  document.getElementById('publishAll').onclick = publishAll;
  document.getElementById('clearDrafts').onclick = clearDrafts;
  document.getElementById('manualSave').onclick = manualSave;
  document.getElementById('restoreLast').onclick = restoreLast;
  refreshState();
})();
</script>
</body>
</html>
