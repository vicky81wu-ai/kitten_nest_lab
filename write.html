<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Cloud Bubble Writer</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff3f6,#f2d9df);color:#6b3d49;padding:22px}
  .card{width:min(92vw,520px);border-radius:28px;background:rgba(255,255,255,.72);box-shadow:0 18px 55px rgba(77,35,48,.18);padding:22px;border:1px solid rgba(255,255,255,.75)}
  h1{font-size:24px;margin:0 0 8px;text-align:center}.hint{font-size:13px;line-height:1.55;opacity:.72;text-align:center;margin:0 0 16px}
  label{display:block;font-size:13px;margin:12px 0 6px;opacity:.8}textarea,input{width:100%;border:0;border-radius:16px;padding:13px;background:rgba(255,255,255,.82);box-shadow:inset 0 0 0 1px rgba(115,52,71,.12);color:#6b3d49;font-size:16px;outline:none}textarea{min-height:150px;resize:vertical}
  button{width:100%;border:0;border-radius:18px;margin-top:16px;padding:14px;background:#7b4054;color:white;font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(123,64,84,.22)}
  .result{margin-top:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;opacity:.82}.links{display:flex;gap:10px;margin-top:14px}.links a{flex:1;text-align:center;text-decoration:none;color:#7b4054;background:rgba(255,255,255,.56);border-radius:14px;padding:10px;font-size:13px}
</style>
</head>
<body>
  <main class="card">
    <h1>Alex Bubble Writer</h1>
    <p class="hint">一行一句。保存后打开云猫窝，点气泡关闭，再点会显示下一句。</p>
    <label for="text">Bubble lines</label>
    <textarea id="text">come here, kitten.
奶栗刚刚踩过毯子。
老婆需要抱抱。</textarea>
    <label for="token">Nest key</label>
    <input id="token" autocomplete="off" placeholder="paste NEST_TOKEN here" />
    <button id="save">Save bubble queue</button>
    <div class="result" id="result"></div>
    <div class="links">
      <a href="/cloud?v=writer">Open cloud nest</a>
      <a href="/api/state" target="_blank">Check state</a>
    </div>
  </main>
<script>
(function(){
  const text = document.getElementById('text');
  const token = document.getElementById('token');
  const result = document.getElementById('result');
  const saved = localStorage.getItem('kittenNestToken');
  if(saved) token.value = saved;
  document.getElementById('save').onclick = async function(){
    const t = token.value.trim();
    const m = text.value.trim();
    if(!t){ result.textContent = 'Need Nest key.'; return; }
    if(!m){ result.textContent = 'Need bubble lines.'; return; }
    localStorage.setItem('kittenNestToken', t);
    result.textContent = 'Saving...';
    try{
      const res = await fetch('/api/say', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ t, text: m }),
        cache:'no-store'
      });
      const data = await res.json();
      if(!res.ok || !data.ok){ result.textContent = 'Failed: ' + (data.error || res.status); return; }
      result.textContent = 'Saved ' + data.count + ' line(s)!\n' + (data.alexBubbles || [data.alexBubble]).join('\n');
    }catch(e){ result.textContent = 'Failed: ' + e.message; }
  };
})();
</script>
</body>
</html>
