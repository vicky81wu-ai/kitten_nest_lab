<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kitten Nest Assets Auth Test</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5 0%,#ffeef4 48%,#f7edf7 100%);color:#684054}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 8%,rgba(255,212,225,.72),transparent 28%),radial-gradient(circle at 86% 16%,rgba(255,238,198,.68),transparent 24%);z-index:-1}
  main{max-width:760px;margin:0 auto;padding:26px 18px 44px}.hero,.card{border-radius:30px;padding:18px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 48px rgba(121,68,88,.14),inset 0 0 0 1px rgba(255,225,235,.55);backdrop-filter:blur(16px);margin-bottom:14px}
  h1{margin:0 0 8px;font-size:28px;line-height:1.15;color:#63364a}p{color:#8b6474;line-height:1.55;margin:8px 0 14px}.note{border-radius:18px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.78);padding:12px 13px;margin:14px 0;color:#7b5260;font-size:13px;line-height:1.55}
  label{display:block;font-size:12px;font-weight:800;color:#704456;margin:12px 0 5px}input{width:100%;border:0;border-radius:15px;padding:12px 13px;background:#fff;color:#63364a;box-shadow:inset 0 0 0 1px rgba(105,57,74,.13);font-size:15px}input:focus{outline:2px solid rgba(255,166,195,.45)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a.btn{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14),0 6px 16px rgba(121,68,88,.1);font-weight:800;font-size:14px}.primary{background:#eafff1;color:#215c37}.warn{background:#fff8df;color:#6d4a10}.danger{background:#ffe5eb;color:#92223b}button:disabled{opacity:.58}
  .result{margin-top:14px;padding:12px;border-radius:16px;background:rgba(255,255,255,.54);color:#704456;font-size:13px;line-height:1.5;white-space:pre-wrap;border:1px solid rgba(255,255,255,.72);word-break:break-all}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>Supabase 管理员登录测试</h1>
    <p>这一步只创建/登录 Supabase Auth 账号并显示 UID。它不上传图片、不写素材户口本、不改 /cloud。</p>
    <div class="note">建议用小猫自己的邮箱。密码只会发给 Supabase Auth；这个页面不会保存密码。确认邮件如果打开后跳错页面，也不影响已确认账号。</div>
  </section>

  <section class="card">
    <label for="email">邮箱</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位" />
    <div class="bar">
      <button class="primary" id="signUp">注册 / 创建账号</button>
      <button class="warn" id="signIn">登录</button>
      <button class="danger" id="signOut">退出登录</button>
      <a class="btn" href="/assets-admin/?v=auth-test-back">回素材库后台</a>
      <a class="btn primary" href="/assets-upload-edge/?v=from-auth-test">去 Edge 上传测试</a>
    </div>
    <div class="result mono" id="result">ready.</div>
  </section>
</main>
<script>
const SUPABASE_URL = 'https://pmkxzmogolxllijzqnfr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_a_E9X0r3m6i641s0KluUrg_squa6uc_';
const TOKEN_KEY = 'kittenNestSupabaseSession';
const AUTH_REDIRECT_TO = 'https://kitten-nest-lab.vercel.app/assets-auth-test/';
const result = document.getElementById('result');
function out(x){ result.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2); }
function creds(){ return { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value }; }
function saveSession(data){ if(data && data.access_token) localStorage.setItem(TOKEN_KEY, JSON.stringify(data)); }
function getSession(){ try{return JSON.parse(localStorage.getItem(TOKEN_KEY)||'null')}catch(e){return null} }
async function authFetch(path, body){
  const sep = path.includes('?') ? '&' : '?';
  const fullPath = `${path}${sep}redirect_to=${encodeURIComponent(AUTH_REDIRECT_TO)}`;
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${fullPath}`, {
    method:'POST',
    headers:{ apikey: SUPABASE_PUBLISHABLE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(JSON.stringify(data));
  return data;
}
async function getUser(){
  const session = getSession();
  if(!session || !session.access_token){ out('未登录。'); return; }
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    headers:{ apikey: SUPABASE_PUBLISHABLE_KEY, Authorization:`Bearer ${session.access_token}` }
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(JSON.stringify(data));
  out({status:'logged_in', user_id:data.id, email:data.email, note:'已登录。现在可以去 assets-upload-edge 上传测试图。'});
}
document.getElementById('signUp').onclick = async e => {
  e.currentTarget.disabled = true;
  try{ const data = await authFetch('signup', creds()); saveSession(data); out(data.user ? {status:'signed_up', user_id:data.user.id, email:data.user.email, note:'如果需要邮箱确认，请先确认邮件；确认后回本页登录。'} : data); }
  catch(err){ out('ERROR: ' + err.message); }
  finally{ e.currentTarget.disabled = false; }
};
document.getElementById('signIn').onclick = async e => {
  e.currentTarget.disabled = true;
  try{ const data = await authFetch('token?grant_type=password', creds()); saveSession(data); await getUser(); }
  catch(err){ out('ERROR: ' + err.message); }
  finally{ e.currentTarget.disabled = false; }
};
document.getElementById('signOut').onclick = () => { localStorage.removeItem(TOKEN_KEY); out('已退出本页保存的 Supabase session。'); };
getUser().catch(err => out('ERROR: ' + err.message));
</script>
</body>
</html>
