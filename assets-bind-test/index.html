<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asset Bind Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5,#ffeef4,#f7edf7);color:#684054}main{max-width:980px;margin:0 auto;padding:24px 16px}.card{border-radius:28px;background:rgba(255,255,255,.78);padding:18px;margin:14px 0;box-shadow:0 18px 48px rgba(121,68,88,.14)}h1,h2{margin:0 0 8px;color:#63364a}p{color:#8b6474;line-height:1.55}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button,a{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;font-weight:800;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14)}.primary{background:#eafff1;color:#215c37}.warn{background:#fff8df;color:#7a5417}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.asset{border-radius:22px;background:rgba(255,255,255,.74);overflow:hidden;border:1px solid rgba(255,255,255,.9)}img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#fff0f4;display:block}.body{padding:12px}.meta{font-size:12px;line-height:1.45;word-break:break-all;color:#7b5260;margin:5px 0}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#fff2f7;font-size:11px;margin:2px 4px 2px 0}.log{white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.6);border-radius:16px;padding:12px;margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}</style></head><body><main><section class="card"><h1>发布 / 绑定测试</h1><p>把素材库里的图片设为某个房间槽位当前 asset。这里只改 Supabase 户口本和槽位表；主 /cloud 画面暂时不会跟着切。</p><div class="bar"><a href="/assets-auth-test/">管理员登录</a><a href="/assets-upload-edge/">上传测试</a><a href="/assets-admin/">素材库后台</a><a class="primary" href="/cloud">回 /cloud</a></div></section><section class="card"><h2>当前 coffeeCorner / background.main</h2><div id="slotNow" class="log">loading...</div></section><section class="card"><h2>coffeeCorner 素材</h2><div id="assets" class="grid"></div><div id="log" class="log">ready.</div></section></main><script>const SUPA='https://pmkxzmogolxllijzqnfr.supabase.co';const KEY='sb_publishable_a_E9X0r3m6i641s0KluUrg_squa6uc_';const TOKEN_KEY='kittenNestSupabaseSession';const BIND='https://pmkxzmogolxllijzqnfr.supabase.co/functions/v1/nest-asset-bind-form';const logEl=document.getElementById('log');function out(x){logEl.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function session(){try{return JSON.parse(localStorage.getItem(TOKEN_KEY)||'null')}catch(e){return null}}function token(){const s=session();return s&&s.access_token}async function get(path){const r=await fetch(`${SUPA}/rest/v1/${path}`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,Accept:'application/json'}});const d=await r.json().catch(()=>[]);if(!r.ok)throw new Error(r.status+' '+JSON.stringify(d));return d}function card(a){const el=document.createElement('article');el.className='asset';el.innerHTML=`<img src="${a.public_url}" alt=""><div class="body"><b>${a.asset_id}</b><div><span class="tag">${a.status}</span><span class="tag">${a.room_id}</span></div><div class="meta">${a.storage_path}</div><button class="primary">设为 coffeeCorner 当前图</button></div>`;el.querySelector('button').onclick=()=>bind(a.asset_id);return el}async function load(){const slot=await get('room_asset_slots?select=room_id,slot,asset_id,status&room_id=eq.coffeeCorner&slot=eq.background.main');document.getElementById('slotNow').textContent=JSON.stringify(slot,null,2);const assets=await get('nest_assets?select=asset_id,room_id,status,storage_path,public_url&room_id=eq.coffeeCorner&order=created_at.desc');const box=document.getElementById('assets');box.innerHTML='';assets.forEach(a=>box.appendChild(card(a)));out('loaded.')}async function bind(assetId){try{const t=token();if(!t)throw new Error('未登录：先去管理员登录。');const fd=new FormData();fd.append('access_token',t);fd.append('asset_id',assetId);fd.append('room_id','coffeeCorner');fd.append('slot','background.main');out('binding '+assetId+' ...');const r=await fetch(BIND,{method:'POST',body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+' '+JSON.stringify(d));out({ok:true,data:d,next:'槽位已更新；刷新本页/后台可查看。主 /cloud 暂不读取这个动态绑定。'});await load();}catch(e){out('ERROR: '+e.message)}}load().catch(e=>out('ERROR: '+e.message));</script></body></html>
