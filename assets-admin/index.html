<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kitten Nest Assets Admin</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5 0%,#ffeef4 46%,#f7edf7 100%);color:#684054}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 16% 8%,rgba(255,212,225,.72),transparent 28%),radial-gradient(circle at 86% 16%,rgba(255,238,198,.68),transparent 24%),radial-gradient(circle at 50% 96%,rgba(222,210,255,.42),transparent 34%);z-index:-1}
  main{max-width:1120px;margin:0 auto;padding:24px 16px 46px}
  .hero{border-radius:30px;padding:18px 18px 16px;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 48px rgba(121,68,88,.14),inset 0 0 0 1px rgba(255,225,235,.55);backdrop-filter:blur(16px)}
  h1{margin:0 0 8px;font-size:29px;letter-spacing:.01em;color:#63364a}.sub{margin:0;color:#8b6474;line-height:1.55}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}.btn{border:0;text-decoration:none;border-radius:999px;padding:10px 14px;background:#fff;color:#704456;box-shadow:0 8px 20px rgba(121,68,88,.12),inset 0 0 0 1px rgba(121,68,88,.08);font-weight:750;font-size:13px}.btn.primary{background:#e9fff1;color:#236441}.btn.warn{background:#fff4d7;color:#7a5417}
  .status{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 18px}.pill{border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.86);box-shadow:0 8px 22px rgba(121,68,88,.11);font-size:13px;color:#704456}.good{background:#e9fff1;color:#236441}.bad{background:#ffe8ec;color:#8b1e34}.wait{background:#fff4d7;color:#7a5417}
  .section{margin-top:24px}.section h2{margin:0 0 10px;font-size:19px;color:#63364a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{border-radius:26px;background:rgba(255,255,255,.8);box-shadow:0 16px 38px rgba(121,68,88,.14);overflow:hidden;border:1px solid rgba(255,255,255,.9);color:#663849;backdrop-filter:blur(12px)}.thumb{width:100%;aspect-ratio:9/16;background:#fff0f4;object-fit:cover;display:block}.body{padding:14px}.title{font-weight:900;margin-bottom:7px;color:#633747}.meta{font-size:12px;line-height:1.5;margin:4px 0;color:#7b5260;word-break:break-all}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#fff2f7;margin:2px 4px 2px 0;font-size:11px;color:#704456}.slotList{display:grid;gap:10px}.slot{border-radius:20px;background:rgba(255,255,255,.78);color:#69394a;padding:13px 14px;box-shadow:0 10px 28px rgba(121,68,88,.12);border:1px solid rgba(255,255,255,.86)}.slot b{display:block;margin-bottom:4px}.log{margin-top:18px;padding:14px;border-radius:18px;background:rgba(255,255,255,.54);color:#8b6474;font-size:13px;line-height:1.55;white-space:pre-wrap;border:1px solid rgba(255,255,255,.72)}
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>Kitten Nest 素材库后台</h1>
    <p class="sub">正式只读入口：查看 Supabase 素材户口本、当前房间绑定和图片加载状态。这里不上传、不删除、不发布，不碰主 /cloud。</p>
    <div class="toolbar">
      <a class="btn primary" href="/cloud?v=assets-admin-back-cloud">打开 /cloud</a>
      <a class="btn warn" href="/local-reset/?v=assets-admin-remove-local">撤下本地图</a>
    </div>
  </section>
  <div class="status" id="status"><span class="pill wait">读取素材户口本中…</span></div>

  <section class="section">
    <h2>当前房间绑定</h2>
    <div class="slotList" id="slots"></div>
  </section>

  <section class="section">
    <h2>Published assets</h2>
    <div class="grid" id="assets"></div>
  </section>

  <div class="log" id="log">booting assets-admin…</div>
</main>
<script>
const SUPABASE_URL = 'https://pmkxzmogolxllijzqnfr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_a_E9X0r3m6i641s0KluUrg_squa6uc_';

function log(line){ document.getElementById('log').textContent += '\n' + line; }
function setStatus(items){ document.getElementById('status').innerHTML = items.map(i => `<span class="pill ${i.type}">${i.text}</span>`).join(''); }

async function supabaseGet(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
      Accept: 'application/json'
    }
  });
  if(!res.ok){
    const text = await res.text();
    throw new Error(`${res.status} ${res.statusText}: ${text}`);
  }
  return res.json();
}

function renderSlot(slot, asset){
  const div = document.createElement('div');
  div.className = 'slot';
  div.innerHTML = `
    <b>${slot.room_id} / ${slot.slot}</b>
    <div class="meta"><b>asset_id:</b> ${slot.asset_id}</div>
    <div class="meta"><b>storage_path:</b> ${asset?.storage_path || 'missing asset'}</div>
    <div class="meta"><b>status:</b> slot=${slot.status}; asset=${asset?.status || 'missing'}</div>`;
  return div;
}

function renderAsset(asset){
  const article = document.createElement('article');
  article.className = 'card';
  article.innerHTML = `
    <img class="thumb" alt="${asset.asset_id}" src="${asset.public_url}" />
    <div class="body">
      <div class="title">${asset.asset_id}</div>
      <span class="tag">${asset.room_id || 'no-room'}</span><span class="tag">${asset.asset_type}</span><span class="tag">${asset.status}</span>
      <div class="meta"><b>storage_path:</b> ${asset.storage_path}</div>
      <div class="meta"><b>bucket:</b> ${asset.bucket}</div>
      <div class="meta"><b>public_url:</b> ${asset.public_url}</div>
      <div class="meta" data-check>图片加载中…</div>
    </div>`;
  const img = article.querySelector('img');
  const check = article.querySelector('[data-check]');
  img.addEventListener('load', () => { check.textContent = `图片加载成功：${img.naturalWidth} × ${img.naturalHeight}`; });
  img.addEventListener('error', () => { check.textContent = '图片加载失败'; });
  return article;
}

async function main(){
  try{
    log('reading nest_assets…');
    const assets = await supabaseGet('nest_assets?select=asset_id,room_id,asset_type,bucket,storage_path,public_url,status,version,note&order=asset_id.asc');
    log(`nest_assets rows: ${assets.length}`);
    log('reading room_asset_slots…');
    const slots = await supabaseGet('room_asset_slots?select=room_id,slot,asset_id,status,note&order=room_id.asc&order=slot.asc');
    log(`room_asset_slots rows: ${slots.length}`);

    const assetMap = new Map(assets.map(a => [a.asset_id, a]));
    const slotsEl = document.getElementById('slots');
    slotsEl.innerHTML = '';
    slots.forEach(s => slotsEl.appendChild(renderSlot(s, assetMap.get(s.asset_id))));

    const assetsEl = document.getElementById('assets');
    assetsEl.innerHTML = '';
    assets.forEach(a => assetsEl.appendChild(renderAsset(a)));

    const missingAssets = slots.filter(s => !assetMap.has(s.asset_id));
    setStatus([
      { type: assets.length ? 'good' : 'bad', text: `${assets.length} 个 asset 记录` },
      { type: slots.length ? 'good' : 'bad', text: `${slots.length} 个房间槽位` },
      { type: missingAssets.length ? 'bad' : 'good', text: missingAssets.length ? `缺少资产：${missingAssets.map(s=>s.asset_id).join(', ')}` : '槽位资产全部可对应' },
      { type: 'good', text: '只读模式' }
    ]);
    log('assets-admin loaded.');
  }catch(err){
    console.error(err);
    setStatus([{type:'bad', text:'素材库读取失败'}]);
    log('ERROR: ' + err.message);
  }
}
main();
</script>
</body>
</html>
