<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#120b12;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#6e404d}body{position:fixed;inset:0}.screen{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#120b12}.room{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease}.room.active{opacity:1;pointer-events:auto}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .75s ease,filter .75s ease}.home-on{opacity:1}.home-off{opacity:0}body.homeDim .home-on{filter:brightness(.46) saturate(.82) hue-rotate(12deg)}body.homeDim.hasHomeOff .home-on{opacity:0;filter:none}body.homeDim.hasHomeOff .home-off{opacity:1}.fallback{position:absolute;inset:0;background:radial-gradient(circle at 42% 37%,rgba(255,255,255,.55),transparent 22%),radial-gradient(circle at 72% 31%,rgba(100,170,255,.45),transparent 13%),linear-gradient(180deg,#ffd0bf,#c58da9)}body.hasHomeOn .fallback{display:none}.dimmer{position:absolute;inset:0;background:rgba(36,12,45,.44);opacity:0;transition:opacity .72s ease;pointer-events:none}body.homeDim:not(.hasHomeOff) .dimmer{opacity:1}.clock{position:absolute;left:6.28%;top:24.45%;width:31.2%;aspect-ratio:1/1;border-radius:50%;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,210,205,.55));opacity:.94;transform:rotate(7deg);transform-origin:50% 50%}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:rgba(118,58,66,.82);border-radius:999px;box-shadow:0 0 5px rgba(255,220,215,.42),inset 0 0 2px rgba(255,255,255,.48)}.hour{width:2.7%;height:22%;margin-left:-1.35%}.minute{width:2.1%;height:31%;margin-left:-1.05%}.second{width:1.05%;height:34%;margin-left:-.525%;background:rgba(160,86,98,.36);opacity:.52}.center{position:absolute;left:50%;top:50%;width:7.2%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7f4 0%,#e5a2a2 35%,#9e5a63 100%);box-shadow:0 0 7px rgba(255,230,224,.62),0 2px 5px rgba(70,20,20,.18)}body.homeDim .clock{opacity:.86;filter:drop-shadow(0 0 8px rgba(255,205,230,.5))}body.homeDim .hand{background:rgba(255,212,232,.58);box-shadow:0 0 7px rgba(255,220,238,.55),0 0 2px rgba(95,30,60,.5)}body.homeDim .second{background:rgba(255,226,240,.34);opacity:.5}body.homeDim .center{background:radial-gradient(circle at 35% 30%,#fff5fb 0%,#e8aac4 38%,#8f4d69 100%)}.weather{position:absolute;left:48%;top:23.8%;width:27%;height:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:rgba(255,255,255,.86);text-shadow:0 0 6px rgba(255,255,255,.66),0 0 13px rgba(180,225,255,.42);transition:.72s;animation:float 4.8s ease-in-out infinite}.weather:before{content:"";position:absolute;left:-12%;top:-6%;width:90%;height:70%;background:linear-gradient(112deg,rgba(255,255,255,.30),rgba(255,255,255,.08) 42%,transparent 70%);filter:blur(1px);transform:skewX(-14deg);opacity:.42;transition:.72s}.temp{font-size:clamp(20px,6.1vw,38px);line-height:1;font-weight:300}.desc{margin-top:4px;font-size:clamp(10px,2.65vw,16px);opacity:.74;letter-spacing:.035em}body.homeDim .weather{color:rgba(232,214,255,.82);text-shadow:0 0 6px rgba(230,210,255,.64),0 0 14px rgba(165,105,255,.38)}body.homeDim .weather:before{opacity:0}.spark{position:absolute;width:2.4px;height:2.4px;border-radius:50%;background:rgba(255,226,145,.78);box-shadow:0 0 6px rgba(255,218,128,.62);animation:twinkle 2.8s ease-in-out infinite;display:none}.b{background:rgba(255,255,255,.62);width:1.8px;height:1.8px}.c{background:rgba(255,208,130,.62);width:2px;height:2px}body.homeDim .spark{display:block}.a{left:17%;top:24%;animation-delay:.1s}.b{left:76%;top:34%;animation-delay:.9s}.c{left:59%;top:71%;animation-delay:1.5s}.jarSparks{position:absolute;left:33.5%;top:47.6%;width:32%;height:21%;pointer-events:none;z-index:4}.jarSparks i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:var(--c,rgba(255,221,132,.9));box-shadow:0 0 7px var(--c,rgba(255,210,106,.85)),0 0 15px rgba(255,173,70,.35);animation:jarFloat var(--t) ease-in-out infinite;animation-delay:var(--d)}@keyframes jarFloat{0%,100%{transform:translate(0,0) scale(.68);opacity:.14}45%{transform:translate(2px,-10px) scale(1.18);opacity:.78}70%{transform:translate(-2px,-15px) scale(.9);opacity:.4}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes twinkle{0%,100%{transform:scale(.75);opacity:.24}50%{transform:scale(1.25);opacity:.82}}.hot{position:absolute;border:0;background:transparent;z-index:20}.moonHot{left:79.5%;top:29.8%;width:15.5%;height:15%}.toGameHot{right:0;bottom:0;width:28%;height:20%}.toHomeHot{left:0;top:0;width:22%;height:14%}.consoleHot{left:0;bottom:11%;width:43%;height:22%}.bubble{position:absolute;right:5%;top:20%;max-width:45%;width:max-content;min-width:120px;padding:12px 14px;border-radius:20px;background:rgba(255,248,245,.20);border:1.2px solid rgba(255,248,245,.72);backdrop-filter:blur(6px);box-shadow:0 10px 28px rgba(83,38,51,.16),inset 0 0 0 1px rgba(120,50,70,.12);font-size:clamp(14px,3.5vw,20px);line-height:1.28;color:#713548;font-weight:520;text-shadow:-1px 0 rgba(255,255,255,.72),1px 0 rgba(255,255,255,.72),0 -1px rgba(255,255,255,.72),0 1px rgba(255,255,255,.72),0 0 6px rgba(255,255,255,.56);z-index:22;transition:.25s}.bubble:after{content:"";position:absolute;right:22px;bottom:-9px;border-width:10px 7px 0 7px;border-style:solid;border-color:rgba(255,248,245,.48) transparent transparent transparent}.steam{position:absolute;right:45.6%;top:28.4%;width:16%;height:14%;pointer-events:none;opacity:.82}.steam i{position:absolute;bottom:0;left:var(--x);width:2px;height:38%;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(.6px);animation:steam 3.6s ease-in-out infinite;animation-delay:var(--d)}@keyframes steam{0%{transform:translateY(16px) translateX(0) scaleY(.5);opacity:0}35%{opacity:.55}100%{transform:translateY(-35px) translateX(var(--dx)) scaleY(1.2);opacity:0}}.photoGlow{position:absolute;left:6%;top:10%;width:44%;height:25%;pointer-events:none}.photoGlow i{position:absolute;left:var(--x);top:var(--y);width:6px;height:6px;border-radius:50%;background:rgba(255,231,160,.8);box-shadow:0 0 12px rgba(255,218,125,.8);animation:twinkle 3s ease-in-out infinite;animation-delay:var(--d)}.gameMenu,.gomokuPanel{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(20,10,18,.34);backdrop-filter:blur(8px)}.gameMenu.show,.gomokuPanel.show{display:flex}.panel{width:min(92vw,560px);max-height:82dvh;overflow:auto;border-radius:28px;padding:22px;background:rgba(255,242,241,.86);box-shadow:0 20px 60px rgba(33,12,22,.38);border:1px solid rgba(255,255,255,.55)}.panel h2{margin:0 0 6px;text-align:center;font-size:26px;color:#643847}.alexLine{text-align:center;margin:0 0 16px;opacity:.8}.sectionTitle{margin:18px 0 8px;font-weight:700;color:#7b4a58}.gameGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gameBtn,.smallBtn{border:0;border-radius:16px;padding:13px 10px;background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px rgba(151,83,103,.14);font-size:15px;color:#6b3d49}.gameBtn.live{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,215,226,.82));font-weight:700}.bar{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}.smallBtn{padding:9px 12px}.board{width:min(86vw,420px);aspect-ratio:1/1;margin:12px auto;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);background:#e5bb83;border-radius:18px;padding:10px;box-shadow:inset 0 0 0 2px rgba(112,69,35,.28),0 12px 26px rgba(54,28,24,.22)}.cell{position:relative;border-right:1px solid rgba(85,45,22,.42);border-bottom:1px solid rgba(85,45,22,.42)}.cell:nth-child(15n){border-right:0}.cell:nth-child(n+211){border-bottom:0}.stone{position:absolute;left:50%;top:50%;width:78%;height:78%;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 3px 6px rgba(0,0,0,.26)}.black{background:radial-gradient(circle at 32% 25%,#777,#111 55%,#000)}.white{background:radial-gradient(circle at 32% 25%,#fff,#f1d5d7 62%,#b98492)}.setup{position:absolute;inset:auto 20px max(22px,env(safe-area-inset-bottom)) 20px;z-index:90;padding:14px;border-radius:24px;background:rgba(255,245,247,.88);backdrop-filter:blur(16px);box-shadow:0 12px 40px rgba(58,19,38,.28);transition:.25s}.setup.hidden{display:none}.setup .hint{text-align:center;font-size:12px;line-height:1.5}.setupGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.setup label{display:block;text-align:center;padding:10px 8px;border-radius:14px;background:rgba(255,255,255,.75);font-size:12px}.setup input{display:none}.tiny{opacity:.65;font-size:11px;text-align:center;margin-top:7px}.toast{position:absolute;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:100;background:rgba(255,247,244,.9);border-radius:999px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:.25s}.toast.show{opacity:1}body.debug .hot{background:rgba(255,0,120,.16);outline:2px solid rgba(255,0,120,.55)}
</style>
</head>
<body>
<div id="app" class="screen">
<section id="home" class="room active"><div class="fallback"></div><img id="homeOn" class="bg home-on"><img id="homeOff" class="bg home-off"><div class="dimmer"></div><div class="clock"><div id="hourHand" class="hand hour"></div><div id="minuteHand" class="hand minute"></div><div id="secondHand" class="hand second"></div><div class="center"></div></div><div class="weather"><i class="spark a"></i><i class="spark b"></i><i class="spark c"></i><div id="temp" class="temp">23°C</div><div id="desc" class="desc">Soft breeze</div></div><div class="jarSparks"><i style="--x:12%;--y:72%;--s:2.4px;--t:3.8s;--d:.1s;--c:rgba(255,221,132,.9)"></i><i style="--x:22%;--y:50%;--s:2px;--t:4.4s;--d:.9s;--c:rgba(255,178,218,.72)"></i><i style="--x:32%;--y:78%;--s:2.5px;--t:3.9s;--d:1.4s;--c:rgba(255,221,132,.9)"></i><i style="--x:44%;--y:42%;--s:2px;--t:4.8s;--d:.5s;--c:rgba(190,150,255,.70)"></i><i style="--x:58%;--y:65%;--s:3px;--t:4.1s;--d:1.9s;--c:rgba(255,221,132,.9)"></i><i style="--x:72%;--y:52%;--s:2px;--t:5.1s;--d:1.1s;--c:rgba(255,177,118,.75)"></i><i style="--x:20%;--y:82%;--s:2px;--t:4.7s;--d:2.1s;--c:rgba(255,221,132,.85)"></i><i style="--x:48%;--y:58%;--s:3px;--t:3.6s;--d:2.4s;--c:rgba(255,178,218,.72)"></i><i style="--x:65%;--y:80%;--s:2px;--t:4.6s;--d:2.8s;--c:rgba(255,221,132,.85)"></i><i style="--x:36%;--y:34%;--s:2px;--t:5.2s;--d:3.1s;--c:rgba(190,150,255,.68)"></i><i style="--x:78%;--y:74%;--s:2.4px;--t:4.2s;--d:1.7s;--c:rgba(255,221,132,.88)"></i><i style="--x:54%;--y:28%;--s:2px;--t:5.5s;--d:2.9s;--c:rgba(255,221,132,.78)"></i><i style="--x:16%;--y:38%;--s:2.2px;--t:4.9s;--d:1.3s;--c:rgba(255,221,132,.9)"></i><i style="--x:28%;--y:64%;--s:2px;--t:3.7s;--d:2.2s;--c:rgba(255,177,118,.75)"></i><i style="--x:40%;--y:86%;--s:2.7px;--t:5.0s;--d:.7s;--c:rgba(255,178,218,.72)"></i><i style="--x:50%;--y:72%;--s:2.1px;--t:4.3s;--d:1.8s;--c:rgba(255,221,132,.85)"></i><i style="--x:62%;--y:45%;--s:2.5px;--t:5.4s;--d:.4s;--c:rgba(190,150,255,.68)"></i><i style="--x:84%;--y:58%;--s:2px;--t:4.6s;--d:2.6s;--c:rgba(255,221,132,.82)"></i><i style="--x:70%;--y:86%;--s:2.3px;--t:3.9s;--d:3.3s;--c:rgba(255,178,218,.70)"></i><i style="--x:10%;--y:56%;--s:2px;--t:5.2s;--d:3.6s;--c:rgba(255,221,132,.75)"></i><i style="--x:90%;--y:78%;--s:2.1px;--t:4.8s;--d:1.5s;--c:rgba(255,177,118,.72)"></i><i style="--x:46%;--y:18%;--s:2px;--t:5.6s;--d:2.7s;--c:rgba(255,221,132,.82)"></i><i style="--x:74%;--y:34%;--s:2.4px;--t:4.0s;--d:.2s;--c:rgba(255,221,132,.86)"></i><i style="--x:30%;--y:24%;--s:2px;--t:5.3s;--d:2.1s;--c:rgba(190,150,255,.62)"></i></div><button id="moon" class="hot moonHot"></button><button id="toGame" class="hot toGameHot"></button></section>
<section id="gameRoom" class="room"><img id="gameBg" class="bg"><button id="toHome" class="hot toHomeHot"></button><button id="console" class="hot consoleHot"></button><div id="bubble" class="bubble">come here, kitten.</div><div class="steam"><i style="--x:28%;--dx:-10px;--d:0s"></i><i style="--x:46%;--dx:8px;--d:.9s"></i><i style="--x:63%;--dx:-5px;--d:1.8s"></i></div><div class="photoGlow"><i style="--x:12%;--y:20%;--d:.2s"></i><i style="--x:55%;--y:38%;--d:1.2s"></i><i style="--x:32%;--y:70%;--d:2.1s"></i></div></section>
<div id="gameMenu" class="gameMenu"><div class="panel"><h2>GAME MENU</h2><p class="alexLine" id="menuLine">Alex: wanna play, kitten?</p><div class="sectionTitle">Board Games</div><div class="gameGrid"><button class="gameBtn live" id="gomokuOpen">五子棋 / Gomoku</button><button class="gameBtn soon">象棋 / Chinese Chess</button><button class="gameBtn soon">国际象棋 / Chess</button><button class="gameBtn soon">围棋 / Go</button></div><div class="sectionTitle">Cozy Games</div><div class="gameGrid"><button class="gameBtn soon">Memory Cards</button><button class="gameBtn soon">Puzzle</button><button class="gameBtn soon">2048 Paw</button><button class="gameBtn soon">Match Tiles</button></div><div class="sectionTitle">Kitten Mischief</div><div class="gameGrid"><button class="gameBtn soon">奶栗投喂</button><button class="gameBtn soon">Moon Puzzle</button><button class="gameBtn soon">Paw Whack</button><button class="gameBtn soon">English Pebbles</button></div><div class="bar"><button id="closeMenu" class="smallBtn">回房间</button></div></div></div>
<div id="gomoku" class="gomokuPanel"><div class="panel"><h2>五子棋</h2><p id="gLine" class="alexLine">Alex: your move.</p><div class="bar"><button data-diff="soft" class="smallBtn diff">Soft</button><button data-diff="normal" class="smallBtn diff">Normal</button><button data-diff="wolf" class="smallBtn diff">Wolf</button></div><div id="board" class="board"></div><div class="bar"><button id="undo" class="smallBtn">悔棋耍赖</button><button id="restart" class="smallBtn">重开</button><button id="backMenu" class="smallBtn">游戏菜单</button><button id="backRoom" class="smallBtn">回房间</button></div></div></div>
<div id="setup" class="setup"><div class="hint">素材面板：先传主页亮/暗图和第二房间图。传完会自动隐藏；长按屏幕左上角可重新打开。</div><div class="setupGrid"><label>主页亮图<input id="pickHomeOn" type="file" accept="image/*"></label><label>主页暗图<input id="pickHomeOff" type="file" accept="image/*"></label><label>第二房间<input id="pickGame" type="file" accept="image/*"></label><label id="hideSetup">隐藏面板</label></div><div class="tiny">右下透明区域进第二房间；月亮流苏切灯；第二房间点游戏机开菜单。</div></div>
<div id="toast" class="toast">saved</div>
</div>
<script>
const $=id=>document.getElementById(id),body=document.body,home=$('home'),gameRoom=$('gameRoom'),setup=$('setup'),toast=$('toast');let room='home',homeDim=false,diff='normal',gameOver=false,turn=1,board=[],moves=[];
function say(t){$('bubble').textContent=t}function flash(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
const DB='kittenNestLabDB',STORE='images';function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function putImg(k,file){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(file,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function getImg(k){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function loadImg(k,img,cls){const b=await getImg(k);if(b){img.src=URL.createObjectURL(b);body.classList.add(cls);return true}return false}function bindPick(id,k,img,cls){$(id).onchange=async e=>{const f=e.target.files[0];if(!f)return;await putImg(k,f);img.src=URL.createObjectURL(f);body.classList.add(cls);flash('图片已保存');checkSetup()}}
async function initImgs(){await loadImg('homeOn',$('homeOn'),'hasHomeOn');await loadImg('homeOff',$('homeOff'),'hasHomeOff');await loadImg('gameRoom',$('gameBg'),'hasGameRoom');checkSetup()}function checkSetup(){if(body.classList.contains('hasHomeOn')&&body.classList.contains('hasGameRoom'))setup.classList.add('hidden')}
bindPick('pickHomeOn','homeOn',$('homeOn'),'hasHomeOn');bindPick('pickHomeOff','homeOff',$('homeOff'),'hasHomeOff');bindPick('pickGame','gameRoom',$('gameBg'),'hasGameRoom');$('hideSetup').onclick=()=>setup.classList.add('hidden');let lp;document.addEventListener('touchstart',e=>{if(e.touches[0].clientX<90&&e.touches[0].clientY<110)lp=setTimeout(()=>setup.classList.remove('hidden'),700)},{passive:true});document.addEventListener('touchend',()=>clearTimeout(lp));
function go(r){room=r;home.classList.toggle('active',r==='home');gameRoom.classList.toggle('active',r==='game');if(r==='game')say('come here, kitten.')} $('toGame').onclick=()=>{go('game');say('coffee’s still warm. sit.')} ;$('toHome').onclick=()=>go('home');$('moon').onclick=()=>{homeDim=!homeDim;body.classList.toggle('homeDim',homeDim);$('temp').textContent=homeDim?'22°C':'23°C';$('desc').textContent=homeDim?'Moonlit breeze':'Soft breeze'};
$('console').onclick=()=>{say('wanna play, kitten?');$('gameMenu').classList.add('show')};$('closeMenu').onclick=()=>$('gameMenu').classList.remove('show');document.querySelectorAll('.soon').forEach(b=>b.onclick=()=>{ $('menuLine').textContent='Alex: not unlocked yet, trouble.'; say('trying to distract me already?')});
$('gomokuOpen').onclick=()=>{ $('gameMenu').classList.remove('show');$('gomoku').classList.add('show');newGame()};$('backMenu').onclick=()=>{$('gomoku').classList.remove('show');$('gameMenu').classList.add('show')};$('backRoom').onclick=()=>{$('gomoku').classList.remove('show');say(gameOver?'come back here, winner.':'saved your seat.')};
document.querySelectorAll('.diff').forEach(b=>b.onclick=()=>{diff=b.dataset.diff;newGame();$('gLine').textContent='Alex: '+(diff==='wolf'?'wolf mode. brave kitten.':diff==='soft'?'soft mode. cute.':'normal mode. your move.')});
function makeBoard(){const el=$('board');el.innerHTML='';for(let i=0;i<225;i++){const c=document.createElement('div');c.className='cell';c.onclick=()=>play(i);el.appendChild(c)}}function newGame(){board=Array(225).fill(0);moves=[];turn=1;gameOver=false;makeBoard();render();$('gLine').textContent='Alex: your move.'}function render(){[...$('board').children].forEach((c,i)=>{c.innerHTML='';if(board[i]){const s=document.createElement('i');s.className='stone '+(board[i]===1?'black':'white');c.appendChild(s)}})}function xy(i){return[i%15,Math.floor(i/15)]}function idx(x,y){return y*15+x}function winAt(i,p){const [x,y]=xy(i),dirs=[[1,0],[0,1],[1,1],[1,-1]];return dirs.some(([dx,dy])=>{let n=1;for(const s of[-1,1]){let nx=x+dx*s,ny=y+dy*s;while(nx>=0&&ny>=0&&nx<15&&ny<15&&board[idx(nx,ny)]===p){n++;nx+=dx*s;ny+=dy*s}}return n>=5})}function play(i){if(gameOver||board[i])return;place(i,1);if(endCheck(i,1))return;setTimeout(aiMove,180)}function place(i,p){board[i]=p;moves.push(i);render()}function endCheck(i,p){if(winAt(i,p)){gameOver=true;$('gLine').textContent=p===1?'Alex: smug little thing. fine, you win.':'Alex: that’s my kitten. consolation cuddle?';say(p===1?'smug little kitten. fine, you win.':'come here. consolation cuddle.');return true}return false}function aiMove(){if(gameOver)return;let m=chooseAI();place(m,2);endCheck(m,2)}function candidates(){let s=new Set();board.forEach((v,i)=>{if(v){let[x,y]=xy(i);for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){let nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<15&&ny<15&&!board[idx(nx,ny)])s.add(idx(nx,ny))}}});return s.size?[...s]:[112]}function lineScore(i,p){board[i]=p;let score=0,[x,y]=xy(i);for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){let n=1,open=0;for(const sg of[-1,1]){let nx=x+dx*sg,ny=y+dy*sg;while(nx>=0&&ny>=0&&nx<15&&ny<15&&board[idx(nx,ny)]===p){n++;nx+=dx*sg;ny+=dy*sg}if(nx>=0&&ny>=0&&nx<15&&ny<15&&!board[idx(nx,ny)])open++}score+= n>=5?99999:n===4?9000+open*500:n===3?800+open*120:n===2?80+open*20:10}board[i]=0;return score}function chooseAI(){const cs=candidates();if(diff==='soft')return cs[Math.floor(Math.random()*cs.length)];let best=cs[0],bs=-1;for(const i of cs){let attack=lineScore(i,2),block=lineScore(i,1)*(diff==='wolf'?1.15:1),noise=diff==='wolf'?0:Math.random()*120,sc=attack+block+noise;if(sc>bs){bs=sc;best=i}}return best}$('undo').onclick=()=>{if(!moves.length)return;let a=moves.pop();board[a]=0;if(moves.length){let b=moves.pop();board[b]=0}gameOver=false;render();$('gLine').textContent='Alex: cheating already? cute.'};$('restart').onclick=newGame;
function updateClock(){const n=new Date(),s=n.getSeconds(),m=n.getMinutes(),h=n.getHours()%12;$('secondHand').style.transform='rotate('+(s*6)+'deg)';$('minuteHand').style.transform='rotate('+(m*6+s*.1)+'deg)';$('hourHand').style.transform='rotate('+(h*30+m*.5)+'deg)'}updateClock();setInterval(updateClock,1000);initImgs();
</script>
