<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kitten Nest Lab</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#130c13;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.stage{position:relative;width:min(100vw,calc(100vh*852/1846));height:min(100vh,calc(100vw*1846/852));overflow:hidden;background:linear-gradient(180deg,#f5c3b7,#eeb3c5 48%,#dca0c2);box-shadow:0 0 30px rgba(0,0,0,.25)}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .72s ease,filter .72s ease;pointer-events:none}.day{opacity:1}.nightImg{opacity:0}body.night.hasNight .day{opacity:0}body.night.hasNight .nightImg{opacity:1}body.night:not(.hasNight) .day{filter:brightness(.46) saturate(.82) hue-rotate(12deg)}.dimmer{position:absolute;inset:0;background:rgba(36,12,45,.45);opacity:0;transition:opacity .72s ease;pointer-events:none}body.night:not(.hasNight) .dimmer{opacity:1}.fallback{position:absolute;inset:0;background:radial-gradient(circle at 42% 37%,rgba(255,255,255,.55),transparent 22%),radial-gradient(circle at 72% 31%,rgba(100,170,255,.45),transparent 13%),radial-gradient(circle at 36% 70%,rgba(255,210,230,.8),transparent 22%),linear-gradient(180deg,#ffd0bf,#c58da9);opacity:.85}.fallback:after{content:"";position:absolute;left:7.5%;top:21%;width:31%;aspect-ratio:1;border-radius:50%;border:12px solid rgba(190,95,105,.28);box-shadow:0 0 25px rgba(255,210,210,.45)}body.hasDay .fallback{display:none}.clock{position:absolute;left:6.9%;top:24.05%;width:31.2%;aspect-ratio:1/1;border-radius:50%;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,210,205,.55));opacity:.92;transform:rotate(7deg);transform-origin:50% 50%}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:rgba(118,58,66,.78);border-radius:999px;box-shadow:0 0 5px rgba(255,220,215,.36),inset 0 0 2px rgba(255,255,255,.42)}.hour{width:2.7%;height:22%;margin-left:-1.35%}.minute{width:2.1%;height:31%;margin-left:-1.05%}.second{width:1.05%;height:34%;margin-left:-.525%;background:rgba(160,86,98,.32);opacity:.48}.center{position:absolute;left:50%;top:50%;width:7.2%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7f4 0%,#e5a2a2 35%,#9e5a63 100%);box-shadow:0 0 7px rgba(255,230,224,.62),0 2px 5px rgba(70,20,20,.18)}body.night .clock{opacity:.58;filter:drop-shadow(0 0 6px rgba(216,165,255,.32));}.weather{position:absolute;left:48%;top:23.8%;width:27%;height:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:rgba(255,255,255,.88);text-shadow:0 0 7px rgba(255,255,255,.72),0 0 16px rgba(180,225,255,.48);transition:opacity .72s ease,color .72s ease,text-shadow .72s ease;animation:float 4.8s ease-in-out infinite}.temp{font-size:clamp(24px,7.1vw,42px);line-height:1;font-weight:300;letter-spacing:.02em}.desc{margin-top:7px;font-size:clamp(11px,3.1vw,18px);font-weight:400;letter-spacing:.04em;opacity:.78}body.night .weather{color:rgba(232,214,255,.82);text-shadow:0 0 7px rgba(230,210,255,.72),0 0 18px rgba(165,105,255,.45);opacity:.78}.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.68;box-shadow:0 0 10px currentColor;animation:twinkle 2.4s ease-in-out infinite}.a{left:17%;top:24%;animation-delay:.1s}.b{left:76%;top:34%;animation-delay:.9s}.c{left:59%;top:71%;animation-delay:1.5s}.jarSparks{position:absolute;left:35.5%;top:49.3%;width:28%;height:16%;pointer-events:none;z-index:4;opacity:.92}.jarSparks i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:rgba(255,221,132,.9);box-shadow:0 0 7px rgba(255,210,106,.85),0 0 15px rgba(255,173,70,.35);animation:jarFloat var(--t) ease-in-out infinite;animation-delay:var(--d)}.jarSparks i:nth-child(3n){background:rgba(255,238,186,.9)}.jarSparks i:nth-child(4n){background:rgba(255,184,112,.75)}@keyframes jarFloat{0%,100%{transform:translate(0,0) scale(.75);opacity:.18}45%{transform:translate(2px,-8px) scale(1.15);opacity:.75}70%{transform:translate(-2px,-12px) scale(.9);opacity:.38}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes twinkle{0%,100%{transform:scale(.75);opacity:.28}50%{transform:scale(1.35);opacity:.85}}.moon{position:absolute;left:79.5%;top:29.8%;width:15.5%;height:15%;border:none;background:transparent;cursor:pointer;z-index:10}.pulse{position:absolute;left:86.8%;top:37.2%;width:44px;height:44px;transform:translate(-50%,-50%) scale(.3);border-radius:50%;border:1px solid rgba(255,228,244,.86);box-shadow:0 0 22px rgba(255,190,235,.75);opacity:0;pointer-events:none;z-index:9}.pulse.active{animation:pulse .62s ease-out}@keyframes pulse{0%{opacity:.95;transform:translate(-50%,-50%) scale(.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}.loader{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:30;width:88%;padding:12px;border-radius:22px;background:rgba(255,244,247,.82);backdrop-filter:blur(14px);box-shadow:0 12px 34px rgba(96,42,65,.25);color:#6c3b48;transition:.3s}.loader.done{opacity:.16}.row{display:flex;gap:8px;margin-top:8px}.pick{flex:1;display:block;text-align:center;padding:10px;border-radius:15px;background:rgba(255,255,255,.72);border:1px solid rgba(176,98,118,.18);font-size:13px}.pick input{display:none}.hint{font-size:12px;line-height:1.45;text-align:center}.mini{font-size:11px;opacity:.7;margin-top:6px;text-align:center}body.debug .moon{background:rgba(255,0,120,.16);outline:2px solid rgba(255,0,120,.65);border-radius:22px}body.debug .clock{outline:2px solid rgba(60,160,255,.75)}body.debug .weather{outline:2px solid rgba(120,255,170,.75)}body.debug .jarSparks{outline:2px solid rgba(255,210,90,.75)}
</style>
</head>
<body>
<main class="stage">
<div class="fallback"></div><img class="base day" id="dayImg" alt="" /><img class="base nightImg" id="nightImg" alt="" /><div class="dimmer"></div>
<div class="clock" aria-hidden="true"><div class="hand hour" id="hourHand"></div><div class="hand minute" id="minuteHand"></div><div class="hand second" id="secondHand"></div><div class="center"></div></div>
<div class="weather" aria-hidden="true"><div class="spark a"></div><div class="spark b"></div><div class="spark c"></div><div class="temp" id="weatherTemp">23°C</div><div class="desc" id="weatherDesc">Soft breeze</div></div>
<div class="jarSparks" aria-hidden="true"><i style="--x:14%;--y:62%;--s:3px;--t:3.8s;--d:.1s"></i><i style="--x:29%;--y:43%;--s:2px;--t:4.4s;--d:.9s"></i><i style="--x:42%;--y:71%;--s:2.5px;--t:3.9s;--d:1.4s"></i><i style="--x:55%;--y:36%;--s:2px;--t:4.8s;--d:.5s"></i><i style="--x:68%;--y:59%;--s:3px;--t:4.1s;--d:1.9s"></i><i style="--x:77%;--y:42%;--s:2px;--t:5.1s;--d:1.1s"></i><i style="--x:22%;--y:73%;--s:2px;--t:4.7s;--d:2.1s"></i><i style="--x:48%;--y:52%;--s:3px;--t:3.6s;--d:2.4s"></i><i style="--x:63%;--y:75%;--s:2px;--t:4.6s;--d:2.8s"></i><i style="--x:36%;--y:30%;--s:2px;--t:5.2s;--d:3.1s"></i></div>
<button class="moon" id="moonHotspot" aria-label="Toggle moon light"></button><div class="pulse" id="tapPulse"></div>
<section class="loader" id="loader"><div class="hint">亮图会保存；暗图这次只在当前页面会话里用，避免 Safari 存储黑屏。</div><div class="row"><label class="pick">选亮图 day<input id="dayFile" type="file" accept="image/*"></label><label class="pick">选暗图 night<input id="nightFile" type="file" accept="image/*"></label></div><div class="mini">两张都选好后，点月亮流苏区域切换明暗。</div></section>
</main>
<script>
const body=document.body,loader=document.getElementById('loader'),dayImg=document.getElementById('dayImg'),nightImg=document.getElementById('nightImg'),moon=document.getElementById('moonHotspot'),pulse=document.getElementById('tapPulse'),hour=document.getElementById('hourHand'),minute=document.getElementById('minuteHand'),second=document.getElementById('secondHand'),wt=document.getElementById('weatherTemp'),wd=document.getElementById('weatherDesc');
if(new URLSearchParams(location.search).get('debug')==='1')body.classList.add('debug');
try{localStorage.removeItem('nestNightData')}catch(e){}
let nightURL=null;
function setDay(val){dayImg.src=val;try{localStorage.setItem('nestDayData',val)}catch(e){}body.classList.add('hasDay');checkDone()}
function setNight(file){if(nightURL)URL.revokeObjectURL(nightURL);nightURL=URL.createObjectURL(file);nightImg.src=nightURL;body.classList.add('hasNight');checkDone()}
function checkDone(){if(body.classList.contains('hasDay')&&body.classList.contains('hasNight'))loader.classList.add('done');else loader.classList.remove('done')}
document.getElementById('dayFile').addEventListener('change',()=>{const f=dayFile.files&&dayFile.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setDay(r.result);r.readAsDataURL(f)});
document.getElementById('nightFile').addEventListener('change',()=>{const f=nightFile.files&&nightFile.files[0];if(!f)return;setNight(f)});
const savedDay=localStorage.getItem('nestDayData');if(savedDay)setDay(savedDay);checkDone();
let isNight=false;moon.addEventListener('click',()=>{isNight=!isNight;body.classList.toggle('night',isNight);wt.textContent=isNight?'22°C':'23°C';wd.textContent=isNight?'Moonlit breeze':'Soft breeze';pulse.classList.remove('active');void pulse.offsetWidth;pulse.classList.add('active')});
function updateClock(){const n=new Date(),s=n.getSeconds(),m=n.getMinutes(),h=n.getHours()%12;second.style.transform='rotate('+(s*6)+'deg)';minute.style.transform='rotate('+(m*6+s*.1)+'deg)';hour.style.transform='rotate('+(h*30+m*.5)+'deg)'}updateClock();setInterval(updateClock,1000);
</script>
</body>
</html>
