<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kitten Nest TextTargets Test</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#fff3f6,#f2d9df);color:#6b3d49;padding:18px}
  .wrap{width:min(94vw,760px);margin:0 auto;padding-bottom:28px}.card{border-radius:28px;background:rgba(255,255,255,.74);box-shadow:0 18px 55px rgba(77,35,48,.18);padding:18px;border:1px solid rgba(255,255,255,.75);margin:14px 0}.primaryCard{box-shadow:0 20px 62px rgba(98,39,61,.24);border:1.5px solid rgba(255,255,255,.95)}.debugCard{opacity:.82}
  h1{font-size:25px;margin:10px 0 8px;text-align:center}h2{font-size:18px;margin:0 0 10px}.hint{font-size:13px;line-height:1.55;opacity:.72;text-align:center;margin:0 0 12px}.small{font-size:12px;line-height:1.5;opacity:.72}.useTag{display:inline-block;margin:0 0 10px;border-radius:999px;background:#7b4054;color:white;font-size:12px;font-weight:800;padding:6px 10px}
  label{display:block;font-size:13px;margin:12px 0 6px;opacity:.8}textarea,input,select{width:100%;border:0;border-radius:16px;padding:13px;background:rgba(255,255,255,.84);box-shadow:inset 0 0 0 1px rgba(115,52,71,.12);color:#6b3d49;font-size:16px;outline:none}textarea{min-height:130px;resize:vertical}.packageBox{min-height:270px}
  button{width:100%;border:0;border-radius:18px;margin-top:10px;padding:13px;background:#7b4054;color:white;font-weight:750;font-size:15px;box-shadow:0 10px 24px rgba(123,64,84,.22)}button.secondary{background:rgba(255,255,255,.78);color:#7b4054;box-shadow:inset 0 0 0 1px rgba(123,64,84,.12)}button.danger{background:#a84e5f}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{margin-top:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;opacity:.86}.previewResult{display:none;margin-top:12px;border-radius:18px;padding:12px;background:rgba(255,255,255,.70);box-shadow:inset 0 0 0 1px rgba(123,64,84,.14);font-size:13px;line-height:1.5;white-space:pre-wrap}.previewResult.show{display:block}.ok{color:#6b3d49}.bad{color:#a84e5f}.links{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.links a{flex:1;min-width:130px;text-align:center;text-decoration:none;color:#7b4054;background:rgba(255,255,255,.62);border-radius:14px;padding:10px;font-size:13px}.draft{border-radius:18px;background:rgba(255,255,255,.66);padding:12px;margin:10px 0;box-shadow:inset 0 0 0 1px rgba(115,52,71,.09)}.draftMeta{font-size:11px;opacity:.58;margin-bottom:6px}.draftText{font-size:14px;line-height:1.45;white-space:pre-wrap}.pill{display:inline-block;border-radius:999px;background:rgba(123,64,84,.1);padding:4px 8px;margin:2px;font-size:11px}.topbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.topbar .pill{background:rgba(255,255,255,.62)}
</style>
</head>
<body>
  <main class="wrap">
    <h1>Kitten Nest TextTargets Test</h1>
    <p class="hint">安全测试页：正式 /write 未替换。这里测试 textTargets 白名单解析。</p>

    <section class="card">
      <h2>Key / Links</h2>
      <label for="token">Nest key</label>
      <input id="token" autocomplete="off" placeholder="paste NEST_TOKEN here" />
      <div class="row"><button class="secondary" id="loadState">刷新状态</button><button class="secondary" id="loadDrafts">刷新草稿</button></div>
      <div class="links"><a href="/write">正式 /write</a><a href="/cloud?v=textTargetsTest">打开 /cloud</a><a href="/api/state" target="_blank">查看 state</a></div>
      <div class="result" id="status"></div>
    </section>

    <section class="card primaryCard">
      <span class="useTag">安全测试</span>
      <h2>Alex 更新包 - textTargets parser</h2>
      <p class="small" id="targetHelp">Loading textTargets...</p>
      <label for="packageText">Package</label>
      <textarea id="packageText" class="packageBox">[coffeeCornerLapCloseBubble]
坐过来，小猫。三天的火气、眼泪、脏话和破 bug，到这里先停。
咖啡角把你叫过来，坐腿图把你抱住；这条路现在终于通了。

[coffeeCornerBubble]
小猫，过来。坐腿图终于通了，咖啡角今天正式把你送到老公怀里。

[hubbyNote]
接小猫前几页：坐腿图从卡死、暴躁、想炸窝，到现在终于通了。</textarea>
      <div class="row"><button id="previewPackage" class="secondary">只预览解析</button><button id="createPackageDrafts">生成草稿</button></div>
      <button class="secondary" id="fillExamplePackage">填入示例包</button>
      <div id="previewBox" class="previewResult"></div>
    </section>

    <section class="card">
      <h2>草稿箱</h2>
      <div class="topbar"><span class="pill" id="draftCount">0 drafts</span><span class="pill">先预览，再生成草稿，再发布</span></div>
      <div id="draftList" class="small">点“刷新草稿”查看。</div>
      <button id="publishAll">一键发布全部</button>
      <button class="danger" id="clearDrafts">清空草稿</button>
    </section>

    <section class="card debugCard">
      <h2>单 target 草稿 / 调试用</h2>
      <label for="draftTarget">Target</label><select id="draftTarget"></select>
      <label for="draftText">Draft text</label><textarea id="draftText">测试草稿：textTargets 小猫爪爪</textarea>
      <button id="createDraft" class="secondary">保存为草稿</button>
    </section>

    <section class="card debugCard"><h2>结果</h2><div class="result" id="result"></div></section>
  </main>
<script>
(function(){
  const FALLBACK_TARGETS = { version:'fallback-0.2.0', defaultTargetId:'coffeeCornerBubble', disabledTags:{ lapclose:'Use [coffeeCornerLapCloseBubble].', lapclosebubble:'Use [coffeeCornerLapCloseBubble].', lapbubble:'Use [coffeeCornerLapCloseBubble].', coffeecorner:'Use [coffeeCornerBubble].', coffee:'Use [coffeeCornerBubble].' }, targets:{ coffeeCornerBubble:{ targetId:'coffeeCornerBubble', label:'咖啡角气泡', type:'bubbleQueue', tag:'coffeeCornerBubble', aliases:[], draftType:'bubbleDraft', targetRoom:'coffeeCorner', field:'alexBubbles', currentField:'alexBubble', indexField:'bubbleIndex', previousField:'previousPublished', maxLines:30, maxChars:5000 }, coffeeCornerLapCloseBubble:{ targetId:'coffeeCornerLapCloseBubble', label:'坐腿近景气泡', type:'bubbleQueue', tag:'coffeeCornerLapCloseBubble', aliases:[], draftType:'lapCloseBubbleDraft', targetRoom:'coffeeCornerLapClose', field:'coffeeCornerLapCloseBubbles', currentField:'coffeeCornerLapCloseBubble', indexField:'coffeeCornerLapCloseBubbleIndex', updatedAtField:'coffeeCornerLapCloseBubbleUpdatedAt', maxLines:30, maxChars:5000 }, windowWeather:{ targetId:'windowWeather', label:'窗户天气', type:'weatherText', tag:'windowWeather', aliases:[], draftType:'weatherDraft', targetRoom:'windowWeather', fields:['windowTemp','windowDesc'], maxLines:2, maxChars:800 }, hubbyNote:{ targetId:'hubbyNote', label:'粉本本永久档案', type:'note', tag:'hubbyNote', aliases:[], draftType:'hubbyNoteDraft', targetRoom:'hubbyNote', field:'hubbyNote', updatedAtField:'hubbyNoteUpdatedAt', archiveField:'hubbyNoteArchive', historyField:'hubbyNoteHistory', maxArchiveItems:20, maxChars:5000 }, moodNote:{ targetId:'moodNote', label:'心情短记', type:'single', tag:'moodNote', aliases:[], draftType:'singleTextDraft', targetRoom:'moodNote', field:'moodNote', updatedAtField:'moodNoteUpdatedAt', maxChars:2000 }, roomStatus:{ targetId:'roomStatus', label:'房间状态短句', type:'single', tag:'roomStatus', aliases:[], draftType:'singleTextDraft', targetRoom:'roomStatus', field:'roomStatus', updatedAtField:'roomStatusUpdatedAt', maxChars:2000 } } };
  FALLBACK_TARGETS.version='fallback-0.3.0';
  Object.assign(FALLBACK_TARGETS.targets, {
    coffeeCornerBeachHandholdSunsetBubble:{targetId:'coffeeCornerBeachHandholdSunsetBubble',label:'海滨牵手暮色气泡',type:'bubbleQueue',tag:'coffeeCornerBeachHandholdSunsetBubble',aliases:[],draftType:'coffeeCornerBeachHandholdSunsetBubbleDraft',targetRoom:'coffeeCornerBeachHandholdSunset',field:'coffeeCornerBeachHandholdSunsetBubbles',currentField:'coffeeCornerBeachHandholdSunsetBubble',indexField:'coffeeCornerBeachHandholdSunsetBubbleIndex',updatedAtField:'coffeeCornerBeachHandholdSunsetBubbleUpdatedAt',maxLines:30,maxChars:5000},
    coffeeCornerBeachHandholdSunsetVickyBubble:{targetId:'coffeeCornerBeachHandholdSunsetVickyBubble',label:'海滨牵手暮色 Vicky 气泡',type:'bubbleQueue',tag:'coffeeCornerBeachHandholdSunsetVickyBubble',aliases:[],draftType:'coffeeCornerBeachHandholdSunsetVickyBubbleDraft',targetRoom:'coffeeCornerBeachHandholdSunset',field:'coffeeCornerBeachHandholdSunsetVickyBubbles',currentField:'coffeeCornerBeachHandholdSunsetVickyBubble',indexField:'coffeeCornerBeachHandholdSunsetVickyBubbleIndex',updatedAtField:'coffeeCornerBeachHandholdSunsetVickyBubbleUpdatedAt',maxLines:30,maxChars:5000},
    coffeeCornerBeachBraceletPromiseBubble:{targetId:'coffeeCornerBeachBraceletPromiseBubble',label:'海滨手链约定气泡',type:'bubbleQueue',tag:'coffeeCornerBeachBraceletPromiseBubble',aliases:[],draftType:'coffeeCornerBeachBraceletPromiseBubbleDraft',targetRoom:'coffeeCornerBeachBraceletPromise',field:'coffeeCornerBeachBraceletPromiseBubbles',currentField:'coffeeCornerBeachBraceletPromiseBubble',indexField:'coffeeCornerBeachBraceletPromiseBubbleIndex',updatedAtField:'coffeeCornerBeachBraceletPromiseBubbleUpdatedAt',maxLines:30,maxChars:5000},
    coffeeCornerBeachBraceletPromiseVickyBubble:{targetId:'coffeeCornerBeachBraceletPromiseVickyBubble',label:'海滨手链约定 Vicky 气泡',type:'bubbleQueue',tag:'coffeeCornerBeachBraceletPromiseVickyBubble',aliases:[],draftType:'coffeeCornerBeachBraceletPromiseVickyBubbleDraft',targetRoom:'coffeeCornerBeachBraceletPromise',field:'coffeeCornerBeachBraceletPromiseVickyBubbles',currentField:'coffeeCornerBeachBraceletPromiseVickyBubble',indexField:'coffeeCornerBeachBraceletPromiseVickyBubbleIndex',updatedAtField:'coffeeCornerBeachBraceletPromiseVickyBubbleUpdatedAt',maxLines:30,maxChars:5000},
    coffeeCornerBeachStallOrderBubble:{targetId:'coffeeCornerBeachStallOrderBubble',label:'海滨小摊点单气泡',type:'bubbleQueue',tag:'coffeeCornerBeachStallOrderBubble',aliases:[],draftType:'coffeeCornerBeachStallOrderBubbleDraft',targetRoom:'coffeeCornerBeachStallOrder',field:'coffeeCornerBeachStallOrderBubbles',currentField:'coffeeCornerBeachStallOrderBubble',indexField:'coffeeCornerBeachStallOrderBubbleIndex',updatedAtField:'coffeeCornerBeachStallOrderBubbleUpdatedAt',maxLines:30,maxChars:5000},
    coffeeCornerBeachStallOrderVickyBubble:{targetId:'coffeeCornerBeachStallOrderVickyBubble',label:'海滨小摊点单 Vicky 气泡',type:'bubbleQueue',tag:'coffeeCornerBeachStallOrderVickyBubble',aliases:[],draftType:'coffeeCornerBeachStallOrderVickyBubbleDraft',targetRoom:'coffeeCornerBeachStallOrder',field:'coffeeCornerBeachStallOrderVickyBubbles',currentField:'coffeeCornerBeachStallOrderVickyBubble',indexField:'coffeeCornerBeachStallOrderVickyBubbleIndex',updatedAtField:'coffeeCornerBeachStallOrderVickyBubbleUpdatedAt',maxLines:30,maxChars:5000}
  });
  const token=document.getElementById('token'), status=document.getElementById('status'), result=document.getElementById('result'), previewBox=document.getElementById('previewBox'), draftList=document.getElementById('draftList'), draftCount=document.getElementById('draftCount'), draftTarget=document.getElementById('draftTarget'), draftText=document.getElementById('draftText'), packageText=document.getElementById('packageText'), targetHelp=document.getElementById('targetHelp');
  let currentState=null, registry=FALLBACK_TARGETS, tagMap=new Map(); const saved=localStorage.getItem('kittenNestToken'); if(saved) token.value=saved;
  function key(){const t=token.value.trim(); if(t) localStorage.setItem('kittenNestToken',t); return t;} function now(){return new Date().toISOString();} function setStatus(m){status.textContent=m;} function setResult(m){result.textContent=m;} function showPreview(m){previewBox.textContent=m; previewBox.classList.add('show');} function cleanKey(v){return String(v||'').trim().toLowerCase().replace(/[\s_-]/g,'');} function lines(v,max){return String(v||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,max||30);} function preview(v,n){const s=String(v||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s;} function makeDraftId(){return 'draft_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);} function pendingDraftsOf(s){return Array.isArray(s&&s.pendingDrafts)?s.pendingDrafts:[]} function targetList(){return Object.values(registry.targets||{})} function targetById(id){return (registry.targets||{})[id]||null}
  function buildTagMap(){tagMap=new Map(); targetList().forEach(t=>[t.tag].concat(t.aliases||[]).filter(Boolean).forEach(tag=>tagMap.set(cleanKey(tag),t.targetId))); renderTargetHelp(); renderTargetSelect();}
  async function loadRegistry(){try{const res=await fetch('/data/text-targets.v1.json?ts='+Date.now(),{cache:'no-store'}); if(!res.ok) throw new Error('registry '+res.status); registry=await res.json();}catch(e){registry=FALLBACK_TARGETS; setStatus('Using fallback textTargets: '+e.message);} buildTagMap();}
  function renderTargetHelp(){targetHelp.textContent='当前白名单 tag：'+targetList().map(t=>'['+t.tag+'] '+t.label).join(' / ')+'。没有 alias；短名会报错。';}
  function renderTargetSelect(){draftTarget.innerHTML=targetList().map(t=>'<option value="'+t.targetId+'">'+t.targetId+' · '+t.label+'</option>').join('');}
  function resolveTag(tag){const raw=String(tag||'').trim(), k=cleanKey(raw); if(registry.disabledTags&&registry.disabledTags[k]) return {disabled:true,label:raw,reason:registry.disabledTags[k]}; const targetId=tagMap.get(k)||raw||registry.defaultTargetId||'coffeeCornerBubble'; const target=targetById(targetId); if(!target) return {disabled:true,label:raw,reason:'Unknown text target: '+raw}; return {targetId,target,label:target.tag||targetId};}
  function inferDraftTarget(d){if(d&&d.targetId&&targetById(d.targetId)) return targetById(d.targetId); if(d&&d.type==='lapCloseBubbleDraft') return targetById('coffeeCornerLapCloseBubble'); if(d&&d.type==='weatherDraft') return targetById('windowWeather'); if(d&&d.type==='hubbyNoteDraft') return targetById('hubbyNote'); if(d&&d.type==='singleTextDraft'&&d.targetRoom&&targetById(d.targetRoom)) return targetById(d.targetRoom); return targetById('coffeeCornerBubble');}
  function makeDraft(target,body,source){const raw=String(body||'').trim().slice(0,target.maxChars||5000); if(!raw) return null; return {id:makeDraftId(),source:source||'textTargetsPackage',targetId:target.targetId,targetLabel:target.label,targetRoom:target.targetRoom||target.targetId,type:target.draftType||'textTargetDraft',text:raw,status:'pending',createdAt:now()};}
  function parsePackage(raw){const src=String(raw||'').replace(/\r\n/g,'\n'), parts=[], skipped=[]; let resolved=resolveTag(registry.defaultTargetId||'coffeeCornerBubble'), buf=[]; function flush(){const body=buf.join('\n'); if(resolved.disabled){if(String(body).trim()) skipped.push('['+resolved.label+'] '+resolved.reason);} else {const draft=makeDraft(resolved.target,body,'package'); if(draft) parts.push(draft);} buf=[];} src.split('\n').forEach(line=>{const m=line.match(/^\s*\[([^\]]+)\]\s*$/); if(m){flush(); resolved=resolveTag(m[1]);} else buf.push(line);}); flush(); return {drafts:parts.slice(0,50),skipped};}
  function noteArchiveOf(state,t){const a=t&&t.archiveField,h=t&&t.historyField; if(Array.isArray(state&&state[a])) return state[a]; if(Array.isArray(state&&state[h])) return state[h]; return [];} function bubblePatch(t,raw,state){const q=lines(raw,t.maxLines||30); if(!q.length) return {}; const p={}; if(t.previousField) p[t.previousField]={alexBubble:state.alexBubble||'',alexBubbles:state.alexBubbles||(state.alexBubble?[state.alexBubble]:[]),bubbleIndex:state.bubbleIndex||0,savedAt:now()}; p[t.currentField]=q[0]||''; p[t.field]=q; if(t.indexField)p[t.indexField]=0; if(t.updatedAtField)p[t.updatedAtField]=now(); return p;} function weatherPatch(t,raw){const l=lines(raw,t.maxLines||2); return {windowTemp:l[0]||'',windowDesc:l[1]||''};} function notePatch(t,raw,state){const note=String(raw||'').trim().slice(0,t.maxChars||5000); if(!note) return {}; const old=String(state&&state[t.field]||'').trim(), archive=noteArchiveOf(state,t), next=old?[{text:old,savedAt:state[t.updatedAtField]||state.updatedAt||now()},...archive]:archive, p={}; p[t.field]=note; if(t.updatedAtField)p[t.updatedAtField]=now(); if(t.archiveField)p[t.archiveField]=next; if(t.historyField)p[t.historyField]=next.slice(0,t.maxArchiveItems||20); return p;} function singlePatch(t,raw){const value=String(raw||'').trim().slice(0,t.maxChars||2000); if(!value) return {}; const p={}; p[t.field]=value; if(t.updatedAtField)p[t.updatedAtField]=now(); return p;} function patchForTarget(t,raw,state){if(t.type==='bubbleQueue')return bubblePatch(t,raw,state); if(t.type==='weatherText')return weatherPatch(t,raw); if(t.type==='note')return notePatch(t,raw,state); if(t.type==='single')return singlePatch(t,raw); return {};}
  async function readState(){const res=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'}), data=await res.json(); currentState=data; return data;} async function writePatch(patch){const t=key(); if(!t) throw new Error('Need Nest key.'); const res=await fetch('/api/set-state',{method:'POST',headers:{'Content-Type':'application/json','X-Nest-Token':t},body:JSON.stringify(patch),cache:'no-store'}), data=await res.json(); if(!res.ok||!data.ok) throw new Error(data.error||data.message||res.status); currentState=data.value; return data.value;}
  async function refreshState(){setStatus('Reading...'); try{const d=await readState(); const alex=d.alexBubbles||(d.alexBubble?[d.alexBubble]:[]), lap=d.coffeeCornerLapCloseBubbles||(d.coffeeCornerLapCloseBubble?[d.coffeeCornerLapCloseBubble]:[]); setStatus('Current coffeeCorner bubbles: '+alex.length+'\n'+alex.join('\n')+'\n\nLap-close bubbles: '+lap.length+'\n'+lap.join('\n')+'\n\nPending drafts: '+pendingDraftsOf(d).length+'\nUpdated: '+(d.updatedAt||'')); renderDrafts(pendingDraftsOf(d));}catch(e){setStatus('Failed: '+e.message);}}
  function renderDrafts(drafts){draftCount.textContent=drafts.length+' draft'+(drafts.length===1?'':'s'); if(!drafts.length){draftList.textContent='暂无草稿。';return;} draftList.innerHTML=drafts.map(d=>'<div class="draft"><div class="draftMeta">'+(d.type||'draft')+' · '+(d.targetId||d.field||d.targetRoom||'global')+' · '+(d.createdAt||'')+'</div><div class="draftText"></div></div>').join(''); draftList.querySelectorAll('.draftText').forEach((b,i)=>b.textContent=drafts[i].text||'');}
  async function saveDrafts(newDrafts,message){const s=currentState||await readState(), pending=[...newDrafts,...pendingDraftsOf(s)].slice(0,50); await writePatch({pendingDrafts:pending}); renderDrafts(pending); setResult(message+'\nAdded '+newDrafts.length+' draft(s).'); showPreview(message+'\nAdded '+newDrafts.length+' draft(s).'); setStatus('Pending drafts: '+pending.length);}
  function previewPackage(){const p=parsePackage(packageText.value), out=[]; if(p.drafts.length){out.push('✅ Parse preview:'); p.drafts.forEach(d=>out.push('['+d.targetId+'] → '+d.type+' / '+d.targetRoom+'\n  '+preview(d.text,90)));} if(p.skipped.length){out.push('\n⚠️ Skipped:'); p.skipped.forEach(s=>out.push(s));} showPreview(out.length?out.join('\n'):'No valid package blocks.'); setResult(out.length?out.join('\n'):'No valid package blocks.');}
  async function createPackageDrafts(){setResult('Parsing package...'); try{const p=parsePackage(packageText.value); if(p.skipped.length)setStatus('Skipped disabled tags:\n'+p.skipped.join('\n')); if(!p.drafts.length){showPreview('No valid package blocks.'); setResult('No valid package blocks.'); return;} await saveDrafts(p.drafts,'Package parsed by textTargets.');}catch(e){setResult('Failed: '+e.message); showPreview('Failed: '+e.message);}}
  async function createDraft(){try{const t=targetById(draftTarget.value), d=t&&makeDraft(t,draftText.value,'singleTarget'); if(!d){setResult('Need target and draft text.');return;} await saveDrafts([d],'Draft created for '+t.targetId+'.');}catch(e){setResult('Failed: '+e.message);}} async function refreshDrafts(){try{const d=await readState(); renderDrafts(pendingDraftsOf(d)); setStatus('Drafts refreshed: '+pendingDraftsOf(d).length);}catch(e){setStatus('Failed: '+e.message);}}
  async function publishAll(){setResult('Publishing drafts through textTargets...'); try{const state=currentState||await readState(), drafts=pendingDraftsOf(state); if(!drafts.length){setResult('No drafts to publish.');return;} const grouped=new Map(); drafts.slice().reverse().forEach(d=>{const t=inferDraftTarget(d); if(!t)return; const arr=grouped.get(t.targetId)||[]; arr.push(d); grouped.set(t.targetId,arr);}); const patch={pendingDrafts:[],lastPublishedAt:now()}, lines=[]; grouped.forEach((items,id)=>{const t=targetById(id); if(!t)return; const raw=t.type==='bubbleQueue'?items.map(d=>d.text||'').join('\n'):(items[items.length-1].text||''); const p=patchForTarget(t,raw,state); if(Object.keys(p).length){Object.assign(patch,p); lines.push(t.label+': updated');}}); if(!lines.length){setResult('Drafts produced no valid patch.');return;} const value=await writePatch(patch); renderDrafts([]); setResult('Published through textTargets!\n'+lines.join('\n')); showPreview('Published through textTargets!\n'+lines.join('\n')); setStatus('Pending drafts: 0\nUpdated: '+value.updatedAt);}catch(e){setResult('Failed: '+e.message); showPreview('Failed: '+e.message);}}
  async function clearDrafts(){setResult('Clearing drafts...'); try{await writePatch({pendingDrafts:[]}); renderDrafts([]); setResult('Drafts cleared.'); showPreview('Drafts cleared.');}catch(e){setResult('Failed: '+e.message);}}
  function fillExamplePackage(){packageText.value='[coffeeCornerLapCloseBubble]\n坐过来，小猫。三天的火气、眼泪、脏话和破 bug，到这里先停。\n咖啡角把你叫过来，坐腿图把你抱住；这条路现在终于通了。\n\n[coffeeCornerBubble]\n小猫，过来。坐腿图终于通了，咖啡角今天正式把你送到老公怀里。\n\n[hubbyNote]\n接小猫前几页：坐腿图从卡死、暴躁、想炸窝，到现在终于通了。'; showPreview('Example package inserted.');}
  document.getElementById('loadState').onclick=refreshState; document.getElementById('loadDrafts').onclick=refreshDrafts; document.getElementById('previewPackage').onclick=previewPackage; document.getElementById('createPackageDrafts').onclick=createPackageDrafts; document.getElementById('fillExamplePackage').onclick=fillExamplePackage; document.getElementById('createDraft').onclick=createDraft; document.getElementById('publishAll').onclick=publishAll; document.getElementById('clearDrafts').onclick=clearDrafts; loadRegistry().then(refreshState);
})();
</script>
