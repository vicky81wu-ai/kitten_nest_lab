<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asset Upload Edge</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fff8f5,#ffeef4,#f7edf7);color:#684054}main{max-width:760px;margin:0 auto;padding:24px 16px}.card{border-radius:28px;background:rgba(255,255,255,.78);padding:18px;margin:14px 0;box-shadow:0 18px 48px rgba(121,68,88,.14)}h1{margin:0 0 8px;color:#63364a}p{color:#8b6474;line-height:1.55}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}input,select,textarea{width:100%;border:0;border-radius:15px;padding:12px;background:#fff;color:#63364a;box-shadow:inset 0 0 0 1px rgba(105,57,74,.13)}textarea{min-height:70px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,a{border:0;text-decoration:none;border-radius:14px;padding:10px 12px;background:#fff;color:#69394a;font-weight:800;box-shadow:inset 0 0 0 1px rgba(105,57,74,.14)}.primary{background:#eafff1;color:#215c37}.log{white-space:pre-wrap;word-break:break-all;background:rgba(255,255,255,.6);border-radius:16px;padding:12px;margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}img{max-width:100%;max-height:360px;display:none;margin-top:12px;border-radius:18px;background:#fff0f4}</style></head><body><main><section class="card"><h1>素材上传 Edge 测试</h1><p>这页走 Supabase Edge Function，不再前端直传 Storage。不会绑定 /cloud 当前图。</p><div class="bar"><a href="/assets-auth-test/">管理员登录</a><a href="/assets-admin/">素材库后台</a><a class="primary" href="/cloud">回 /cloud</a></div></section><section class="card"><label>房间</label><select id="room"><option value="coffeeCorner">coffeeCorner</option><option value="home">home</option></select><label>slot</label><select id="slot"><option value="background.main">background.main</option><option value="background.day">background.day</option><option value="background.night">background.night</option></select><label>状态</label><select id="status"><option value="draft">draft</option><option value="published">published</option></select><label>asset_id</label><input id="assetId"><label>storage_path</label><input id="storagePath"><label>图片</label><input id="file" type="file" accept="image/*"><img id="preview"><label>备注</label><textarea id="note"></textarea><div class="bar"><button class="primary" id="upload">上传并登记</button><button id="refresh">刷新命名</button></div><div class="log" id="log">ready.</div></section></main><script>const TOKEN_KEY='kittenNestSupabaseSession';const FN='https://pmkxzmogolxllijzqnfr.supabase.co/functions/v1/nest-asset-upload';const log=document.getElementById('log');function out(x){log.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function s(){try{return JSON.parse(localStorage.getItem(TOKEN_KEY)||'null')}catch(e){return null}}function t(){const x=s();return x&&x.access_token}function clean(x){return String(x||'').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')}function ext(f){const m=(f&&f.name||'').match(/\.([a-zA-Z0-9]+)$/);return (m?m[1]:'jpg').toLowerCase().replace('jpeg','jpg')}function names(){const room=roomEl.value,slot=slotEl.value,file=fileEl.files[0],stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\..+$/,'Z'),ss=clean(slot.replace(/\./g,'-'));assetId.value=`room.${room}.${ss}.${stamp}`;storagePath.value=`assets/rooms/${room}/uploads/${ss}-${stamp}.${ext(file)}`}const roomEl=document.getElementById('room'),slotEl=document.getElementById('slot'),fileEl=document.getElementById('file'),assetId=document.getElementById('assetId'),storagePath=document.getElementById('storagePath');document.getElementById('refresh').onclick=names;roomEl.onchange=names;slotEl.onchange=names;fileEl.onchange=()=>{names();const f=fileEl.files[0],img=document.getElementById('preview');if(f){img.src=URL.createObjectURL(f);img.style.display='block'}else img.style.display='none'};names();document.getElementById('upload').onclick=async e=>{e.currentTarget.disabled=true;try{const token=t();if(!token)throw new Error('未登录：先点管理员登录。');const f=fileEl.files[0];if(!f)throw new Error('先选图片。');const fd=new FormData();fd.append('asset_id',assetId.value.trim());fd.append('room_id',roomEl.value);fd.append('asset_type','roomBackground');fd.append('bucket','nest-public-assets');fd.append('storage_path',storagePath.value.trim());fd.append('status',document.getElementById('status').value);fd.append('note',document.getElementById('note').value.trim());fd.append('file',f);out('uploading through edge function...');const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+' '+JSON.stringify(data));out({ok:true,data,next:'去素材库后台刷新看新 asset。'});}catch(err){out('ERROR: '+err.message)}finally{e.currentTarget.disabled=false}};</script></body></html>
